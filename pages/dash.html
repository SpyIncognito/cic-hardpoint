          `<div class="alist">${fleet.admiral.map((id) => { const m = fleetMember(id); return m ? `<div class="arow" data-member="${esc(id)}" data-st="${esc(m.status)}">${admiralInner(m)}</div>` : ''; }).join('')}</div>`;
      } else {
        body = fleet.groups.map((g, i) => {
          const named = g.id !== null;
          const last = fleet.groups.length - 2;
          const acts = named ? `<span class="acts"><button class="btn" data-f="up" data-g="${esc(g.id)}" type="button" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>` +
            `<button class="btn" data-f="down" data-g="${esc(g.id)}" type="button" title="Move down" ${i >= last ? 'disabled' : ''}>↓</button>` +
            `<button class="btn" data-f="rename" data-g="${esc(g.id)}" type="button" title="Rename">Rename</button>` +
            `<button class="btn danger" data-f="remove" data-g="${esc(g.id)}" type="button" title="Remove the group; its members go to Ungrouped">×</button></span>` : '<span></span>';
          const roll = g.rollup.downed ? esc(g.rollup.text).replace(/(\d+ downed)/, '<b>$1</b>') : esc(g.rollup.text);
          const cards = g.collapsed ? '' : `<div class="fcards">${g.members.map((id) => { const m = fleetMember(id); return m ? `<div class="fcard" draggable="true" data-member="${esc(id)}" data-st="${esc(m.status)}">${fleetCardInner(m)}</div>` : ''; }).join('') || '<div class="hint">Drag cards here</div>'}</div>`;
          return `<section class="fgroup" data-gid="${esc(g.id === null ? '' : g.id)}"><div class="fgroup-h">` +
            `<button class="chev" data-f="collapse" data-g="${esc(g.id === null ? '' : g.id)}" type="button" title="${g.collapsed ? 'Expand' : 'Collapse'}" ${named ? '' : 'disabled'}>${g.collapsed ? '▸' : '▾'}</button>` +
            `<span class="name">${esc(g.name)}</span>${acts}<span class="roll">${roll}</span></div>${cards}</section>`;
        }).join('');
      }
      el.innerHTML = `${head}<div class="fbody">${body}</div>`;
      for (const c of el.querySelectorAll('[data-member]')) { c._html = c.innerHTML; markFleetSel(c); }
    }
    function markFleetSel(c) {
      const on = c.dataset.member === fleetDetail;
      c.classList.toggle('sel', on);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.title = on ? 'Detail open: click again to close' : 'Click for the detail';
    }

    function fleetName(title, current) {
      return ask(title, `<label class="check" style="display:grid;gap:6px">Name <input id="fleet-name" maxlength="${fleet.limits.name}" value="${esc(current || '')}" /></label>`,
        [{ text: 'Cancel', value: null }, { text: 'Save', value: 'save', cls: 'primary' }]).then((c) => (c === 'save' ? $('fleet-name').value : null));
    }

    $('fleet').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-f]');
      if (b) {
        const act = b.dataset.f, gid = b.dataset.g;
        const g = fleet.view.groups.find((x) => x.id === gid);
        if (act === 'hide') { fleetOpen = false; try { localStorage.setItem(FLEET_OPEN_KEY, '0'); } catch { /* per-viewer only */ } layoutFleet(); renderBar(); }
        else if (act === 'add') { const name = await fleetName('New group'); if (name !== null) send({ type: 'fleet.group.add', name }); }
        else if (act === 'admiral') send({ type: 'fleet.admiral', on: !fleet.view.admiral });
        else if (act === 'fields') openFleetFields();
        else if (act === 'collapse' && g) send({ type: 'fleet.group.collapse', group: gid, collapsed: !g.collapsed });
        else if (act === 'rename' && g) { const name = await fleetName('Rename group', g.name); if (name !== null) send({ type: 'fleet.group.rename', group: gid, name }); }
        else if (act === 'remove' && g) {
          const c = await ask('Remove group', `<p>Remove the group ${esc(g.name)}? Its members go back to Ungrouped.</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Remove', value: 'remove', cls: 'danger' }]);
          if (c === 'remove') send({ type: 'fleet.group.remove', group: gid });
        } else if ((act === 'up' || act === 'down') && g) {
          const i = fleet.view.groups.indexOf(g);
          send({ type: 'fleet.group.move', group: gid, to: act === 'up' ? i - 1 : i + 1 });
        }
        return;
      }
      // A card or admiral row toggles its detail: the open one closes, another one switches to it.
      const card = e.target.closest('[data-member]');
      if (card) { if (card.dataset.member === fleetDetail) closeFleetDetail(); else openFleetDetail(card.dataset.member); }
    });
    // Drag a card onto a group (or onto a card, to go before it); Ungrouped takes it out of its group.
    $('fleet').addEventListener('dragstart', (e) => {
      const card = e.target.closest('.fcard');
      if (!card) return;
      fleetDrag = card.dataset.member;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', fleetDrag);
    });
    $('fleet').addEventListener('dragover', (e) => {
      const sec = fleetDrag && e.target.closest('.fgroup');
      if (!sec) return;
      e.preventDefault();
      for (const s of $('fleet').querySelectorAll('.fgroup.drop')) if (s !== sec) s.classList.remove('drop');
      sec.classList.add('drop');
    });
    $('fleet').addEventListener('drop', (e) => {
      const sec = fleetDrag && e.target.closest('.fgroup');
      if (!sec) return;
      e.preventDefault();
      const gid = sec.dataset.gid || null;
      const before = e.target.closest('.fcard');
      const g = gid && fleet.view.groups.find((x) => x.id === gid);
      const msg = { type: 'fleet.assign', member: fleetDrag, group: gid };
      if (g && before && before.dataset.member !== fleetDrag) {
        const i = g.members.filter((x) => x !== fleetDrag).indexOf(before.dataset.member);
        if (i >= 0) msg.index = i;
      }
      send(msg);
    });
    $('fleet').addEventListener('dragend', () => { fleetDrag = null; fleetBuilt = ''; renderFleet(); });

    // ------------------------------------------------------------ fleet: detail view and card fields

    function openFleetDetail(id) {
      fleetDetail = id;
      $('fleet-fields').hidden = true;
      send({ type: 'fleet.detail', member: id });
      renderFleetDetail();
      $('fleet-detail').hidden = false;
      renderFleet();
    }
    function closeFleetDetail() {
      if (!fleetDetail) return;
      fleetDetail = null;
      send({ type: 'fleet.detail', member: null });
      $('fleet-detail').hidden = true;
      if (fleet) renderFleet();
    }

    function renderFleetDetail() {
      const el = $('fleet-detail');
      const m = fleetMember(fleetDetail);
      if (!m || !fleetShown()) { closeFleetDetail(); return; }
      const f = m.fields;
      const kv = (pairs) => pairs.filter(([id]) => f[id]).map(([id, label]) => `<span>${esc(label)}</span><span class="t-${esc(f[id].tone)}">${esc(f[id].text)}</span>`).join('');
      const bars = (pairs) => pairs.map(([id, label]) => fleetBar(f[id], label)).join('');
      const shares = [m.sharing.ship && 'ship status', m.sharing.character && 'character status', m.sharing.detail && 'detail'].filter(Boolean).join(', ') || 'nothing';
      const shipBars = bars([['ship.shields', 'Shields'], ['ship.hull', 'Hull'], ['ship.fuel', 'Hydrogen'], ['ship.quantum', 'Quantum']]);
      const shipKv = kv([['ship.name', 'Ship'], ['ship.mode', 'Master mode'], ['ship.aboard', 'In a ship'], ['ship.cautions', 'Cautions'], ['ship.weapons', 'Weapons ready']]);
      const charBars = bars([['char.health', 'Health'], ['char.oxygen', 'Oxygen']]);
      const charKv = kv([['char.activity', 'Activity']]);
      const faces = f['detail.shield_faces'] && f['detail.shield_faces'].items;
      const power = f['detail.power'] && f['detail.power'].items;
      const detailKv = kv([['detail.speed', 'Speed'], ['detail.altitude', 'Altitude']]);
      const detail = !m.sharing.detail ? `<p class="note">${esc(m.handle)} does not share detail.</p>`
        : `${faces ? `<div class="fbars">${faces.map((r) => fleetBar(r, r.label)).join('')}</div>` : ''}` +
          `${power ? `<h4 style="margin-top:8px">Power</h4><div class="lamps">${power.map((r) => `<span class="t-${esc(r.tone)}" title="${esc(r.label)}: ${esc(r.text)}">${esc(r.label)}</span>`).join('')}</div>` : ''}` +
          `${detailKv ? `<div class="kv" style="margin-top:8px">${detailKv}</div>` : ''}` +
          (faces || power || detailKv ? '' : '<p class="note">Waiting for the detail fields.</p>');
      const groups = [{ id: '', name: 'Ungrouped' }, ...fleet.view.groups];
      el.innerHTML = `<div class="dhead"><h3>${esc(m.handle)}</h3>${chip(m.status)}<button class="btn" data-fd="close" type="button">Close</button></div>` +
        `<p class="note">Shares ${esc(shares)} · ${esc(updatedAgo(m.ageMs))}${fleet.demo ? ' · DEMO: mock peer from a recording' : ''}</p>` +
        `<label>Group <select id="fd-group">${groups.map((g) => opt(g.id, g.name, (m.group || '') === g.id)).join('')}</select></label>` +
        `<section><h4>Ship</h4>${m.sharing.ship ? `<div class="fbars">${shipBars}</div><div class="kv" style="margin-top:6px">${shipKv}</div>` : `<p class="note">${esc(m.handle)} does not share ship status.</p>`}</section>` +
        `<section><h4>Character</h4>${m.sharing.character ? `<div class="fbars">${charBars}</div><div class="kv" style="margin-top:6px">${charKv}</div>` : `<p class="note">${esc(m.handle)} does not share character status.</p>`}</section>` +
        `<section><h4>Shield faces, power, flight</h4>${detail}</section>`;
    }
    $('fleet-detail').addEventListener('click', (e) => { if (e.target.closest('[data-fd="close"]')) closeFleetDetail(); });
    $('fleet-detail').addEventListener('change', (e) => {
      if (e.target.id === 'fd-group' && fleetDetail) send({ type: 'fleet.assign', member: fleetDetail, group: e.target.value || null });
    });

    function openFleetFields() {
      closeFleetDetail();
      const el = $('fleet-fields');
      const on = new Set(fleet.view.fields);
      const box = (consent) => fleet.fields.filter((f) => f.consent === consent)
        .map((f) => `<label><input type="checkbox" data-ff="${esc(f.id)}" ${on.has(f.id) ? 'checked' : ''} /> ${esc(f.label)}</label>`).join('');
      el.innerHTML = '<h3>Card fields</h3><p class="note">What the member cards you see show. Only these are asked of each member, and each member still decides what they share.</p>' +
        `<div class="cols"><div><h4>Ship status</h4>${box('ship')}</div><div><h4>Character status</h4>${box('character')}</div></div>` +
        '<p class="note">Shield faces, power, speed and altitude come with the detail view only, while it is open.</p>' +
        '<div class="row"><button class="btn primary" data-ff-do="close" type="button">Done</button></div>';
      el.hidden = false;
    }
    $('fleet-fields').addEventListener('change', () => {
      const fields = [...$('fleet-fields').querySelectorAll('[data-ff]')].filter((x) => x.checked).map((x) => x.dataset.ff);
      send({ type: 'fleet.fields', fields });
    });
    $('fleet-fields').addEventListener('click', (e) => { if (e.target.closest('[data-ff-do="close"]')) $('fleet-fields').hidden = true; });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFleetDetail(); $('fleet-fields').hidden = true; if (dashPanel && !$('dlg').open) closeDashPanel(); } });

    // ------------------------------------------------------------ kiosk

    if (KIOSK) {
      document.body.classList.add('kiosk');
      let idle;
      const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if ($('kiosk-menu').hidden && $('bezel-panel').hidden) document.body.classList.add('idle'); }, 2000); };
      for (const ev of ['pointermove', 'pointerdown', 'keydown']) window.addEventListener(ev, wake, true);
      wake();

      // The hidden way out: hold Escape, or the top left corner, for 2 s.
      const EXIT_MS = 2000;
      let exit = null, swallowClick = false;
      const startExit = (via) => {
        if (exit || !$('kiosk-menu').hidden) return;
        const started = Date.now();
        exit = { via, timer: setInterval(() => {
          const f = (Date.now() - started) / EXIT_MS;
          $('exit-hint').style.display = f > 0.25 ? 'block' : 'none';
          $('exit-hint').firstElementChild.style.width = `${Math.min(1, f) * 100}%`;
          if (f >= 1) { swallowClick = via === 'corner'; stopExit(); openKioskMenu(); }
        }, 50) };
      };
      const stopExit = () => { if (!exit) return; clearInterval(exit.timer); exit = null; $('exit-hint').style.display = 'none'; };
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !e.repeat) startExit('key'); });
      window.addEventListener('keyup', (e) => { if (e.key === 'Escape') stopExit(); });
      window.addEventListener('pointerdown', (e) => { if (e.clientX < 48 && e.clientY < 48) startExit('corner'); }, true);
      window.addEventListener('pointerup', stopExit, true);
      window.addEventListener('pointercancel', stopExit, true);
      window.addEventListener('click', (e) => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

      if (WANT_FS) setTimeout(() => { if (!isFull()) $('fs-prompt').hidden = false; }, 600);
      $('fs-prompt').addEventListener('click', () => { $('fs-prompt').hidden = true; goFull(); });
    }

    const isFull = () => Boolean(document.fullscreenElement) || (innerWidth === screen.width && innerHeight === screen.height);

    /** Full screen on the display this window is on; needs a click or tap in this window. */
    async function goFull() {
      let opts = {};
      try {
        const granted = navigator.permissions && (await navigator.permissions.query({ name: 'window-management' })).state === 'granted';
        if (granted && hasScreens()) opts = { screen: (await window.getScreenDetails()).currentScreen };
      } catch { /* the permission name is not known everywhere */ }
      try { await document.documentElement.requestFullscreen(opts); } catch { notice('Full screen was refused; press F11', 'bad'); }
    }

    function openKioskMenu() {
      const m = $('kiosk-menu');
      const t = serverTab(currentId);
      m.innerHTML = `<h3>Kiosk menu</h3><p class="note">${esc(t ? t.name : ONLY)}. Hold Escape or the top left corner for 2 s to come back here.</p><div class="row">` +
        '<button class="btn primary" data-k="back" type="button">Back to the tab</button>' +
        `<button class="btn" data-k="map" type="button" ${t ? '' : 'disabled'}>Map bezel buttons</button>` +
        `<button class="btn" data-k="full" type="button">${document.fullscreenElement ? 'Leave full screen' : 'Full screen'}</button>` +
        '<button class="btn" data-k="dash" type="button">Open the full dashboard here</button>' +
        '<button class="btn" data-k="close" type="button">Close this window</button></div>';
      m.hidden = false;
      document.body.classList.remove('idle');
    }
    $('kiosk-menu').addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (!b) return;
      const k = b.dataset.k;
      $('kiosk-menu').hidden = true;
      if (k === 'map') openBezelPanel(currentId);
      else if (k === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else goFull(); }
      else if (k === 'dash') { if (APP) APP.request('dashboard'); else location.href = '/dash'; }
      else if (k === 'close') { if (APP) APP.request('close'); else window.close(); }
    });

    // ------------------------------------------------------------ bezel buttons

    function bindText(b) {
      if (b.kind === 'toggle') return `${toggleLabel(b.id)}: ${b.to ? b.to.toUpperCase() : 'toggle'}`;
      if (b.kind === 'mode') return `Master mode ${b.to}`;
      if (b.kind === 'sequence') return `Run ${(cat && (cat.sequences.find((s) => s.id === b.id) || {}).name) || b.id}`;
      return `${b.id}${isConfirm(b.id) ? ' (hold 1.5 s)' : ''}`;
    }
    const bezelText = (m) => (m.label ? `${m.label} (${bindText(m.bind)})` : bindText(m.bind));

    const bindKey = (b) => `${b.kind}|${b.id || ''}|${b.to || ''}`;
    function keyBind(k) {
      const [kind, id, to] = k.split('|');
      if (kind === 'mode') return { kind, to };
      if (kind === 'toggle') return to ? { kind, id, to } : { kind, id };
      return { kind, id };
    }
    function bezelOptions(cur) {
      const groups = [
        ['Toggles', cat.toggles.flatMap((t) => [[`toggle|${t.id}|`, `${t.label}: toggle`], [`toggle|${t.id}|on`, `${t.label}: ON`], [`toggle|${t.id}|off`, `${t.label}: OFF`]])],
        ['Master mode', [['mode||NAV', 'Master mode NAV'], ['mode||SCM', 'Master mode SCM']]],
        ['Sequences', cat.sequences.map((s) => [`sequence|${s.id}|`, s.name])],
        ['Game actions', cat.gameActions.map((a) => [`action|${a.name}|`, `${a.name}${a.confirm ? ' (hold 1.5 s)' : ''}`])],
      ];
      if (cur && !groups.some(([, l]) => l.some(([k]) => k === cur))) groups[3][1].unshift([cur, cur.split('|')[1]]);
      return groups.map(([g, l]) => `<optgroup label="${esc(g)}">${l.map(([k, t]) => opt(k, t, k === cur)).join('')}</optgroup>`).join('');
    }

    // The mapping being edited: the tab's id, the button just pressed, and the controller it came from.
    let mapping = null;

    function openBezelPanel(tabId) {
      mapping = { tab: tabId, button: null, padId: null };
      if (APP && KIOSK) APP.request('mapping', { active: true });
      $('bezel-panel').hidden = false;
      renderBezelPanel();
      if (!polling) poll();
    }
    function closeBezelPanel() {
      if (APP && KIOSK && mapping) APP.request('mapping', { active: false });
      mapping = null; $('bezel-panel').hidden = true;
    }

    function renderBezelPanel() {
      if (!mapping) return;
      const t = serverTab(mapping.tab);
      if (!t) { closeBezelPanel(); return; }
      if (!cat) return;
      const b = t.bezel || { gamepadId: '', buttons: [] };
      const pad = b.gamepadId || mapping.padId;
      const cur = mapping.button !== null ? b.buttons.find((m) => m.button === mapping.button) : null;
      const full = !cur && b.buttons.length >= meta.limits.bezelButtons;
      const learn = mapping.button === null
        ? `<div class="learn wait">Press a bezel button to map it, or to change what it does.</div>`
        : `<div class="learn"><div class="big">Button ${mapping.button}${cur ? ', mapped' : ', new'}</div>
            ${full ? `<p class="note">All ${meta.limits.bezelButtons} buttons are mapped; clear one first.</p>` : `
            <label>Does <select id="bz-bind">${bezelOptions(cur ? bindKey(cur.bind) : '')}</select></label>
            <label>Label <input id="bz-label" maxlength="${meta.limits.label}" value="${esc((cur && cur.label) || '')}" placeholder="optional" /></label>
            <p class="note">Game actions marked hold are sent after the button is held for 1.5 s.</p>
            <div class="row"><button class="btn primary" data-b="save" type="button">${cur ? 'Save button' : 'Map button'}</button><button class="btn" data-b="cancel" type="button">Cancel</button></div>`}</div>`;
      const rows = b.buttons.length
        ? b.buttons.map((m) => `<div class="map ${m.button === mapping.button ? 'on' : ''}"><b>${m.button}</b><span class="what"><span>${esc(m.label || bindText(m.bind))}</span>${m.label ? `<small>${esc(bindText(m.bind))}</small>` : ''}</span>` +
            `<span class="acts"><button class="btn" data-b="edit" data-n="${m.button}" type="button">Edit</button><button class="btn" data-b="clear" data-n="${m.button}" type="button">Clear</button></span></div>`).join('')
        : '<div class="empty">No buttons mapped yet.</div>';
      $('bezel-panel').innerHTML = `<h3>Bezel buttons: ${esc(t.name)}</h3>
        <p class="pad">${pad ? `Controller <b>${esc(pad)}</b>` : 'No controller yet: the first button pressed picks it.'}</p>
        ${learn}
        <div class="maps">${rows}</div>
        <p class="note">${b.buttons.length} of ${meta.limits.bezelButtons} mapped. Changes are saved at once.</p>
        <div class="row"><button class="btn danger" data-b="clear-all" type="button" ${b.buttons.length ? '' : 'disabled'}>Clear all</button>
          <button class="btn" data-b="relearn" type="button">Relearn on another controller</button>
          <button class="btn primary" data-b="done" type="button">Done</button></div>`;
    }

    function saveBezel(t, buttons, padId) {
      send({ type: 'dash.setBezel', tab: t.id, bezel: buttons.length || padId ? { gamepadId: padId, buttons } : null });
    }

    $('bezel-panel').addEventListener('click', async (e) => {
      const el = e.target.closest('[data-b]');
      if (!el || !mapping) return;
      const t = serverTab(mapping.tab);
      const b = (t && t.bezel) || { gamepadId: mapping.padId, buttons: [] };
      const act = el.dataset.b;
      if (act === 'done') return closeBezelPanel();
      if (act === 'cancel') { mapping.button = null; return renderBezelPanel(); }
      if (act === 'edit') { mapping.button = Number(el.dataset.n); return renderBezelPanel(); }
      if (act === 'clear') {
        const n = Number(el.dataset.n);
        if (mapping.button === n) mapping.button = null;
        return saveBezel(t, b.buttons.filter((m) => m.button !== n), b.gamepadId);
      }
      if (act === 'clear-all' || act === 'relearn') {
        const relearn = act === 'relearn';
        if (b.buttons.length) {
          const c = await ask(relearn ? 'Relearn bezel buttons' : 'Clear bezel buttons', `<p>${relearn ? 'Clear every mapped button, then map them again on the next controller you press.' : `Clear all ${b.buttons.length} mapped buttons?`}</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Clear all', value: 'clear', cls: 'danger' }]);
          if (c !== 'clear') return;
        }
        mapping.button = null;
        mapping.padId = null;
        send({ type: 'dash.setBezel', tab: t.id, bezel: null });
        renderBezelPanel();
        return;
      }
      if (act === 'save') {
        const bind = keyBind($('bz-bind').value);
        const label = $('bz-label').value.trim();
        const entry = { button: mapping.button, bind, ...(label ? { label } : {}) };
        const others = b.buttons.filter((m) => m.button !== mapping.button);
        const buttons = [...others, entry].sort((x, y) => x.button - y.button);
        mapping.button = null;
        saveBezel(t, buttons, b.gamepadId || mapping.padId);
      }
    });

    // Bezel buttons arrive as game-controller buttons, as on the MFD pages; only press and release edges count.
    let polling = false;
    const padPrev = new Map();
    function poll() {
      polling = true;
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const pad of pads) {
        if (!pad) continue;
        const before = padPrev.get(pad.index) || [];
        pad.buttons.forEach((b, i) => {
          if (b.pressed && !before[i]) onPadButton(pad, i);
          if (!b.pressed && before[i]) onPadRelease(pad, i);
        });
        padPrev.set(pad.index, pad.buttons.map((b) => b.pressed));
      }
      if (KIOSK || mapping) requestAnimationFrame(poll);
      else polling = false;
    }

    function onPadButton(pad, index) {
      if (mapping) {
        const t = serverTab(mapping.tab);
        const known = (t && t.bezel && t.bezel.gamepadId) || mapping.padId;
        if (known && pad.id !== known) { notice(`That button is on another controller (${pad.id}). Relearn to switch.`, 'bad'); return; }
        if (index > meta.limits.buttonIndex) { notice(`Button ${index} is past the last index the dashboard keeps (${meta.limits.buttonIndex})`, 'bad'); return; }
        mapping.padId = pad.id;
        mapping.button = index;
        renderBezelPanel();
        return;
      }
      if (!KIOSK || !$('kiosk-menu').hidden) return;
      if (APP && APP.nativeBezel) return;
      const t = serverTab(currentId);
      const m = t && t.bezel && t.bezel.gamepadId === pad.id && t.bezel.buttons.find((x) => x.button === index);
      if (m) bezelPress(m);
    }
    function onPadRelease(pad, index) {
      if (bezelHold && bezelHold.button === index) endBezelHold();
    }

    /** The same message a widget click sends; a confirm-group action is held 1.5 s like the widget. */
    function bezelPress(m) {
      const b = m.bind;
      if (b.kind === 'toggle') {
        if (b.to) send({ type: 'set', toggle: b.id, to: b.to });
        else { const t = vals && vals.toggles[b.id]; if (t) send(t.click); else notice(`${toggleLabel(b.id)}: no data from the game`, 'bad'); }
      } else if (b.kind === 'mode') send({ type: 'mode', to: b.to });
      else if (b.kind === 'sequence') runSequence(b.id);
      else if (!isConfirm(b.id)) send({ type: 'press', action: b.id });
      else startBezelHold(m);
    }

    let bezelHold = null;
    function startBezelHold(m) {
      if (bezelHold) endBezelHold();
      const action = m.bind.id;
      const started = Date.now();
      send({ type: 'hold.start', action });
      $('hold-text').textContent = `Hold: ${m.label || action}`;
      $('hold-bar').hidden = false;
      bezelHold = { button: m.button, action, timer: setInterval(() => {
        const f = (Date.now() - started) / HOLD_MS;
        $('hold-bar').querySelector('i').style.width = `${Math.min(1, f) * 100}%`;
        if (f >= 1) { bezelHold.sent = true; endBezelHold(); send({ type: 'press', action, confirmed: true }); }
      }, 50) };
    }
    function endBezelHold() {
      if (!bezelHold) return;
      clearInterval(bezelHold.timer);
      if (!bezelHold.sent) send({ type: 'hold.end', action: bezelHold.action });
      bezelHold = null;
      $('hold-bar').hidden = true;
      $('hold-bar').querySelector('i').style.width = '0';
    }

    if (APP) {
      let appHold = null;
      APP.on((e) => {
        if (e.type === 'notice') notice(e.text, e.tone);
        else if (e.type === 'hold') {
          const started = Date.now();
          clearInterval(appHold);
          $('hold-text').textContent = `Hold: ${e.label}`;
          $('hold-bar').hidden = false;
          appHold = setInterval(() => { $('hold-bar').querySelector('i').style.width = `${Math.min(1, (Date.now() - started) / HOLD_MS) * 100}%`; }, 50);
        } else if (e.type === 'holdEnd') {
          clearInterval(appHold);
          appHold = null;
          $('hold-bar').hidden = true;
          $('hold-bar').querySelector('i').style.width = '0';
        }
      });
    }

    if (KIOSK) poll();

    document.body.classList.toggle('editing', editing);
    connect();
  </script>
</body>
</html>

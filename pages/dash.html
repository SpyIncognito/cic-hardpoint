      const t = themeById(id) || themeFor(themeTab());
      themeEdit = { sel: t.id };
      themeDraft = clone(t);
      syncTheme(); drawAll(); renderThemePanel();
    }
    function openThemePanel() {
      if (!themes) return;
      $('theme-panel').hidden = false;
      document.body.classList.add('theming');
      selectTheme(themeFor(themeTab()).id);
      requestAnimationFrame(fit);
    }
    /** A theme the service just made or saved, ahead of its themes push. */
    function rememberTheme(t) {
      const i = themes.user.findIndex((x) => x.id === t.id);
      if (i >= 0) themes.user[i] = t; else themes.user.push(t);
    }
    async function closeThemePanel() {
      if (themeDirty() && (await ask('Unsaved theme', `<p>${esc(themeDraft.name)} has changes that are not saved.</p>`, [{ text: 'Keep editing', value: 'keep' }, { text: 'Discard', value: 'discard', cls: 'danger' }])) !== 'discard') return;
      themeEdit = null;
      themeDraft = null;
      $('theme-panel').hidden = true;
      document.body.classList.remove('theming');
      syncTheme(); drawAll(); renderPane();
      requestAnimationFrame(fit);
    }

    function renderThemePanel() {
      if (!themeEdit || !themes) return;
      if (!themeDraft || !themeById(themeDraft.id)) { selectTheme(themes.defaultTheme); return; }
      const t = themeDraft;
      const own = !isBuiltInTheme(t.id);
      const usedBy = (id) => [dash.theme === id ? 'the dashboard' : '', ...dash.tabs.filter((x) => x.theme === id).map((x) => x.name)].filter(Boolean);
      const rows = allThemes().map((x) => {
        const used = usedBy(x.id);
        const from = themeById(x.base);
        return `<div class="trow ${x.id === t.id ? 'on' : ''}" data-th="${esc(x.id)}"><span class="what"><b>${esc(x.name)}</b>` +
          `<small>${isBuiltInTheme(x.id) ? 'Built in' : `Yours, from ${esc(from ? from.name : x.base)}`}${used.length ? `; used by ${esc(used.join(', '))}` : ''}</small></span>` +
          `<span class="acts"><button class="btn" data-th-do="dup" data-id="${esc(x.id)}" type="button" ${themes.user.length >= themes.limits.themes ? 'disabled' : ''}>Duplicate</button>` +
          `${isBuiltInTheme(x.id) ? '' : `<button class="btn danger" data-th-do="remove" data-id="${esc(x.id)}" type="button">Remove</button>`}</span></div>`;
      }).join('');
      const editor = own
        ? `<div class="ted">
            <label>Name <input id="th-name" maxlength="${themes.limits.name}" value="${esc(t.name)}" /></label>
            <label>Font <select id="th-font">${themes.fonts.map((f) => opt(f, FONT_NAMES[f] || f, f === t.font)).join('')}</select></label>
            <label>Bars <select id="th-bars">${themes.bars.map((b) => opt(b, BAR_NAMES[b] || b, b === t.bars)).join('')}</select></label>
            <label class="check">Zeros <span><input type="checkbox" id="th-zeros" ${t.leadingZeros ? 'checked' : ''} /> dimmed leading zeros (0042)</span></label>
            <div class="colors">${themes.colorTokens.map((k) => `<label class="col"><span>${esc(TOKEN_NAMES[k] || k)}</span><input type="color" data-c="${esc(k)}" value="${esc(sixDigits(t.colors[k]))}" /><input class="hex" data-h="${esc(k)}" value="${esc(t.colors[k])}" maxlength="9" spellcheck="false" /></label>`).join('')}</div>
            <div id="th-contrast" class="cwarn">${contrastHtml(t)}</div>
            <p class="note">Colours are #rgb, #rrggbb or #rrggbbaa. Shapes and widget skins come from the theme it was made from.</p>
            <div class="row"><button class="btn primary" data-th-do="save" type="button" ${themeDirty() ? '' : 'disabled'}>Save theme</button><button class="btn" data-th-do="revert" type="button" ${themeDirty() ? '' : 'disabled'}>Revert</button></div>
          </div>`
        : `<p class="note ted">${esc(t.name)} is built in and cannot be changed. Duplicate it to make a theme of your own, then edit its colours.</p>`;
      $('theme-panel').innerHTML = `<h3>Themes</h3>
        <div class="tlist">${rows}</div>
        <p class="note">${themes.user.length} of ${themes.limits.themes} of your own. The page shows the selected theme while this is open.</p>
        ${editor}
        <div class="row end"><button class="btn primary" data-th-do="done" type="button">Done</button></div>`;
    }

    /** After a draft change: show it, and only touch the buttons, so typing keeps its focus. */
    function themeChanged() {
      syncTheme(); drawAll();
      for (const b of $('theme-panel').querySelectorAll('[data-th-do=save], [data-th-do=revert]')) b.disabled = !themeDirty();
      const warn = $('th-contrast');
      if (warn && themeDraft) warn.innerHTML = contrastHtml(themeDraft);
    }

    $('theme-panel').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-th-do]');
      const act = b && b.dataset.thDo;
      if (!b) {
        const row = e.target.closest('[data-th]');
        if (!row || row.dataset.th === themeDraft.id) return;
        if (themeDirty() && (await ask('Unsaved theme', `<p>${esc(themeDraft.name)} has changes that are not saved.</p>`, [{ text: 'Keep editing', value: 'keep' }, { text: 'Discard', value: 'discard', cls: 'danger' }])) !== 'discard') return;
        selectTheme(row.dataset.th);
        return;
      }
      if (act === 'done') return closeThemePanel();
      if (act === 'revert') { themeDraft = clone(themeById(themeDraft.id)); renderThemePanel(); themeChanged(); return; }
      if (act === 'save') {
        send({ type: 'theme.save', theme: themeDraft }, (r) => { if (r && r.theme) { notice('Theme saved', 'ok'); rememberTheme(r.theme); themeDraft = clone(r.theme); renderThemePanel(); } });
        return;
      }
      const id = b.dataset.id;
      if (act === 'dup') {
        if (themeDirty() && (await ask('Unsaved theme', `<p>${esc(themeDraft.name)} has changes that are not saved.</p>`, [{ text: 'Keep editing', value: 'keep' }, { text: 'Discard', value: 'discard', cls: 'danger' }])) !== 'discard') return;
        send({ type: 'theme.duplicate', theme: id }, (r) => { if (r && r.theme) { rememberTheme(r.theme); selectTheme(r.theme.id); } });
      } else if (act === 'remove') {
        const t = themeById(id);
        const c = await ask('Remove theme', `<p>Remove the theme ${esc(t.name)}? Tabs and the dashboard using it go back to the dashboard theme, then RSI.</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Remove', value: 'remove', cls: 'danger' }]);
        if (c === 'remove') send({ type: 'theme.remove', theme: id }, (r) => { if (r && !r.problems.length && themeDraft && themeDraft.id === id) selectTheme(themeFor(themeTab()).id); });
      }
    });
    $('theme-panel').addEventListener('input', (e) => {
      const el = e.target;
      if (!themeDraft || isBuiltInTheme(themeDraft.id)) return;
      if (el.id === 'th-name') themeDraft.name = el.value;
      else if (el.dataset.c) {
        themeDraft.colors[el.dataset.c] = el.value;
        $('theme-panel').querySelector(`[data-h="${el.dataset.c}"]`).value = el.value;
      } else if (el.dataset.h) {
        const v = el.value.trim();
        const ok = HEX.test(v);
        el.classList.toggle('bad', !ok);
        if (!ok) return;
        themeDraft.colors[el.dataset.h] = v.toLowerCase();
        $('theme-panel').querySelector(`[data-c="${el.dataset.h}"]`).value = sixDigits(v);
      } else return;
      themeChanged();
    });
    $('theme-panel').addEventListener('change', (e) => {
      if (!themeDraft || isBuiltInTheme(themeDraft.id)) return;
      const el = e.target;
      if (el.id === 'th-font') themeDraft.font = el.value;
      else if (el.id === 'th-bars') themeDraft.bars = el.value;
      else if (el.id === 'th-zeros') themeDraft.leadingZeros = el.checked;
      else return;
      themeChanged();
    });

    // ------------------------------------------------------------ fleet panel (Rust service only)

    // The service pushes `fleet` to a dashboard page after `dash.get`: the connection to a fleet
    // server, this player's key, what they send, and the cards in the event's structure (or the
    // viewer's own groups when the server sends none).
    let fleet = null, fleetDetail = null, fleetDrag = null;
    const FLEET_OPEN_KEY = 'sc-dash-fleet-open';
    // Open by default once a fleet has been joined; the viewer's own choice wins.
    let fleetOpenPref = (() => { try { const v = localStorage.getItem(FLEET_OPEN_KEY); return v === null ? null : v !== '0'; } catch { return null; } })();
    const fleetIsOpen = () => (fleetOpenPref === null ? Boolean(fleet && fleet.link.fleets.length) : fleetOpenPref);
    const setFleetOpen = (on) => { fleetOpenPref = on; try { localStorage.setItem(FLEET_OPEN_KEY, on ? '1' : '0'); } catch { /* per-viewer only */ } layoutFleet(); renderBar(); };
    const fleetShown = () => Boolean(fleet) && !ONLY && !onFleetTab();
    const fleetTabShown = () => Boolean(fleet) && onFleetTab();
    const fleetDown = '<div class="fhead"><div class="ftitle"><h2>Fleet</h2></div></div><div class="fbody"><p class="fempty">Connecting to Hardpoint...</p></div>';
    const fleetViews = () => [$('fleet'), $('fleet-full')];
    const fleetMember = (id) => fleet && fleet.members.find((m) => m.member === id);
    const fleetGroupName = (id) => { const g = fleet && fleet.groups.find((x) => x.id === id); return g ? g.name : (fleet && fleet.layout === 'event' ? 'Unassigned' : 'Ungrouped'); };
    const fleetEvent = () => fleet && fleet.layout === 'event';
    const admiralOn = () => fleet.view.admiral && fleet.admiralAllowed;
    const STATUS_TEXT = { UP: 'Up', DOWNED: 'Downed', DEAD: 'Dead', RESPAWNED: 'Respawned', OFFLINE: 'Offline', UNKNOWN: 'No status' };
    // One glyph per role, by fleet-proto's role names (Role::icon is the name with - for _): a star
    // for the admiral, chevrons for commanders, shapes for a ship's or squad's seats.
    const ROLE = { admiral: ['★', 'Admiral'], fleet_commander: ['∧∧', 'Fleet Commander'], wing_commander: ['∧∧', 'Wing Commander'], ground_commander: ['∧∧', 'Ground Commander'],
      squadron_commander: ['∧', 'Squadron Commander'], squad_commander: ['∧', 'Squad Commander'], captain: ['◆', 'Captain'],
      pilot: ['▲', 'Pilot'], copilot: ['△', 'Copilot'], crew: ['●', 'Crew'], soldier: ['■', 'Soldier'] };
    const CONSENT_GROUPS = [['ship', 'Ship status'], ['character', 'Character status'], ['detail', 'Detail (shield faces, power, flight)']];
    // Short labels as on the in-game HUD, so two bars fit side by side in every theme's font.
    const FLEET_BARS = [['ship.shields', 'SHLD', 'Shields'], ['ship.hull', 'HULL', 'Hull'], ['ship.fuel', 'H2', 'Hydrogen fuel'], ['ship.quantum', 'QT', 'Quantum fuel'], ['char.health', 'HP', 'Health'], ['char.oxygen', 'O2', 'Oxygen']];
    // The age is the service's; the clock time is worked out here, to the second so pushes do not flicker it.
    const updatedAt = (ms) => fmtWhen(Math.round((Date.now() - ms) / 1000) * 1000);
    const updatedAgo = (ms) => { const s = Math.floor(ms / 1000); return `${s < 60 ? `updated ${s} s ago` : `updated ${Math.floor(s / 60)} min ago`} · ${updatedAt(ms)}`; };
    const chip = (st) => `<span class="chip" data-st="${esc(st)}">${esc(STATUS_TEXT[st] || st)}</span>`;
    const roleIcons = (roles) => (roles || []).map((r) => ROLE[r] ? `<span class="role" data-role="${esc(r)}" title="${esc(ROLE[r][1])}" aria-label="${esc(ROLE[r][1])}">${ROLE[r][0]}</span>` : '').join('');
    const youTag = (m) => (m.me ? '<span class="you" title="Your card, as others receive it">YOU</span>' : '');
    const myRoles = () => [...new Set((fleet.link.grants || []).map((g) => g.role))].filter((r) => ROLE[r]).sort((a, b) => Object.keys(ROLE).indexOf(a) - Object.keys(ROLE).indexOf(b));
    /** A role from the tree ({ role, label, icon }): its glyph and its label. */
    const roleTag = (t, withLabel) => (t ? `<span class="role" data-role="${esc(t.role)}" title="${esc(t.label)}" aria-label="${esc(t.label)}">${(ROLE[t.role] || ['?'])[0]}</span>${withLabel ? `<span class="rlabel">${esc(t.label)}</span>` : ''}` : '');

    function onFleet(m) {
      const first = !fleet;
      fleet = m;
      if (dash) live('bar', renderBar);
      if (first && onFleetTab()) syncFleetTab();
      if (first || document.body.classList.contains('fleet-on') !== (fleetShown() && fleetIsOpen())) layoutFleet();
      live('fleet', () => renderFleetView($('fleet'), false));
      live('fleet-full', () => renderFleetView($('fleet-full'), true));
      if (fleetDetail) live('fleet-detail', renderFleetDetail);
      if (!$('fleet-join').hidden) live('fleet-join', renderFleetJoin);
      if (!$('fleet-host').hidden) live('fleet-host', renderFleetHost);
    }

    /** Into or out of the Fleet tab: the stage and the panel give way to the full view. */
    function syncFleetTab() {
      document.body.classList.toggle('fleet-tab', onFleetTab());
      if (onFleetTab()) syncTheme();
      layoutFleet();
      renderFleet();
    }

    function layoutFleet() {
      document.body.classList.toggle('fleet-on', fleetShown() && fleetIsOpen());
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(fit);
    }

    function fleetTools() {
      if (!fleetShown()) return '';
      const st = fleet.link.state;
      const dot = st === 'none' ? '' : `<span class="fdot" data-link="${esc(st)}" aria-hidden="true"></span>`;
      return `<button class="btn ${fleetIsOpen() ? 'on' : ''}" data-do="fleet" type="button" title="Show or hide the fleet panel">${dot}Fleet</button>`;
    }

    /** The connection line: where, the state, and what to do about it. */
    function fleetLinkLine() {
      const l = fleet.link;
      const where = l.event ? l.event.name : l.fleet ? l.fleet.address : '';
      const text = {
        none: 'Not in a fleet',
        connecting: l.choices ? `Choose an event on ${l.server || where}` : l.attempt ? `Connecting to ${where} (attempt ${l.attempt + 1})` : `Connecting to ${where}`,
        online: where,
        offline: `Fleet offline${l.retryMs ? `, trying again in ${Math.ceil(l.retryMs / 1000)} s` : ''}`,
        refused: `Refused: ${l.problem || 'by the server'}`,
      }[l.state];
      const p2p = l.fleet && !l.fleet.hosted;
      const why = (l.state === 'online' && p2p && l.server ? `<small>Host ${esc(l.server)}, key ${esc(l.fleet.fingerprint)}</small>` : '') +
        (l.state === 'offline' && l.problem ? `<small>${esc(l.problem)}</small>` : '') +
        (l.state === 'refused' && l.hint ? `<small class="fhint">${esc(l.hint)}</small>` : '');
      const roles = l.state === 'online' ? roleIcons(myRoles()) : '';
      return `<div class="flink" data-link="${esc(l.state)}"><span class="fdot" aria-hidden="true"></span><span class="ftext">${esc(text)}${why}</span>${roles}</div>`;
    }

    function fleetBar(f, label, title) {
      if (!f) return '';
      const w = typeof f.fraction === 'number' ? Math.max(0, Math.min(1, f.fraction)) * 100 : 0;
      return `<span class="l" title="${esc(title || label)}">${esc(label)}</span><span class="fbar t-${esc(f.tone)}"><i style="width:${w}%"></i></span><span class="v t-${esc(f.tone)}">${esc(f.text)}</span>`;
    }

    /** A card's extras from its place in the tree, kept on the element so a push can redraw it. */
    const placeOf = (el) => (el ? { seat: el.dataset.seat ? { role: el.dataset.seat, label: (ROLE[el.dataset.seat] || [, el.dataset.seat])[1] } : null, notAboard: el.dataset.na === '1' } : {});
    const placeAttrs = (seat, notAboard) => `${seat ? ` data-seat="${esc(seat.role.role)}"` : ''}${notAboard ? ' data-na="1"' : ''}`;
    /** The event's page in the CIC portal, where seats, roles and units are changed; none without the portal's address. */
    const cicLink = (cls, title) => (fleet.eventUrl ? `<a class="btn ${cls}" data-f="cic" href="${esc(fleet.eventUrl)}" target="_blank" rel="noopener noreferrer" title="${esc(title)}">Open in CIC</a>` : '');
    const seatCic = (place) => (place && place.seat && fleet.commander ? cicLink('mv', 'Change seats and leads in the CIC portal') : '');

    function fleetCardInner(m, place = {}) {
      if (m.ship) return shipCardInner(m);
      const f = m.fields;
      const shown = (x) => x && x.text !== DASH;
      const ship = m.sharing.ship ? [f['ship.name'], f['ship.mode']].filter(shown).map((x) => x.text).join(' · ') || 'Not in a ship' : 'No ship status shared';
      const where = shown(f['char.activity']) ? f['char.activity'] : f['ship.aboard'];
      // A dash bar says nothing on a small card (out of a ship, say); the detail view lists every field.
      const bars = FLEET_BARS.filter(([id]) => shown(f[id])).map(([id, label, title]) => fleetBar(f[id], label, title)).join('');
      const facts = [['ship.cautions', 'Cautions'], ['ship.weapons', 'Weapons'], ['ship.seat', 'Seat'], ['ship.crew_role', 'Crew role']].filter(([id]) => shown(f[id]))
        .map(([id, label]) => `<span><small>${esc(label)}</small><b class="t-${esc(f[id].tone)}">${esc(f[id].text)}</b></span>`).join('');
      const seat = place.seat ? `<span class="tag" title="Seat">${roleTag(place.seat, true)}</span>` : '';
      const na = place.notAboard ? '<span class="na" title="This card names another ship than the ship card: maybe not aboard">NOT ABOARD?</span>' : '';
      return `<div class="frow"><span class="who">${esc(m.handle)}</span>${roleIcons(m.roles)}${youTag(m)}${seat}${seatCic(place)}${chip(m.status)}</div>` +
        (na ? `<div class="frow">${na}</div>` : '') +
        `<div class="frow"><span class="sub">${esc(ship)}</span>${where ? `<span class="tag">${esc(where.text)}</span>` : ''}</div>` +
        (bars ? `<div class="fbars">${bars}</div>` : '') +
        (facts ? `<div class="ffacts">${facts}</div>` : '') +
        (m.ageMs === undefined ? '' : `<div class="fage">${esc(updatedAgo(m.ageMs))}</div>`);
    }

    /** A relay-built ship card: the ship's name, where its fields come from, and its bars. */
    function shipCardInner(m) {
      const f = m.fields;
      const shown = (x) => x && x.text !== DASH;
      const bars = FLEET_BARS.filter(([id]) => id.startsWith('ship.') && shown(f[id])).map(([id, label, title]) => fleetBar(f[id], label, title)).join('');
      const facts = [['ship.cautions', 'Cautions'], ['ship.weapons', 'Weapons'], ['ship.class', 'Class']].filter(([id]) => shown(f[id]))
        .map(([id, label]) => `<span><small>${esc(label)}</small><b class="t-${esc(f[id].tone)}">${esc(f[id].text)}</b></span>`).join('');
      const mode = shown(f['ship.mode']) ? `<span class="tag">${esc(f['ship.mode'].text)}</span>` : '';
      return `<div class="frow"><span class="shiptag">SHIP</span><span class="who">${esc(m.handle)}</span>${mode}</div>` +
        `<div class="frow"><span class="sub src" data-kind="${esc(m.source ? m.source.kind : '')}">${esc(m.sourceLabel || '')}</span></div>` +
        (bars ? `<div class="fbars">${bars}</div>` : '') +
        (facts ? `<div class="ffacts">${facts}</div>` : '') +
        `<div class="fage">${esc(updatedAgo(m.ageMs))}</div>`;
    }

    function admiralInner(m, place = {}) {
      if (m.ship) {
        const hull = m.fields['ship.hull'];
        return `${chip(m.status)}<span class="who"><span class="nm"><span class="shiptag">SHIP</span><b>${esc(m.handle)}</b></span><small>${esc(m.sourceLabel || '')}</small></span>` +
          `<span class="hp">${hull && hull.text !== DASH ? `<span class="t-${esc(hull.tone)}">${esc(hull.text)}</span><span class="fbar t-${esc(hull.tone)}"><i style="width:${(hull.fraction || 0) * 100}%"></i></span>` : `<span class="t-unknown">HULL ${DASH}</span>`}</span>` +
          `<span class="age" title="${esc(`Updated ${updatedAt(m.ageMs)}`)}">${esc(`${Math.floor(m.ageMs / 1000)} s`)}</span>`;
      }
      const h = m.fields['char.health'];
      const ship = m.fields['ship.name'];
      const where = place.seat ? `${place.seat.label}${ship && ship.text !== DASH ? `, ${ship.text}` : ''}` : ship && ship.text !== DASH ? ship.text : fleetGroupName(m.group);
      return `${chip(m.status)}<span class="who"><span class="nm"><b>${esc(m.handle)}</b>${place.seat ? roleTag(place.seat) : ''}${roleIcons(m.roles)}${youTag(m)}${place.notAboard ? '<span class="na" title="Maybe not aboard">?</span>' : ''}</span><small>${esc(where)}</small>${seatCic(place)}</span>` +
        `<span class="hp">${h ? `<span class="t-${esc(h.tone)}">${esc(h.text)}</span><span class="fbar t-${esc(h.tone)}"><i style="width:${(h.fraction || 0) * 100}%"></i></span>` : '<span class="t-unknown">HP ' + DASH + '</span>'}</span>` +
        `<span class="age" title="${esc(`Updated ${updatedAt(m.ageMs)}`)}">${esc(`${Math.floor(m.ageMs / 1000)} s`)}</span>`;
    }

    const rollHtml = (r) => (r.downed ? esc(r.text).replace(/(\d+ downed)/, '<b>$1</b>') : esc(r.text));

    /** One group, as cards or as condensed admiral rows. */
    function fleetGroupHtml(g, i, personal, condensed) {
      const named = g.id !== null;
      const last = fleet.groups.length - 2;
      const acts = personal && named && !condensed ? `<span class="acts"><button class="btn" data-f="up" data-g="${esc(g.id)}" type="button" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>` +
        `<button class="btn" data-f="down" data-g="${esc(g.id)}" type="button" title="Move down" ${i >= last ? 'disabled' : ''}>↓</button>` +
        `<button class="btn" data-f="rename" data-g="${esc(g.id)}" type="button" title="Rename">Rename</button>` +
        `<button class="btn danger" data-f="remove" data-g="${esc(g.id)}" type="button" title="Remove the group; its members go to Ungrouped">×</button></span>` : '<span></span>';
      const collapsed = personal && g.collapsed;
      const rows = g.members.map((id) => { const m = fleetMember(id); if (!m) return '';
        return condensed ? `<div class="arow" data-member="${esc(id)}" data-st="${esc(m.status)}">${admiralInner(m)}</div>`
          : `<div class="fcard" ${personal ? 'draggable="true"' : ''} data-member="${esc(id)}" data-st="${esc(m.status)}">${fleetCardInner(m)}</div>`; }).join('');
      const empty = personal && !condensed ? '<div class="hint">Drag cards here</div>' : '<div class="hint">Nobody here yet</div>';
      const cards = collapsed ? '' : `<div class="${condensed ? 'alist' : 'fcards'}">${rows || empty}</div>`;
      return `<section class="fgroup${condensed ? ' condensed' : ''}" data-gid="${esc(g.id === null ? '' : g.id)}"><div class="fgroup-h">` +
        `<button class="chev" data-f="collapse" data-g="${esc(g.id === null ? '' : g.id)}" type="button" title="${collapsed ? 'Expand' : 'Collapse'}" ${personal && named ? '' : 'disabled'}>${collapsed ? '▸' : '▾'}</button>` +
        `<span class="name">${esc(g.name)}${g.leaders && g.leaders.length ? `<small class="lead" title="Lead">${ROLE.squad_commander[0]} ${esc(g.leaders.map((k) => (fleetMember(k) || {}).handle).filter(Boolean).join(', ') || 'leader not here')}</small>` : ''}</span>` +
        `${acts}<span class="roll">${rollHtml(g.rollup)}</span></div>${cards}</section>`;
    }

    // ------------------------------------------------------------ fleet: the event's unit tree

    /** A member in the tree: their card when one came, else a row that says why not. */
    function seatHtml(p, seat, notAboard, condensed) {
      const m = fleetMember(p.member);
      if (m) {
        const attrs = placeAttrs(seat, notAboard);
        const place = placeOf({ dataset: { seat: seat && seat.role.role, na: notAboard ? '1' : '' } });
        return condensed ? `<div class="arow" data-member="${esc(p.member)}" data-st="${esc(m.status)}"${attrs}>${admiralInner(m, place)}</div>`
          : `<div class="fcard" data-member="${esc(p.member)}" data-st="${esc(m.status)}"${attrs}>${fleetCardInner(m, place)}</div>`;
      }
      const why = p.connected ? 'no card yet' : 'not connected yet';
      return `<div class="fnone" data-st="OFFLINE"><span class="who">${esc(p.handle)}</span>${seat ? `<span class="tag">${roleTag(seat.role, true)}</span>` : ''}<span class="why">${esc(why)}</span>` +
        `${seat ? seatCic({ seat }) : ''}</div>`;
    }
    const leadLine = (role, people) => (people.length ? `<small class="lead">${roleTag(role, true)} ${esc(people.map((p) => p.handle).join(', '))}</small>` : '');

    /** One unit and everything under it; a unit above the viewer's own shows its name and lead only. */
    function unitHtml(u, condensed) {
      const loose = u.leads.filter((p) => !p.seated && fleetMember(p.member)).map((p) => seatHtml(p, null, false, condensed)).join('');
      const ship = u.shipCard ? seatHtml({ member: u.shipCard, handle: u.name, connected: true }, null, false, condensed) : '';
      const seats = u.seats.map((s) => seatHtml(s, s, s.notAboard, condensed)).join('');
      const inner = loose + ship + seats;
      const kids = u.units.map((c) => unitHtml(c, condensed)).join('');
      const roll = u.open && (u.seats.length || u.units.length) ? `<span class="roll">${rollHtml(u.rollup)}</span>` : '';
      return `<section class="funit${condensed ? ' condensed' : ''}" data-kind="${esc(u.kind)}" data-uid="${esc(u.id)}"${u.fighter ? ' data-fighter="1"' : ''}${u.open ? '' : ' data-closed="1"'}>` +
        `<div class="funit-h"><span class="kind">${esc(u.kindLabel)}</span><span class="name">${esc(u.name)}</span>${leadLine(u.leadRole, u.leads)}${roll}</div>` +
        (inner ? `<div class="${condensed ? 'alist' : 'fcards'}">${inner}</div>` : '') +
        (kids ? `<div class="fkids">${kids}</div>` : '') +
        (u.open && !inner && !kids ? '<div class="fcards"><div class="hint">Nobody here yet</div></div>' : '') + '</section>';
    }

    /** The Unassigned bucket: names and whether each is connected, never card data. */
    function unassignedHtml() {
      if (!fleet.unassigned.length) return '';
      const rows = fleet.unassigned.map((p) => `<li><span class="who">${esc(p.handle)}</span><span class="why" data-on="${p.connected ? '1' : '0'}">${p.connected ? 'connected' : 'not connected yet'}</span>` +
        `${fleet.commander ? cicLink('mv', 'Place members in the CIC portal') : ''}</li>`).join('');
      return `<section class="funassigned"><div class="funit-h"><span class="name">Unassigned</span><span class="roll">${fleet.unassigned.length} waiting for a place</span></div><ul>${rows}</ul></section>`;
    }

    function treeHtml(condensed) {
      const t = fleet.tree;
      if (!fleet.placed) {
        const mine = fleet.members.find((m) => m.me);
        return `<div class="fempty"><p>You are Unassigned in ${esc(t.name)}. The admiral or a commander places you; until then your card goes to nobody else.</p></div>` +
          (mine ? `<div class="fcards"><div class="fcard" data-member="${esc(mine.member)}" data-st="${esc(mine.status)}">${fleetCardInner(mine)}</div></div>` : '');
      }
      const adm = t.admiral;
      const admCard = adm && !adm.seated && fleetMember(adm.member) ? `<div class="${condensed ? 'alist' : 'fcards'}">${seatHtml(adm, null, false, condensed)}</div>` : '';
      return `<section class="fevent"><div class="funit-h"><span class="kind">Event</span><span class="name">${esc(t.name)}</span>${adm ? leadLine(t.admiralRole, [adm]) : ''}<span class="roll">${rollHtml(t.rollup)}</span></div>${admCard}</section>` +
        t.units.map((u) => unitHtml(u, condensed)).join('') + unassignedHtml();
    }

    function chooserHtml() {
      const l = fleet.link;
      if (!l.choices.length) return '<div class="fempty"><p>None of your events is open yet. This list updates when one opens.</p></div>';
      return '<div class="fchoose"><p>You are in several events open now, pick one.</p><ul>' + l.choices.map((e) =>
        `<li><span class="fl"><b>${esc(e.name)}</b>${e.role ? `<small>${roleTag({ role: e.role, label: (ROLE[e.role] || [, e.role])[1] }, true)}</small>` : '<small>Unassigned</small>'}</span>` +
        `<button class="btn primary" data-f="choose" data-e="${esc(e.id)}" type="button">Join</button></li>`).join('') + '</ul></div>';
    }

    function renderFleet() {
      renderFleetView($('fleet'), false);
      renderFleetView($('fleet-full'), true);
    }

    /** The panel, or the Fleet tab when `full`: one view, rebuilt only when groups, order or
     * states change, so a flashing card keeps its beat. */
    function renderFleetView(el, full) {
      if (!(full ? fleetTabShown() : fleetShown())) { el.innerHTML = full && onFleetTab() ? fleetDown : ''; el._built = ''; return; }
      if (fleetDrag) return;
      const v = fleet.view, l = fleet.link;
      const condensed = admiralOn();
      const boarded = full && fbOn();
      const key = JSON.stringify([boarded, condensed, fleet.layout, fleet.admiralAllowed, fleet.sharing, l.state, l.event, l.retryMs, l.problem, l.hint, l.choices, l.grants, l.fleets.length,
        fleet.tree, fleet.unassigned, fleet.placed, fleet.commander, fleet.eventUrl, fleet.host && fleet.host.hosting, canHost(),
        fleet.wings.map((w) => [w.id, w.name, w.rollup.text, w.groups.map((g) => [g.id, g.name, g.collapsed, g.members, g.leaders, g.rollup.text])]),
        fleet.members.map((m) => [m.member, m.status, m.roles]), v.groups.length]);
      if (key === el._built) {
        for (const c of el.querySelectorAll('[data-member]')) {
          if (c.closest('.fboard')) continue;
          const m = fleetMember(c.dataset.member);
          if (!m) continue;
          const html = condensed ? admiralInner(m, placeOf(c)) : fleetCardInner(m, placeOf(c));
          if (c._html !== html) { c._html = html; c.innerHTML = html; }
          markFleetSel(c);
        }
        if (full) fbRender();
        return;
      }
      el._built = key;
      const r = fleet.rollup;
      const personal = fleet.layout === 'personal';
      const joined = l.state !== 'none';
      const settled = joined && !l.choices;
      const head = `<div class="fhead"><div class="ftitle"><h2>Fleet</h2>` +
        `<span class="share" data-on="${fleet.sharing ? '1' : '0'}" title="${fleet.sharing ? 'Your card is going out with the fields you chose' : 'You send no status: choose fields in What I send'}">${fleet.sharing ? 'Sharing on' : 'Sharing off'}</span>` +
        (full ? '' : '<button class="btn x" data-f="hide" type="button" title="Hide the fleet panel">Hide</button>') + '</div>' +
        fleetLinkLine() +
        (settled ? `<div class="froll">${esc(`${r.total} ${r.total === 1 ? 'member' : 'members'}: ${r.text}`)}</div>` : '') +
        `<div class="ftools"><button class="btn ${joined ? '' : 'primary'}" data-f="join" type="button" title="Join a fleet with an invite, or connect again">${joined ? 'Fleets' : 'Join a fleet'}</button>` +
        '<button class="btn" data-f="consent" type="button" title="Choose what your card sends, field by field">What I send</button>' +
        (canHost() ? `<button class="btn ${fleet.host.hosting ? 'on' : ''}" data-f="host" type="button" title="Host a peer-to-peer fleet from this PC">${fleet.host.hosting ? 'Hosting' : 'Host'}</button>` : '') +
        (fleet.admiralAllowed && settled ? `<button class="btn ${condensed ? 'on' : ''}" data-f="admiral" type="button" title="The same groups, condensed: one row per member, roll-ups per group and wing">Admiral view</button>` : '') +
        '<button class="btn" data-f="fields" type="button" title="Choose what the cards show">Card fields</button>' +
        (settled ? cicLink('', 'The event in the CIC portal: seats, roles and units are changed there') : '') +
        (personal && settled ? `<button class="btn" data-f="add" type="button" ${v.groups.length >= fleet.limits.groups ? 'disabled' : ''}>+ Group</button>` : '') + '</div></div>';
      let body;
      if (boarded) body = '<div class="fboard" data-keep="1"><div class="fbstate" id="fb-state" role="status"></div><div class="fblive"><div class="fbwrap"><div class="grid-stack" id="fb-board"></div></div><aside class="fbedit" id="fb-edit" hidden></aside></div></div>';
      else if (!joined) body = `<div class="fempty"><p>Not in a fleet. Paste a connection code from the CIC portal, or an invite from the fleet's host, to join; or Host one for your friends.</p><p class="fkey">Your fleet key <b>${esc(fleet.me.fingerprint)}</b></p></div>`;
      else if (l.choices) body = chooserHtml();
      else if (fleet.tree && l.state !== 'none') body = (condensed ? `<div class="ahead"><span><b>${r.downed}</b> downed</span><span><b>${r.dead}</b> dead</span><span><b>${r.up}</b> up</span><span><b>${r.offline}</b> offline</span></div>` : '') + treeHtml(condensed);
      else if (!fleet.members.length) body = `<p class="fempty">${l.state === 'online' ? 'No member cards yet.' : 'No member cards while the fleet is offline.'}</p>`;
      else {
        let gi = 0;
        body = (condensed ? `<div class="ahead"><span><b>${r.downed}</b> downed</span><span><b>${r.dead}</b> dead</span><span><b>${r.up}</b> up</span><span><b>${r.offline}</b> offline</span></div>` : '') +
          fleet.wings.map((w) => {
            const groups = w.groups.map((g) => fleetGroupHtml(g, gi++, personal, condensed)).join('');
            if (w.id === null) return groups;
            const cmd = w.commanders.map((k) => (fleetMember(k) || {}).handle).filter(Boolean).join(', ');
            return `<section class="fwing${condensed ? ' condensed' : ''}" data-wid="${esc(w.id)}"><div class="fwing-h"><span class="name">${esc(w.name)}</span>` +
              `${cmd ? `<small class="lead" title="Commander">${ROLE.wing_commander[0]} ${esc(cmd)}</small>` : ''}<span class="roll">${rollHtml(w.rollup)}</span></div>${groups}</section>`;
          }).join('');
      }
      // Patched in place, not replaced: a roll-up or state change every card update must not
      // reset the scroll, the focus or a running flash.
      const scroll = el.querySelector('.fbody');
      const top = scroll ? scroll.scrollTop : 0;
      const tpl = document.createElement('template');
      tpl.innerHTML = `${head}<div class="fbody${boarded ? ' fbmode' : ''}">${full && !boarded ? `<div class="fcols">${body}</div>` : body}</div>`;
      morph(el, tpl.content);
      const after = el.querySelector('.fbody');
      if (after && after.scrollTop !== top) after.scrollTop = top;
      for (const c of el.querySelectorAll('[data-member]')) { if (!c.closest('.fboard')) { c._html = c.innerHTML; markFleetSel(c); } }
      if (full) fbRender();
    }

    /** Makes `to`'s children match `from`'s, keeping every node whose tag already matches. */
    function morph(to, from) {
      const want = [...from.childNodes];
      while (to.childNodes.length > want.length) to.lastChild.remove();
      want.forEach((n, i) => {
        const have = to.childNodes[i];
        if (!have) { to.appendChild(n.cloneNode(true)); return; }
        if (have.nodeType !== n.nodeType || have.nodeName !== n.nodeName) { to.replaceChild(n.cloneNode(true), have); return; }
        if (n.nodeType !== Node.ELEMENT_NODE) { if (have.nodeValue !== n.nodeValue) have.nodeValue = n.nodeValue; return; }
        // The Fleet tab's board keeps its own DOM (gridstack's): it is drawn by fbRender.
        if (have.hasAttribute('data-keep') && n.hasAttribute('data-keep')) return;
        for (const { name } of [...have.attributes]) if (!n.hasAttribute(name)) have.removeAttribute(name);
        for (const { name, value } of n.attributes) if (have.getAttribute(name) !== value) have.setAttribute(name, value);
        morph(have, n);
      });
    }

    function markFleetSel(c) {
      const on = c.dataset.member === fleetDetail;
      c.classList.toggle('sel', on);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.title = on ? 'Detail open: click again to close' : 'Click for the detail';
    }

    function fleetName(title, current) {
      return ask(title, `<label class="check" style="display:grid;gap:6px">Name <input id="fleet-name" maxlength="${fleet.limits.name}" value="${esc(current || '')}" /></label>`,
        [{ text: 'Cancel', value: null }, { text: 'Save', value: 'save', cls: 'primary' }]).then((c) => (c === 'save' ? $('fleet-name').value : null));
    }

    function closeFleetOverlays(except) {
      for (const id of ['fleet-fields', 'fleet-join', 'fleet-consent', 'fleet-host']) if (id !== except) $(id).hidden = true;
      if (except !== 'fleet-detail') closeFleetDetail();
    }

    for (const view of fleetViews()) view.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-f]');
      if (b) {
        const act = b.dataset.f, gid = b.dataset.g;
        const g = fleet.view.groups.find((x) => x.id === gid);
        if (act === 'hide') setFleetOpen(false);
        else if (act === 'choose') send({ type: 'fleet.choose', event: b.dataset.e }, (r) => { if (r && r.problems && r.problems.length) notice(r.problems[0], 'bad'); });
        // APP is this page's own app, so on a companion the portal opens there, not on the game PC.
        else if (act === 'cic' && APP) {
          e.preventDefault();
          const r = await APP.request('openUrl', { url: b.getAttribute('href') });
          if (!r || !r.ok) notice((r && r.text) || 'Could not open the CIC portal', 'bad');
        }
        else if (act === 'add') { const name = await fleetName('New group'); if (name !== null) send({ type: 'fleet.group.add', name }); }
        else if (act === 'admiral') send({ type: 'fleet.admiral', on: !fleet.view.admiral });
        else if (act === 'fields') openFleetFields();
        else if (act === 'join') openFleetJoin();
        else if (act === 'consent') openFleetConsent();
        else if (act === 'host') openFleetHost();
        else if (act === 'collapse' && g) send({ type: 'fleet.group.collapse', group: gid, collapsed: !g.collapsed });
        else if (act === 'rename' && g) { const name = await fleetName('Rename group', g.name); if (name !== null) send({ type: 'fleet.group.rename', group: gid, name }); }
        else if (act === 'remove' && g) {
          const c = await ask('Remove group', `<p>Remove the group ${esc(g.name)}? Its members go back to Ungrouped.</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Remove', value: 'remove', cls: 'danger' }]);
          if (c === 'remove') send({ type: 'fleet.group.remove', group: gid });
        } else if ((act === 'up' || act === 'down') && g) {
          const i = fleet.view.groups.indexOf(g);
          send({ type: 'fleet.group.move', group: gid, to: act === 'up' ? i - 1 : i + 1 });
        }
        return;
      }
      // A card or admiral row toggles its detail: the open one closes, another one switches to it.
      const card = e.target.closest('[data-member]');
      if (card) { if (card.dataset.member === fleetDetail) closeFleetDetail(); else openFleetDetail(card.dataset.member); }
    });
    // Drag a card onto a group (or onto a card, to go before it); Ungrouped takes it out of its group.
    // Only the viewer's own groups: an event's groups are the server's.
    for (const view of fleetViews()) view.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.fcard');
      if (!card || fleetEvent()) return;
      fleetDrag = card.dataset.member;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', fleetDrag);
    });
    for (const view of fleetViews()) view.addEventListener('dragover', (e) => {
      const sec = fleetDrag && e.target.closest('.fgroup');
      if (!sec) return;
      e.preventDefault();
      for (const s of e.currentTarget.querySelectorAll('.fgroup.drop')) if (s !== sec) s.classList.remove('drop');
      sec.classList.add('drop');
    });
    for (const view of fleetViews()) view.addEventListener('drop', (e) => {
      const sec = fleetDrag && e.target.closest('.fgroup');
      if (!sec) return;
      e.preventDefault();
      const gid = sec.dataset.gid || null;
      const before = e.target.closest('.fcard');
      const g = gid && fleet.view.groups.find((x) => x.id === gid);
      const msg = { type: 'fleet.assign', member: fleetDrag, group: gid };
      if (g && before && before.dataset.member !== fleetDrag) {
        const i = g.members.filter((x) => x !== fleetDrag).indexOf(before.dataset.member);
        if (i >= 0) msg.index = i;
      }
      send(msg);
    });
    for (const view of fleetViews()) view.addEventListener('dragend', () => { fleetDrag = null; for (const v of fleetViews()) v._built = ''; renderFleet(); });

    // ------------------------------------------------------------ fleet: the Fleet tab's board

    // The Fleet tab as a board of objects, as the CIC Live board: every unit object is its own
    // people on top and its own grid below, by default its child units side by side (unit-grid.js,
    // copied from cic-panel, has the rules). Cells are square and fixed in px; the board scrolls
    // inside its box from the top left. Layouts are saved per CIC event and one for peer to peer.
    const UG = window.UnitGrid;
    const FB = { key: '', saved: null, loaded: false, source: 'starter', layout: null, editing: false, changed: false, selected: null, note: '', board: null, grids: [], items: new Map(), sig: '', made: 0, moving: false, fitting: false, rebuildDue: false, settling: false, movedAt: -Infinity };
    const fbNewId = () => `o${Date.now().toString(36)}${(FB.made += 1)}`;
    const fbCell = () => (FB.layout && FB.layout.cell) || UG.DEFAULT_CELL;
    const fbKey = () => (fleetEvent() && fleet.tree ? `event:${fleet.tree.id}` : 'p2p');
    /** The board takes the Fleet tab once there is something to arrange. */
    const fbOn = () => Boolean(UG && fleet && onFleetTab() && fleet.link.state !== 'none' && !fleet.link.choices &&
      (fleetEvent() ? Boolean(fleet.tree && fleet.placed) : fleet.members.length > 0));
    const fbEditable = () => fbOn() && window.innerWidth >= 900;

    /** The unit tree as unit-grid.js takes it: an event's units, or the viewer's own groups. */
    function fbView() {
      const units = [];
      const unitOf = new Map();
      if (fleetEvent() && fleet.tree) {
        const add = (list, parent) => list.forEach((u) => {
          units.push({ id: u.id, parent, kind: u.kind, name: u.name, node: u });
          for (const s of u.seats) unitOf.set(s.member, u.id);
          for (const p of u.leads) if (!unitOf.has(p.member)) unitOf.set(p.member, u.id);
          if (u.shipCard) unitOf.set(u.shipCard, u.id);
          add(u.units, u.id);
        });
        add(fleet.tree.units, null);
      } else {
        for (const g of fleet.groups) {
          if (g.id === null) continue;
          units.push({ id: g.id, parent: null, kind: 'group', name: g.name, group: g });
          for (const m of g.members) unitOf.set(m, g.id);
        }
      }
      const byId = new Map(units.map((u) => [u.id, u]));
      const kids = (id) => units.filter((u) => (u.parent || null) === (id || null));
      const subtree = (id) => { const out = []; const walk = (u) => { out.push(u); kids(u.id).forEach(walk); }; if (byId.has(id)) walk(byId.get(id)); return out; };
      const membersUnder = (id) => [...unitOf.entries()].filter(([, u]) => subtree(id).some((x) => x.id === u)).map(([m]) => m);
      return { units, byId, kids, subtree, membersUnder, unitOf: (m) => unitOf.get(m) || null, top: kids(null) };
    }

    /** The viewer's rank, for the starter: admiral, commander, lead or seat. */
    function fbTier() {
      const roles = myRoles();
      if (roles.includes('admiral')) return 'admiral';
      if (roles.some((r) => /_commander$/.test(r) && !/^squad(ron)?_/.test(r))) return 'commander';
      if (roles.some((r) => ['squadron_commander', 'squad_commander', 'captain'].includes(r))) return 'lead';
      return 'seat';
    }

    /** The starter for the viewer's rank, as the CIC board's, in cells of the default size. Unit
     * objects come without children: each gets its default grid (its child units side by side). */
    function fbStarter(v) {
      const C = UG.COLUMNS;
      const objects = [];
      let n = 0;
      const add = (kind, x, y, w, h, extra) => { const o = Object.assign({ id: `o${++n}`, kind, x, y, w, h }, extra || {}); objects.push(o); return o; };
      const detailsPx = fbDetailsModel(v);
      const unit = (u, x, y, w, look) => add('unit', x, y, w, UG.naturalRows(u.id, v, { cols: w, cell: UG.DEFAULT_CELL, detailsPx, look }), { bind: u.id, look });
      if (!fleetEvent()) {
        add('rollup', 0, 0, 6, 1, { label: 'Everyone' });
        add('alerts', 6, 0, 6, 2);
        const groups = v.top.map((u) => unit(u, 0, 0, 12, 'cards'));
        UG.placeSideBySide(groups, C, 2);
        let y = groups.reduce((m, o) => Math.max(m, o.y + o.h), 2);
        const loose = fleet.members.filter((m) => !m.ship && !v.unitOf(m.member)).slice(0, UG.MAX_OBJECTS - objects.length);
        loose.forEach((m, i) => add('member', (i % 6) * 4, y + Math.floor(i / 6) * 3, 4, 3, { bind: m.member, look: 'full' }));
        return UG.serializeLayout({ cell: UG.DEFAULT_CELL, objects });
      }
      const me = fleet.me.member;
      let mine = v.units.find((u) => u.node.leads.some((p) => p.member === me)) || v.byId.get(v.unitOf(me));
      const above = mine && v.byId.get(mine.parent);
      if (mine && mine.kind === 'ship' && above && above.kind === 'squadron') mine = above;
      switch (fbTier()) {
        case 'admiral': {
          const shown = v.top.slice(0, 5);
          const rw = Math.max(3, Math.floor(18 / (1 + shown.length)));
          // Three cells, as on the CIC board: three alert rows fit at 72 px.
          add('rollup', 0, 0, rw, 3, { label: 'Event' });
          shown.forEach((u, i) => add('rollup', (i + 1) * rw, 0, rw, 3, { bind: u.id }));
          add('alerts', 18, 0, 6, 3);
          let y = 3;
          for (const u of v.top) y += unit(u, 0, y, C, 'condensed').h;
          add('unassigned', 0, y, 8, 3);
          break;
        }
        case 'commander': {
          add('rollup', 0, 0, 6, 1, mine ? { bind: mine.id } : {});
          if (mine) unit(mine, 0, 1, 18, 'condensed');
          add('alerts', 18, 0, 6, 3, mine ? { bind: mine.id } : {});
          add('unassigned', 18, 3, 6, 3);
          break;
        }
        default: {
          if (!mine) { add('member', 0, 0, 4, 3, { bind: me, look: 'full' }); break; }
          unit(mine, 0, 0, 16, 'cards');
          let y = 0;
          const fleetShip = mine.kind === 'ship' && above && above.kind === 'fleet';
          // At 72 px a ship card shows in full in three cells.
          if (fleetShip) { add('ship', 16, y, 8, 3, { bind: `ship:${mine.id}` }); y += 3; }
          add('rollup', 16, y, 8, 1, { bind: mine.id }); y += 1;
          if (fbTier() === 'lead') add('alerts', 16, y, 8, 3, { bind: mine.id });
        }
      }
      return UG.serializeLayout({ cell: UG.DEFAULT_CELL, objects });
    }

    // ---- what each object shows

    const fbHint = (text) => `<p class="hint">${esc(text)}</p>`;
    const fbCondensed = (o) => o.look === 'condensed' || o.look === 'compact' || admiralOn();

    /** A member's card, or a row saying why there is none. */
    function fbPerson(member, condensed) {
      const m = fleetMember(member);
      if (m) return condensed ? `<div class="arow" data-member="${esc(member)}" data-st="${esc(m.status)}">${admiralInner(m)}</div>` : `<div class="fcard" data-member="${esc(member)}" data-st="${esc(m.status)}">${fleetCardInner(m)}</div>`;
      return '';
    }

    /** A unit object's top: the unit's own people (leads, the ship card, seats; a group's
     * members), less anyone placed as a card in its grid. */
    function fbUnitTop(o, u, depth, v) {
      const condensed = fbCondensed(o);
      const placed = new Set((o.children || []).filter((c) => c.kind === 'member' || c.kind === 'ship').map((c) => c.bind));
      const list = (inner) => (inner ? `<div class="${condensed ? 'alist' : 'fcards'}">${inner}</div>` : '');
      if (u.group) {
        const inner = u.group.members.filter((m) => !placed.has(m)).map((m) => fbPerson(m, condensed)).join('');
        return list(inner) || (UG.isContainer(o) ? '' : fbHint('Nobody in this group yet'));
      }
      const n = u.node;
      if (!n.open) return n.leads.length ? `<p class="leadline">${leadLine(n.leadRole, n.leads)}</p>` : '';
      const loose = n.leads.filter((p) => !p.seated && fleetMember(p.member) && !placed.has(p.member)).map((p) => seatHtml(p, null, false, condensed)).join('');
      const ship = n.shipCard && !placed.has(n.shipCard) ? seatHtml({ member: n.shipCard, handle: n.name, connected: true }, null, false, condensed) : '';
      const seats = n.seats.filter((s) => !placed.has(s.member)).map((s) => seatHtml(s, s, s.notAboard, condensed)).join('');
      const kids = UG.mayHold(o, depth) ? '' : n.units.map((c) => unitHtml(c, condensed)).join('');
      const inner = loose + ship + seats;
      if (!inner && !kids) return UG.isContainer(o) || v.kids(u.id).length ? '' : fbHint('Nobody here yet');
      return list(inner) + (kids ? `<div class="fkids">${kids}</div>` : '');
    }

    function fbRollupOf(o, v) {
      if (!o.bind) return fleetEvent() && fleet.tree ? fleet.tree.rollup : fleet.rollup;
      const u = v.byId.get(o.bind);
      return u && (u.group ? u.group.rollup : u.node.open ? u.node.rollup : null);
    }

    function fbBody(o, depth, parent, v) {
      if (parent && parent.bind && o.bind && v.byId.has(parent.bind) && o.kind !== 'rollup' && o.kind !== 'alerts') {
        const id = o.bind.replace(/^ship:/, '');
        const under = o.kind === 'member' ? v.membersUnder(parent.bind).includes(o.bind) || !v.unitOf(o.bind) : !v.byId.has(id) || v.subtree(parent.bind).some((x) => x.id === id);
        if (!under) return fbHint('Not in this unit');
      }
      switch (o.kind) {
        case 'unit': {
          const u = v.byId.get(o.bind);
          return u ? fbUnitTop(o, u, depth, v) : fbHint(o.bind ? 'Unit not in this fleet' : 'No unit chosen');
        }
        case 'member': {
          const card = fbPerson(o.bind, fbCondensed(o));
          if (card) return card;
          const p = fleetEvent() && fleet.tree ? [...fbView().units.flatMap((u) => [...u.node.leads, ...u.node.seats])].find((x) => x.member === o.bind) : null;
          return fbHint(p ? `${p.handle}: ${p.connected ? 'no card yet' : 'not connected yet'}` : 'No card from this member');
        }
        case 'ship': return fbPerson(o.bind, fbCondensed(o)) || fbHint('No ship card yet');
        case 'rollup': {
          const r = fbRollupOf(o, v);
          if (!r) return fbHint(o.bind && !v.byId.has(o.bind) ? 'Unit not in this fleet' : 'Not in your view');
          const parts = [[r.downed, 'downed', 'bad'], [r.dead, 'dead', 'bad'], [r.offline, 'offline', ''], [r.unknown, 'no status', '']].filter(([n]) => n);
          return `<div class="rbig"><b>${r.up}</b><span>/${r.total} up</span>${parts.map(([n, what, t]) => `<span class="rp${t ? ` ${t}` : ''}">${n} ${what}</span>`).join('')}</div>`;
        }
        case 'alerts': {
          const within = o.bind ? new Set(v.membersUnder(o.bind)) : null;
          const list = fleet.members.filter((m) => !m.ship && (m.status === 'DOWNED' || m.status === 'DEAD') && (!within || within.has(m.member)));
          if (!list.length) return '<p class="hint ok">No one downed or dead.</p>';
          return `<div class="alist">${list.map((m) => `<div class="arow" data-member="${esc(m.member)}" data-st="${esc(m.status)}">${admiralInner(m)}</div>`).join('')}</div>`;
        }
        case 'unassigned': {
          const names = fleetEvent() ? (fleet.commander ? fleet.unassigned : null) : fleet.members.filter((m) => !m.ship && !v.unitOf(m.member)).map((m) => ({ handle: m.handle, connected: m.status !== 'OFFLINE' }));
          if (!names) return fbHint('Shown to commanders and the admiral');
          if (!names.length) return fbHint(fleetEvent() ? 'Everyone is placed.' : 'Everyone is in a group.');
          return `<ul class="names">${names.map((p) => `<li><span class="who">${esc(p.handle)}</span><span class="why" data-on="${p.connected ? 1 : 0}">${p.connected ? 'connected' : 'not connected'}</span></li>`).join('')}</ul>`;
        }
        case 'header': {
          const r = fbRollupOf({}, v);
          return `<div class="evhead"><b>${esc(fleetEvent() && fleet.tree ? fleet.tree.name : 'Peer to peer')}</b><span>${rollHtml(r)}</span></div>`;
        }
        case 'timeline': return fbHint('The timeline is on the CIC Live board.');
        default: return '';
      }
    }

    function fbTitle(o, v) {
      if (!o) return 'Board';
      if (o.label) return o.label;
      const k = UG.KINDS[o.kind].label;
      const unit = (id) => { const u = v.byId.get(id); return u ? u.name : ''; };
      if (o.kind === 'unit' || o.kind === 'rollup' || o.kind === 'alerts') return o.bind ? unit(o.bind) || k : o.kind === 'unit' ? k : `${k}: ${fleetEvent() ? 'event' : 'everyone'}`;
      if (o.kind === 'member') return (fleetMember(o.bind) || {}).handle || k;
      if (o.kind === 'ship') return unit(String(o.bind || '').replace(/^ship:/, '')) || k;
      return k;
    }

    function fbHead(o, v) {
      const fresh = o.isNew ? '<span class="newtag">New</span>' : '';
      if (o.kind !== 'unit') return `<span class="ot">${esc(fbTitle(o, v))}</span>${fresh}<span class="ok">${esc(UG.KINDS[o.kind].label)}</span>`;
      const u = v.byId.get(o.bind);
      const r = fbRollupOf(o, v);
      const kind = u ? (u.group ? 'Group' : u.node.kindLabel) : 'Unit';
      const lead = u && !u.group && u.node.open && u.node.leads.length ? leadLine(u.node.leadRole, u.node.leads) : '';
      return `<span class="ot">${esc(fbTitle(o, v))}</span>${fresh}${lead}${r && r.total ? `<span class="roll">${rollHtml(r)}</span>` : ''}<span class="ok">${esc(kind)}</span>`;
    }

    /** Patches an element to new HTML in place, so cards keep their nodes (and a flash its beat). */
    function fbSet(el, html) {
      if (el._html === html) return;
      el._html = html;
      const tpl = document.createElement('template');
      tpl.innerHTML = html;
      morph(el, tpl.content);
    }

    function fbDraw(o, depth, parent, v) {
      const it = FB.items.get(o.id);
      if (!it) return;
      fbSet(it.head, fbHead(o, v));
      const body = fbBody(o, depth, parent, v);
      fbSet(it.body, body);
      it.body.hidden = o.kind === 'unit' && !body;
      it.content.dataset.kind = o.kind;
      const u = o.kind === 'unit' && v.byId.get(o.bind);
      if (u) it.content.dataset.unit = u.kind;
      if (o.kind === 'unit') it.content.dataset.tier = String(UG.titleTier(depth, u, v));
      it.content.dataset.align = UG.titleAlign(o, depth);
      it.content.classList.toggle('sel', FB.editing && FB.selected === o.id);
      // Only the selected object resizes, so a unit's handle never covers one inside it. The
      // attribute goes too: gridstack reads it again when a unit around the object is resized.
      const resizable = FB.editing && FB.selected === o.id;
      const node = it.el.gridstackNode;
      if (FB.editing && node && !node.noResize !== resizable) {
        if (resizable) it.el.removeAttribute('gs-no-resize'); else it.el.setAttribute('gs-no-resize', 'true');
        it.grid.resizable(it.el, resizable);
      }
      for (const c of it.body.querySelectorAll('[data-member]')) markFleetSel(c);
    }

    // ---- the grids

    const fbGridOpts = (column) => ({ column, cellHeight: fbCell(), margin: UG.OBJECT_INSET_PX, float: true, animate: false, staticGrid: !FB.editing, alwaysShowResizeHandle: true, handle: '.oh', acceptWidgets: false });

    function fbTeardown() {
      for (const g of FB.grids.slice(1).reverse()) g.grid.destroy(false);
      FB.grids = FB.grids.slice(0, 1);
      FB.items.clear();
      if (FB.board) FB.board.removeAll(true);
    }

    /** Gives unit objects with no grid their default one, each child unit as tall as it takes to
     * show in full; a unit whose grid was reset or that was just added grows to show it. */
    function fbFill(v) {
      UG.fillDefaults(FB.layout.objects, v, { nextId: fbNewId, cell: fbCell(), detailsPx: fbDetailsModel(v) });
      UG.clampTo(FB.layout.objects, UG.COLUMNS);
    }

    function fbBuild(v) {
      const host = document.getElementById('fb-board');
      if (!host) return;
      fbFill(v);
      if (!FB.board || FB.board.el !== host) {
        if (FB.board) for (const g of FB.grids.slice().reverse()) g.grid.destroy(false);
        FB.board = GridStack.init(fbGridOpts(UG.COLUMNS), host);
        FB.grids = [{ grid: FB.board, owner: null }];
        // Gridstack reports a drag or resize inside a unit's grid here too: the grid it sat in is edited.
        const edited = (el) => { FB.changed = true; if (el && el.gridstackNode) UG.touchParent(FB.layout.objects, el.gridstackNode.id); };
        fbTrackMoves(FB.board, (event, el) => { edited(el); fbFit(); }, (event, el) => { edited(el); fbResized(event, el); });
      }
      fbTeardown();
      FB.board.cellHeight(fbCell());
      host.style.width = `${UG.COLUMNS * fbCell()}px`;
      host.style.setProperty('--obj-inset', `${UG.OBJECT_INSET_PX}px`);
      $('fleet-full').style.setProperty('--fbcell', `${fbCell()}px`);
      FB.board.batchUpdate();
      for (const w of UG.toGridstack(FB.layout.objects)) fbAddItem(FB.board, w, null, 0, v);
      FB.board.batchUpdate(false);
      for (const g of FB.grids) g.grid.setStatic(!FB.editing);
      // Settled first: a fit before it would grow units to their children's estimated heights
      // and push what sits below them down, to stay there once the children settle.
      if (!fbSettle(v)) fbFit();
    }

    /** Units sized by default take exactly the rows they are drawn in (unit-grid.js settleRows):
     * one pass after a build, which builds once more only when something moved. */
    function fbSettle(v) {
      if (FB.settling) return false;
      fbSync();
      const own = (o) => { const it = FB.items.get(o.id); return it ? fbDetailsPx(it) : null; };
      if (!UG.settleRows(FB.layout.objects, own, fbCell(), FB.source === 'starter' && !FB.editing)) return false;
      FB.settling = true;
      try { fbBuild(v); } finally { FB.settling = false; }
      return true;
    }

    function fbAddItem(grid, w, parent, depth, v) {
      const o = UG.find(FB.layout.objects, w.id).object;
      delete o.place;
      const el = document.createElement('div');
      el.className = 'grid-stack-item';
      const content = document.createElement('div');
      content.className = 'grid-stack-item-content obj';
      // A unit's parts sit in one box, which gridstack measures to fit the unit's height.
      const box = o.kind === 'unit' ? document.createElement('div') : content;
      if (box !== content) { box.className = 'fitbox'; content.appendChild(box); content.classList.add('unitobj'); content.dataset.depth = String(depth); }
      const part = (tag, cls) => { const x = document.createElement(tag); x.className = cls; box.appendChild(x); return x; };
      const head = part('header', 'oh');
      const body = part('div', 'ob');
      el.appendChild(content);
      grid.el.appendChild(el);
      // A unit's size is the layout's, never its content's: its grid scrolls inside it.
      const { subGridOpts, sizeToContent: _fit, ...opts } = w;
      grid.makeWidget(el, Object.assign(opts, { noResize: !(FB.editing && FB.selected === o.id) }));
      FB.items.set(o.id, { grid, el, content, head, body });
      if (subGridOpts) {
        const scroll = part('div', 'subwrap');
        const subHost = document.createElement('div');
        subHost.className = 'grid-stack sub';
        scroll.appendChild(subHost);
        subHost.dataset.owner = o.id;
        subHost.style.width = '100%';
        const sub = GridStack.init(fbGridOpts(o.w), subHost);
        el.gridstackNode.subGrid = sub;
        sub.parentGridNode = el.gridstackNode;
        FB.grids.push({ grid: sub, owner: o.id });
        sub.batchUpdate();
        for (const c of subGridOpts.children) fbAddItem(sub, c, o, depth + 1, v);
        sub.batchUpdate(false);
        fbTrackMoves(sub, () => { FB.changed = true; UG.touch(FB.layout.objects, o.id); fbFit(); }, (event, child) => { FB.changed = true; UG.touch(FB.layout.objects, o.id); fbResized(event, child); });
      }
      fbDraw(o, depth, parent, v);
    }

    /** Marks a drag or resize in progress on `grid`, so nothing else writes to the grids meanwhile,
     * then calls `dragStop` or `resizeStop` when it ends. Gridstack keeps one handler per drag or
     * resize event, so they all go through here. */
    function fbTrackMoves(grid, dragStop, resizeStop) {
      grid.on('dragstart resizestart', () => { FB.moving = true; });
      grid.on('dragstop', (event, el) => { FB.moving = false; FB.movedAt = performance.now(); dragStop(event, el); });
      grid.on('resizestop', (event, el) => { FB.moving = false; FB.movedAt = performance.now(); resizeStop(event, el); });
    }

    /** After a resize: a unit that holds objects gets a grid as wide as it is now. The rebuild
     * waits for gridstack to finish its own resize stop: rebuilding inside it tore the item out
     * from under gridstack, which threw and left its resize handle following the pointer. */
    function fbResized(event, el) {
      const n = el && el.gridstackNode;
      const at = n && UG.find(FB.layout.objects, n.id);
      // Sized by hand: it keeps its height when what it holds shrinks (fbFit).
      if (at && at.object.kind === 'unit') at.object.sized = true;
      if (at && UG.isContainer(at.object) && n.w !== at.object.w) {
        if (!FB.rebuildDue) {
          FB.rebuildDue = true;
          setTimeout(() => { FB.rebuildDue = false; if (FB.editing) fbRebuild(() => {}); });
        }
        return;
      }
      const c = el && el.querySelector(':scope > .obj');
      if (c) { c.style.display = 'none'; void c.offsetHeight; c.style.display = ''; }
      fbFit();
      fbRedraw();
      // Gridstack reports the stop before it settles the node's new size: fit again once it has,
      // so the units around it follow at once.
      setTimeout(fbFit);
    }

    /** A unit's header and its own people as drawn, in px. */
    const fbDetailsPx = (it) => it.head.offsetHeight + (it.body.hidden ? 0 : it.body.offsetHeight);

    // What a unit object's parts take in px, measured on the board: its header (a second line
    // when narrow), its border and body padding, a condensed row (two lines), a card (one with
    // every bar), a list's padding and gaps, a card's least width, a hint or lead line, and in a
    // unit too deep for a grid each child unit's header, list padding and indent. A header and
    // one condensed row come to under a cell, so a fighter starts one cell tall.
    const FB_PX = { head: 22, head2: 18, narrow: 500, border: 2, pad: 4, row: 36, rowGap: 4, card: 210, cardGap: 6, cardW: 200, line: 20, kidHead: 31, indent: 7 };

    /** For unit-grid.js: how tall a unit object's header and own people are, `px` wide with look
     * `look`, before it is drawn (as fbUnitTop draws them); one that holds no grid (`holds`
     * false) lists its child units too. Errs tall, so a unit sized by it never hides its grid. */
    function fbDetailsModel(v) {
      const P = FB_PX;
      const list = (n, inner, cards, pad) => {
        if (!n) return 0;
        if (!cards) return pad + n * P.row + (n - 1) * P.rowGap;
        const rows = Math.ceil(n / Math.max(1, Math.floor((inner + P.cardGap) / (P.cardW + P.cardGap))));
        return pad + rows * P.card + (rows - 1) * P.cardGap;
      };
      const people = (node) => node.leads.filter((p) => !p.seated && fleetMember(p.member)).length + (node.shipCard ? 1 : 0) + node.seats.length;
      // unitHtml: a header, its people, its child units indented; "Nobody here yet" when open and empty.
      const nested = (node, px, cards) => {
        const kids = node.units.reduce((t, c) => t + nested(c, px - P.indent, cards), 0);
        const own = list(people(node), px - 16, cards, cards ? 14 : 10);
        return P.kidHead + own + kids + (node.open && !own && !kids ? 14 + P.line : 0);
      };
      return (u, px, look, holds) => {
        const cards = !(look === 'condensed' || look === 'compact' || admiralOn());
        const inner = px - P.border - P.pad - 4;
        const head = P.head + (px < P.narrow ? P.head2 : 0);
        let body;
        if (u.group) body = list(u.group.members.length, inner, cards, cards ? 4 : 0);
        else if (!u.node.open) body = u.node.leads.length ? P.line : 0;
        else body = list(people(u.node), inner, cards, cards ? 4 : 0) + (holds ? 0 : u.node.units.reduce((t, c) => t + nested(c, inner - P.indent, cards), 0));
        if (body) return head + P.pad + body;
        const hint = u.group || (u.node.open && !(holds && v.kids(u.id).length));
        return head + (hint ? P.pad + P.line : 0);
      };
    }

    /** Keeps each unit at least as tall as its header and own people and, when it holds objects,
     * the rows down to its lowest child (a strip of its grid when empty). Innermost first, so a
     * child's new size reaches the units around it. A unit that fitted its content follows it
     * both ways; one sized by hand (or saved taller) keeps its size. */
    function fbFit() {
      if (!FB.layout || FB.moving || FB.fitting) return;
      FB.fitting = true;
      try { fbFitNow(); } finally { FB.fitting = false; }
    }
    function fbFitNow() {
      const cell = fbCell();
      const visit = (list) => {
        for (const o of list) {
          if (Array.isArray(o.children)) visit(o.children);
          const it = FB.items.get(o.id);
          const n = it && o.kind === 'unit' && it.el.gridstackNode;
          if (!n) continue;
          const kids = n.subGrid ? n.subGrid.engine.nodes : [];
          const min = kids.length ? UG.unitMinRows(fbDetailsPx(it), false, cell) + Math.max(...kids.map((k) => k.y + k.h)) : UG.unitMinRows(fbDetailsPx(it), UG.isContainer(o), cell);
          const h = !o.sized && n.h === o.fitMin ? min : Math.max(n.h, min);
          if (n.minH !== min || n.h !== h) it.grid.update(it.el, { minH: min, h });
          // On the object, not the item: it outlasts a rebuild.
          o.fitMin = min;
        }
      };
      visit(FB.layout.objects);
    }

    /** Where gridstack has each object now, from live grids only: a grid or node torn down by a
     * rebuild has no say, so what is saved is the layout's own record for anything not on show. */
    const fbPositions = () => {
      const at = new Map();
      for (const g of FB.grids) {
        if (!g.grid.engine || !g.grid.el || !g.grid.el.isConnected) continue;
        for (const n of g.grid.engine.nodes) if (n.el && n.el.isConnected) at.set(n.id, n);
      }
      return at;
    };
    const fbSync = () => { FB.layout.objects = UG.withPositions(FB.layout.objects, fbPositions()); };
    const fbCurrent = (keepNew) => UG.serializeLayout({ cell: fbCell(), objects: UG.settleNew(UG.withPositions(FB.layout.objects, fbPositions()), keepNew) });

    function fbAppendNew(v) {
      let added = 0;
      const cell = fbCell();
      const detailsPx = fbDetailsModel(v);
      UG.walk(FB.layout.objects, (o, depth) => {
        if (!UG.mayHold(o, depth)) return;
        const rows = (u, w) => UG.naturalRows(u.id, v, { cols: w, cell, detailsPx, look: o.look, depth: depth + 1 });
        added += UG.autoAppend(o, FB.layout, v, fbNewId, rows).length;
      });
      return added;
    }

    /** Works on `chosen` (a saved layout, or the starter when null). */
    /** Works on `chosen` (a saved layout, or the starter when null); a saved layout that cannot
     * be shown gives way to the starter, with a note. */
    function fbLoad(chosen) {
      const v = fbView();
      try {
        FB.source = chosen ? 'own' : 'starter';
        FB.layout = UG.serializeLayout(UG.migrateLayout(chosen) || fbStarter(v));
        fbFill(v);
        fbAppendNew(v);
        fbBuild(v);
      } catch (e) {
        if (!chosen) throw e;
        console.error(e);
        FB.note = `Your layout could not be shown (${fbWhy(e)}); showing the starter.`;
        fbLoad(null);
        return;
      }
      if (!chosen) fbRedraw();
    }

    // Whatever stops the board, the Fleet tab says so and offers a reload: it is never left blank.
    const fbWhy = (e) => String((e && e.message) || e || 'unknown').slice(0, 200);
    function fbFail(e) {
      console.error(e);
      FB.failed = `The Fleet tab's board hit an error: ${fbWhy(e)}.`;
      const el = document.getElementById('fb-state');
      if (el) { el._html = ''; el.innerHTML = `<span class="lnote" role="alert">${esc(FB.failed)}</span><button class="btn" data-fbreload type="button">Reload</button>`; }
    }
    $('fleet-full').addEventListener('click', (e) => { if (e.target.closest('[data-fbreload]')) location.reload(); });

    function fbRebuild(change) {
      FB.changed = true;
      fbSync();
      change();
      fbBuild(fbView());
      fbRedraw();
    }

    function fbAsk() {
      const key = fbKey();
      send({ type: 'fleet.layout.get', key }, (r) => {
        if (!r || r.key !== FB.key) return;
        FB.saved = r.layout || null;
        FB.loaded = true;
        if (!FB.editing) { try { fbLoad(FB.saved); fbRedraw(); } catch (e) { fbFail(e); } }
      });
    }
    function onFleetLayout() { if (FB.key && !FB.editing) fbAsk(); }

    /** Called after each draw of the Fleet tab: the board's DOM is kept across pushes. */
    function fbRender() {
      try { fbRenderNow(); } catch (e) { fbFail(e); }
    }
    function fbRenderNow() {
      if (FB.failed || FB.moving) return;
      if (!fbOn()) { if (FB.editing) fbSetEditing(false); return; }
      const host = document.getElementById('fb-board');
      if (!host) return;
      const key = fbKey();
      const v = fbView();
      const sig = JSON.stringify(v.units.map((u) => [u.id, u.parent]));
      if (key !== FB.key) { FB.key = key; FB.loaded = false; FB.saved = null; FB.sig = sig; fbLoad(null); fbAsk(); }
      else if (!FB.board || FB.board.el !== host) fbBuild(v);
      else if (sig !== FB.sig) {
        FB.sig = sig;
        if (FB.source === 'starter' && !FB.editing) fbLoad(null);
        else if (fbAppendNew(v)) { fbSync(); fbBuild(v); }
      }
      fbRedraw();
    }

    function fbRedraw() {
      if (!FB.layout || !fbOn()) return;
      const v = fbView();
      UG.walk(FB.layout.objects, (o, depth, parent) => fbDraw(o, depth, parent, v));
      fbFit();
      fbDrawState(v);
      fbDrawEdit(v);
    }

    // ---- edit mode: the pane (selection, palette, units not on the board, layout) and the bar

    const fbButton = (act, label, extra) => `<button type="button" class="btn${extra && extra.cls ? ` ${extra.cls}` : ''}" data-fb="${act}"${extra && extra.off ? ' disabled' : ''}>${esc(label)}</button>`;
    const fbUnplaced = (v) => UG.unplacedUnits(FB.layout, v).filter((u) => !u.parent);

    function fbDrawState(v) {
      const el = document.getElementById('fb-state');
      if (!el || FB.failed) return;
      const left = FB.editing ? [] : fbUnplaced(v);
      const from = FB.source === 'own' ? 'your layout' : 'the starter';
      fbSet(el, `<span>${FB.editing ? 'Editing' : 'Showing'} ${esc(from)}</span>${FB.note ? `<span class="lnote">${esc(FB.note)}</span>` : ''}` +
        (left.length ? `<span class="lnote">Not on the board: ${esc(left.map((u) => u.name).join(', '))}. Edit to place them.</span>` : ''));
    }

    function fbCrumbs(id, v) {
      const path = [];
      for (let at = UG.find(FB.layout.objects, id); at; at = at.parent && UG.find(FB.layout.objects, at.parent.id)) path.unshift(fbTitle(at.object, v));
      return ['Board', ...path].map(esc).join(' <span class="sep">&gt;</span> ');
    }

    function fbBindOptions(o, parent, v) {
      const k = UG.KINDS[o.kind];
      const inside = parent && parent.bind && v.byId.has(parent.bind);
      const units = inside ? v.subtree(parent.bind).filter((u) => u.id !== parent.bind || o.kind !== 'unit') : v.units;
      const members = inside ? new Set(v.membersUnder(parent.bind)) : null;
      const opts = [];
      if (k.binds.includes('')) opts.push(['', fleetEvent() ? 'Whole event' : 'Everyone']);
      if (k.binds.includes('unit')) for (const u of units) opts.push([u.id, `${u.group ? 'Group' : u.node.kindLabel}: ${u.name}`]);
      if (k.binds.includes('member')) for (const m of fleet.members.filter((x) => !x.ship && (!members || members.has(x.member)))) opts.push([m.member, m.handle]);
      if (k.binds.includes('ship')) for (const m of fleet.members.filter((x) => x.ship && (!inside || units.some((u) => `ship:${u.id}` === x.member)))) opts.push([m.member, m.handle]);
      if (o.bind && !opts.some(([x]) => x === o.bind)) opts.push([o.bind, 'Not in this fleet']);
      return opts;
    }

    const fbNum = (key, label, val, max, min) => `<label class="num">${label}<input type="number" data-fbpos="${key}" min="${min}" max="${max}" value="${val}"></label>`;

    function fbDrawEdit(v) {
      const pane = document.getElementById('fb-edit');
      if (!pane) return;
      pane.hidden = !FB.editing;
      if (!FB.editing || busy(pane)) return;
      const at = FB.selected && UG.find(FB.layout.objects, FB.selected);
      let props = '<h2>Selected</h2><p class="hint">Click an object\'s header to select it. Select a unit to add objects to its grid.</p>';
      if (at) {
        const o = at.object;
        const k = UG.KINDS[o.kind];
        const binds = fbBindOptions(o, at.parent, v);
        const n = fbPositions().get(o.id) || o;
        const cols = at.parent ? at.parent.w : UG.COLUMNS;
        const mayPutBack = Boolean(UG.putBack(FB.layout, o.id, v));
        const mayReset = UG.hasGrid(o) && !UG.untouched(o);
        props = `<h2>Selected</h2><p class="crumb">${fbCrumbs(o.id, v)}</p><h3>${esc(k.label)}</h3>` +
          (binds.length > 1 || (binds.length && binds[0][0]) ? `<label>Shows<select data-fbset="bind">${binds.map(([val, t]) => opt(val, t, (o.bind || '') === val)).join('')}</select></label>` : '') +
          (k.looks ? `<label>Look<select data-fbset="look">${k.looks.map((l) => opt(l, l, (o.look || k.looks[0]) === l)).join('')}</select></label>` : '') +
          `<label>Label<input data-fbset="label" maxlength="${UG.LABEL_MAX}" value="${esc(o.label || '')}" placeholder="${esc(fbTitle({ ...o, label: '' }, v))}"></label>` +
          (o.kind === 'header' ? '' : `<label>Title<select data-fbset="align">${[['center', 'Centered'], ['left', 'Left']].map(([val, t]) => opt(val, t, UG.titleAlign(o, at.depth) === val)).join('')}</select></label>`) +
          `<div class="pos">${fbNum('x', 'x', n.x, cols - 1, 0)}${fbNum('y', 'y', n.y, 999, 0)}${fbNum('w', 'w', n.w, cols, n.minW || 1)}${fbNum('h', 'h', n.h, 99, n.minH || 1)}</div>` +
          `<div class="row">${fbButton('narrower', 'Narrower')}${fbButton('wider', 'Wider')}</div>` +
          (at.parent || mayPutBack ? `<div class="row">${at.parent ? fbButton('moveout', 'Move out to the board') : ''}${mayPutBack ? fbButton('putback', 'Put back in its unit') : ''}</div>` : '') +
          (mayReset ? `<div class="row">${fbButton('resetinside', 'Default cards inside')}</div>` : '') +
          `<div class="row">${fbButton('remove', 'Remove', { cls: 'danger' })}${fbButton('unselect', 'Close')}</div>`;
      }
      const target = UG.targetOf(FB.layout.objects, FB.selected);
      const kinds = UG.holds(target, v).filter((k) => k !== 'header' && k !== 'timeline');
      const name = fbTitle(target.object, v);
      const full = UG.count(FB.layout.objects) >= UG.MAX_OBJECTS;
      const list = kinds.length
        ? `<div class="pitems">${kinds.map((k) => `<button type="button" class="pitem" draggable="true" data-fb="add" data-kind="${k}"${full ? ' disabled' : ''}><b>${esc(UG.KINDS[k].label)}</b><small>${esc(UG.KINDS[k].about)}</small></button>`).join('')}</div>`
        : fbHint(`${name} is nested as deep as objects go.`);
      const add = `<h2>Add objects</h2><p class="addto">Add to: <b>${esc(name)}</b></p>${list}<p class="hint">Click to add, or drag onto the board or a unit's grid.</p>` +
        (full ? fbHint(`Up to ${UG.MAX_OBJECTS} objects; remove one to add another.`) : '');
      const left = fbUnplaced(v);
      const units = left.length ? `<h2>Units not on the board</h2><div class="row">${left.map((u) => `<button type="button" class="btn" data-fb="place" data-unit="${esc(u.id)}">${esc(u.name)}</button>`).join('')}</div>` : '';
      const layout = `<h2>Layout</h2><label>Cell size<select data-fbset="cell">${UG.CELLS.map((c) => opt(String(c), `${c} px`, c === fbCell())).join('')}</select></label>` +
        `<div class="row">${fbButton('starter', 'Reset to starter')}${fbButton('revert', 'Revert')}</div>`;
      fbSet(pane, `<section>${props}</section><section>${add}</section>${units ? `<section>${units}</section>` : ''}<section>${layout}</section>`);
    }

    function fbSetEditing(on) {
      FB.editing = on;
      FB.moving = false;
      FB.changed = false;
      FB.selected = null;
      FB.note = '';
      $('fleet-full').classList.toggle('fb-editing', on);
      if (on) closeFleetOverlays();
      for (const g of FB.grids) g.grid.setStatic(!on);
      renderBar();
      fbRedraw();
    }

    function fbMoveSelected(to) {
      const it = FB.items.get(FB.selected);
      if (!it) return;
      FB.changed = true;
      UG.touchParent(FB.layout.objects, FB.selected);
      it.grid.update(it.el, to);
      fbResized(null, it.el);
    }

    /** What a new object of `kind` shows in unit `c` (null: the board). */
    function fbBindFor(kind, c, v) {
      const bound = UG.boundUnits(FB.layout.objects);
      if (kind === 'unit') {
        const kids = c && c.bind ? v.kids(c.bind) : v.top;
        return (kids.find((u) => !bound.has(u.id)) || kids[0] || v.units[0] || {}).id;
      }
      if (kind === 'member') {
        const placed = new Set();
        UG.walk(FB.layout.objects, (x) => { if (x.kind === 'member') placed.add(x.bind); });
        const under = c && c.bind ? v.membersUnder(c.bind) : fleet.members.filter((m) => !m.ship).map((m) => m.member);
        return under.find((m) => !placed.has(m)) || under[0] || fleet.me.member;
      }
      if (kind === 'ship') {
        const ships = fleet.members.filter((m) => m.ship && (!c || !c.bind || v.subtree(c.bind).some((u) => `ship:${u.id}` === m.member)));
        return ships[0] && ships[0].member;
      }
      if (kind === 'rollup' || kind === 'alerts') return c && c.bind ? c.bind : undefined;
      return undefined;
    }

    /** Adds an object of `kind` to `target` (from UG.targetOf), or a unit for `unit` to the board. */
    function fbAddObject(kind, target, unit) {
      const v = fbView();
      fbSync();
      if (!unit && !UG.holds(target, v).includes(kind)) return;
      const c = unit ? null : target.object;
      const k = UG.KINDS[kind];
      const o = { id: fbNewId(), kind, x: 0, y: 0, w: k.w, h: k.h, bind: unit || fbBindFor(kind, c, v) };
      if (k.looks) o.look = kind === 'unit' && c && c.look ? c.look : k.looks[0];
      const next = UG.addTo(FB.layout, c ? c.id : null, o);
      if (!next) { FB.note = `Up to ${UG.MAX_OBJECTS} objects.`; fbRedraw(); return; }
      FB.layout = next;
      FB.changed = true;
      FB.selected = o.id;
      fbBuild(v);
      fbRedraw();
    }

    function fbDone() {
      const next = fbCurrent(true);
      const problems = UG.layoutProblems(next);
      if (problems.length) { FB.note = problems.join('; '); fbRedraw(); return; }
      send({ type: 'fleet.layout.save', key: FB.key, layout: next }, (r, error) => {
        const p = error ? [error] : (r && r.problems) || [];
        if (p.length) { FB.note = `Not saved: ${p.join('; ')}`; fbRedraw(); return; }
        FB.saved = next;
        fbSetEditing(false);
        fbLoad(next);
        FB.note = 'Saved.';
        fbRedraw();

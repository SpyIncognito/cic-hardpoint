      else if (act === 'done') { if (!(await confirmLeave())) return; editing = false; work = null; selected = null; }
      else if (act === 'revert') { work = clone(serverTab(currentId)); selected = null; }
      else if (act === 'save') { await save(); }
      else if (act === 'export') { exportFile(); return; }
      else if (act === 'import') { $('file').value = ''; $('file').click(); return; }
      else if (act === 'detach') { detach(onFleetTab() ? FLEET_TAB_DEF : serverTab(currentId)); return; }
      else if (act === 'restore') { restoreDetached(); return; }
      else if (act === 'boards') { if (dashPanel) closeDashPanel(); else openDashPanel(); return; }
      else if (act === 'fleet') { setFleetOpen(!fleetIsOpen()); return; }
      else if (act === 'relay') { if ($('relay-panel').hidden) openRelay(); else $('relay-panel').hidden = true; return; }
      document.body.classList.toggle('editing', editing);
      renderBar(); renderPane(); buildGrid();
    });

    // ------------------------------------------------------------ export and import

    function exportFile() {
      send({ type: 'dash.export' }, (r) => {
        if (!r) return;
        const url = URL.createObjectURL(new Blob([r.text], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = r.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    }

    $('file').addEventListener('change', async () => {
      const f = $('file').files[0];
      if (!f) return;
      if (f.size > MAX_IMPORT) { notice(`That file is over ${MAX_IMPORT / 1024} KiB, too big for a dashboard`, 'bad'); return; }
      const text = await f.text();
      send({ type: 'dash.import', text }, (r) => r && showImport(text, r.summary));
    });

    const SHOW_SKIPPED = 12;
    async function showImport(text, s) {
      if (!s.ok) { await ask('Cannot import', `<p>${esc(s.problem)}</p>`, [{ text: 'Close', value: 'close' }]); return; }
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      let body = `<p>${plural(s.tabs, 'tab', 'tabs')} with ${plural(s.widgets, 'widget', 'widgets')}.</p>`;
      if (s.newerVersion) body += `<p class="warn">The file is from a newer version (schema ${esc(s.newerVersion)}). Only what this version knows is imported.</p>`;
      if (s.confirmButtons) body += `<p class="warn">${plural(s.confirmButtons, 'button sends an action', 'buttons send actions')} in the confirm group (power off, eject and the like). Each press still needs a 1.5 s hold.</p>`;
      if (s.unknownKinds.length) body += `<p>Unknown widget kinds skipped: ${s.unknownKinds.map(esc).join(', ')}</p>`;
      if (s.skipped.length) {
        body += `<p>${plural(s.skipped.length, 'item was', 'items were')} left out:</p><ul>${s.skipped.slice(0, SHOW_SKIPPED).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
        if (s.skipped.length > SHOW_SKIPPED) body += `<p>and ${s.skipped.length - SHOW_SKIPPED} more not listed here.</p>`;
      } else body += '<p>Nothing was left out.</p>';
      body += '<p>Importing replaces your whole dashboard. Export first to keep a copy of the current one.</p>';
      const c = await ask('Import dashboard', body, [{ text: 'Cancel', value: 'cancel' }, { text: 'Replace dashboard', value: 'apply', cls: 'primary' }]);
      if (c !== 'apply') return;
      send({ type: 'dash.import', text, confirm: true }, (r) => {
        if (r && r.applied) { work = null; editing = false; document.body.classList.remove('editing'); currentId = null; selected = null; notice('Dashboard imported', 'ok'); }
      });
    }

    // ------------------------------------------------------------ grid

    /** The dashboard's square cell, in px. */
    const cellPx = () => (dash && dash.cell) || (meta && meta.limits.defaultCell) || 72;

    function buildGrid() {
      const tab = shown();
      if (!tab) return;
      syncTheme();
      $('empty').style.display = 'none';
      const key = JSON.stringify([tab.rows, tab.widgets.map((w) => [w.id, w.x, w.y, w.w, w.h]), editing, cellPx()]);
      if (grid && key === builtFor) { drawAll(); return; }
      builtFor = key;
      if (grid) grid.destroy(true);
      const el = document.createElement('div');
      el.className = 'grid-stack';
      el.id = 'grid';
      $('stage').prepend(el);
      const margin = parseFloat(getComputedStyle(document.body).getPropertyValue('--gap')) || 3;
      el.style.width = `${meta.limits.columns * cellPx()}px`;
      grid = GridStack.init({ column: meta.limits.columns, row: tab.rows, cellHeight: cellPx(), margin, mode: 'float', staticGrid: !editing, animate: false }, el);
      grid.load(tab.widgets.map((w) => ({ id: w.id, x: w.x, y: w.y, w: w.w, h: w.h, minW: meta.kinds[w.kind].min.w, minH: meta.kinds[w.kind].min.h })));
      grid.on('change', (_e, nodes) => {
        if (!editing) return;
        for (const n of nodes) {
          const w = work.widgets.find((x) => x.id === n.id);
          if (w) Object.assign(w, { x: n.x, y: n.y, w: n.w, h: n.h });
        }
        builtFor = JSON.stringify([work.rows, work.widgets.map((w) => [w.id, w.x, w.y, w.w, w.h]), editing, cellPx()]);
        renderBar();
        if (selected) renderPane();
      });
      fit();
      drawAll();
    }

    function fit() {
      const tab = shown();
      if (!grid || !tab) return;
      const ch = cellPx();
      $('stage').style.setProperty('--ch', `${ch}px`);
      $('stage').style.setProperty('--cw', `${ch}px`);
      shrink($('stage'));
    }
    let fitFrame = 0;
    window.addEventListener('resize', () => { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fit); });

    // ------------------------------------------------------------ themes

    const HEX = /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
    const allThemes = () => (themes ? [...themes.builtIn, ...themes.user] : []);
    const themeById = (id) => allThemes().find((t) => t.id === id);
    const isBuiltInTheme = (id) => Boolean(themes && themes.builtIn.some((t) => t.id === id));
    /** The tab's own theme, else the dashboard's, else the default; a removed theme is passed over. */
    const themeFor = (tab) => themeById(tab && tab.theme) || themeById(boardThemeOf(tab)) || themeById(themes && themes.defaultTheme);
    /** The theme of the dashboard a tab is on: a generic tab kept in a window draws in the generic theme. */
    const boardThemeOf = (tab) => (tab && genericBoard && dash && !dash.tabs.some((t) => t.id === tab.id) && genericBoard.tabs.some((t) => t.id === tab.id) ? genericBoard.theme : dash && dash.theme);
    // What the widgets were last drawn for: a change of base, bars, zeros or font draws them again.
    let drawnFor = '';

    /** Put a theme on the page: built-in colours come from the served CSS, a user theme's are set here, hex only. */
    function applyTheme(t) {
      if (!t) return;
      const b = document.body;
      Object.assign(b.dataset, { theme: t.id, base: t.base, font: t.font, bars: t.bars, zeros: t.leadingZeros ? 'dim' : 'none' });
      // Native parts of a control (scrollbars, pickers, option lists) follow the field background.
      const field = t.colors['input-bg'] || t.colors.bg;
      document.documentElement.style.colorScheme = HEX.test(field || '') && luminance(field) > 0.4 ? 'light' : 'dark';
      for (const k of themes.colorTokens) {
        const v = t.colors[k];
        if (!isBuiltInTheme(t.id) && typeof v === 'string' && HEX.test(v)) b.style.setProperty(`--${k}`, v);
        else b.style.removeProperty(`--${k}`);
      }
      const key = JSON.stringify([t.base, t.font, t.bars, t.leadingZeros]);
      if (key !== drawnFor) {
        drawnFor = key;
        if (grid) for (const el of grid.getGridItems()) { const c = el.querySelector('.grid-stack-item-content'); if (c) c._html = ''; }
      }
    }
    /** The tab whose theme is in use: the Fleet tab has none of its own, so it takes the theme of
     * the dashboard tab it was opened from. */
    const themeTab = () => (onFleetTab() ? serverTab(lastBoardTab) || (dash && dash.tabs[0]) : shown());
    /** The theme of what is on screen, or the theme being edited while the theme editor is open. */
    function syncTheme() {
      if (!themes) return;
      applyTheme(themeDraft || themeFor(themeTab()));
    }
    // A dashboard with no theme stored (or a removed one) shows the default: write it, so the
    // picker, the file and the page agree.
    let healingTheme = false;
    function healTheme() {
      if (ONLY || healingTheme || !dash || !themes || themeById(dash.theme)) return;
      healingTheme = true;
      send({ type: 'dash.setTheme', theme: themes.defaultTheme }, () => { healingTheme = false; });
    }
    const theme = () => ({ base: document.body.dataset.base, bars: document.body.dataset.bars, zeros: document.body.dataset.zeros === 'dim' });
    // Each base's own widget skins and title mark; its shapes, rules and chevrons are the CSS under [data-base].
    const SKINS = {
      rsi: { shields: 'ring', titlePre: 0 },
      drake: { shields: 'bars', titlePre: 3 },
    };
    const skin = () => SKINS[document.body.dataset.base] || SKINS.rsi;

    function onThemes(m) {
      themes = m;
      healTheme();
      if (themeDraft && !themeById(themeDraft.id)) themeDraft = null;
      syncTheme();
      live('props', renderPane);
      live('theme-panel', renderThemePanel);
      drawAll();
    }

    // Web fonts arrive after the first draw; text sized for the fallback font is sized again.
    if (document.fonts) document.fonts.addEventListener('loadingdone', () => shrink($('stage')));

    // ------------------------------------------------------------ widgets

    /** Text that shrinks to fit its box: by the box height (`fh` percent) or its width, whichever is smaller. */
    const fit1 = (cls, text, fh) => {
      // A title mark (Drake's "// ") is drawn before every label, so it takes its share of the width.
      const n = String(text).length + (/\blbl\b/.test(cls) ? skin().titlePre : 0);
      return `<span class="fit ${cls}" style="--n:${Math.max(3, n)};${fh ? `--fh:${fh}` : ''}">${esc(text)}</span>`;
    };

    /** A reading's leading whole number padded with zeros the theme dims (RSI), or left as is (Drake). */
    function zeros(text) {
      const m = theme().zeros && /^(\d+)(.*)$/.exec(String(text));
      if (!m) return { pad: '', text: String(text) };
      const width = m[2].trim().startsWith('%') ? 3 : 4;
      return { pad: '0'.repeat(Math.max(0, width - m[1].length)), text: String(text) };
    }
    const numHtml = (text, tag = 'span') => { const z = zeros(text); return `${z.pad ? `<${tag} class="lz">${z.pad}</${tag}>` : ''}${esc(z.text)}`; };
    const fitNum = (cls, text) => { const z = zeros(text); return `<span class="fit ${cls}" style="--n:${Math.max(3, z.pad.length + z.text.length)}">${numHtml(text)}</span>`; };

    function lampOf(w) {
      const src = w.bind.kind === 'value' ? vals && vals.values[w.bind.id] : vals && vals.toggles[w.bind.id];
      let s = (src && src.lamp) || 'unknown';
      if (w.bind.invert && (s === 'on' || s === 'off')) s = s === 'on' ? 'off' : 'on';
      return { s, title: src ? (src.text ?? src.state) : DASH };
    }

    const SUPPORT_MARK = { absent: 'NOT ON SHIP', unavailable: 'N/A' };
    /** What this ship lacks of a widget's function: the service's support entry for its bind, or null. */
    function supportOf(w) {
      const s = vals && vals.support;
      if (!s) return null;
      const id = w.kind === 'mode' ? 'mode' : w.bind.kind === 'value' || w.bind.kind === 'toggle' ? w.bind.id : null;
      return (id && s[id]) || null;
    }
    const canGrey = (w) => Boolean(meta && meta.greyable && meta.greyable.has(w.kind === 'mode' ? 'mode' : w.bind.id) && (w.kind === 'mode' || w.bind.kind === 'value' || w.bind.kind === 'toggle'));

    /** Greyed, never removed: a click still sends the game's own toggle where there is one. Hidden in use only when asked. */
    function renderWidget(w) {
      const sup = supportOf(w);
      if (!sup) return widgetHtml(w);
      if (sup.state === 'absent' && w.hideUnsupported && !editing) return '<div class="w ghide"></div>';
      const name = w.label || (w.kind === 'mode' ? 'Master mode' : w.bind.kind === 'value' ? valueLabel(w.bind.id) : toggleLabel(w.bind.id));
      const reason = `${name}: ${sup.reason}${sup.state === 'absent' && w.hideUnsupported ? ' (hidden in use)' : ''}`;
      return `<div class="gwrap g-${esc(sup.state)}" title="${esc(reason)}">${widgetHtml(w).replace(/ title="[^"]*"/g, '')}` +
        `<span class="gmark">${esc(sup.state === 'absent' && w.hideUnsupported ? 'HIDDEN IN USE' : SUPPORT_MARK[sup.state] || '')}</span><span class="gtip">${esc(reason)}</span></div>`;
    }

    function widgetHtml(w) {
      const v = vals;
      switch (w.kind) {
        case 'lamp': {
          const { s, title } = lampOf(w);
          const label = w.label || (w.bind.kind === 'value' ? ((v && v.values[w.bind.id]) || {}).short || valueLabel(w.bind.id) : toggleLabel(w.bind.id));
          return `<div class="w lamp ${esc(w.look)} s-${s}" title="${esc(`${label}: ${title}`)}"><span class="face">${fit1('', label)}</span></div>`;
        }
        case 'readout': {
          const r = v && v.values[w.bind.id];
          const text = r ? r.text : DASH;
          const tone = r ? r.tone : 'unknown';
          const bar = w.look === 'bar' ? `<div class="meter t-${tone}"><i style="width:${r && r.fraction !== undefined ? Math.round(r.fraction * 100) : 0}%"></i></div>` : '';
          return `<div class="w panel readout ${esc(w.look)}">${fit1('lbl', w.label || valueLabel(w.bind.id))}${fitNum(`val t-${tone === 'ok' ? 'info' : tone}`, text)}${bar}</div>`;
        }
        case 'toggle': {
          if (w.look === 'switch') return lightSwitch(w);
          if (w.look === 'lever') return gearLever(w);
          const t = v && v.toggles[w.bind.id];
          let on = t ? t.on : undefined;
          let state = t ? t.state : DASH;
          let tone = t ? t.tone : 'unknown';
          if (w.bind.invert && on !== undefined && (state === 'ON' || state === 'OFF')) { on = !on; state = on ? 'ON' : 'OFF'; tone = on ? 'ok' : 'off'; }
          return button(w, w.label || toggleLabel(w.bind.id), state, { lit: on === true, tone, ind: true });
        }
        case 'action': {
          const confirm = isConfirm(w.bind.id);
          return button(w, w.label || actionText(w.bind.id), confirm ? 'HOLD' : 'SEND', { confirm });
        }
        case 'sequence': {
          const seq = cat && cat.sequences.find((s) => s.id === w.bind.id);
          if (cat && !seq) return button(w, w.label || w.bind.id, 'MISSING', { tone: 'bad' });
          const run = v && v.running && v.running.id === w.bind.id && v.running.status === 'running' ? v.running : null;
          const last = seqResults.get(w.bind.id);
          const state = run ? `RUN ${run.step}/${run.of}` : last ? last.status.toUpperCase() : 'RUN';
          const tone = run ? 'warn' : last && last.status !== 'done' ? 'bad' : last ? 'info' : 'off';
          const label = w.label || (seq ? seq.name : w.bind.id);
          if (w.look === 'push') return pushButton(w, label, state, tone, run ? 'lit' : last ? (last.status === 'done' ? 'done' : 'failed') : '');
          return button(w, label, state, { lit: Boolean(run), tone, ind: true });
        }
        case 'mode': {
          const m = v && v.values['ship.master_mode'] ? v.values['ship.master_mode'].text : DASH;
          const seg = (x) => `<div class="seg press ${m === x ? 'on' : ''}" data-mode="${x}">${fit1('', x)}</div>`;
          return `<div class="w panel mode">${seg('NAV')}${seg('SCM')}</div>`;
        }
        case 'status': {
          const link = v ? v.link : 'offline';
          const ship = !v ? DASH : v.inShip ? v.values['ship.name'].text : 'Not in a ship';
          const linkText = { live: 'Telemetry live', waiting: 'Waiting for the game', idle: 'Telemetry off', offline: 'Service not running' }[link] || link;
          const run = v && v.running && v.running.status === 'running' ? `${v.running.name}: step ${v.running.step}/${v.running.of}` : '';
          // recording: only the Rust app sends it, while it records telemetry.
          const rec = v && v.recording === true ? '<span class="pill rec" title="Recording telemetry">REC</span>' : '';
          return `<div class="w panel strip">${fit1('ship', ship)}<span class="spacer"></span>${run ? fit1('run', run) : ''}${rec}<span class="pill ${esc(link)}">${esc(linkText)}</span></div>`;
        }
        case 'shields': return shieldFaces(w);
        case 'power': return powerColumns(w);
        case 'weapons': return weaponList();
        case 'fuel': return fuelBars();
        case 'config': return configList();
      }
      return `<div class="w">${fit1('missing', 'unknown widget')}</div>`;
    }

    function button(w, label, state, o) {
      const cls = `w panel button press ${esc(w.look)}${o.lit ? ' lit' : ''}${o.confirm ? ' confirm' : ''}`;
      const inner = `${fit1('lbl', label)}${fit1(`val t-${o.confirm ? 'bad' : o.tone === 'ok' ? 'info' : o.tone || 'info'}`, state)}${o.ind ? '<span class="ind"></span>' : ''}`;
      return w.look === 'round' ? `<div class="${cls}"><div class="disc">${inner}</div></div>` : `<div class="${cls}">${inner}</div>`;
    }

    // ------------------------------------------------------------ drawn looks

    const svg = (viewBox, body) => `<svg viewBox="${viewBox}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${body}</svg>`;

    const CYCLE_ONLY = new Set(['transform']);

    /** A toggle's state as the widget shows it, with `invert` applied to settled states. */
    function toggleState(w) {
      const t = vals && vals.toggles[w.bind.id];
      if (!t) return { t, on: undefined, state: DASH };
      if (t.movingTo !== undefined) return { t, on: undefined, moving: t.movingTo, state: t.state };
      // Some ships send no state for a toggle that still works (the Corsair's wings): show the
      // action instead of a dash. The click already sends the game's toggle when the state is unknown.
      if (t.on === undefined && t.state === DASH && vals.inShip && CYCLE_ONLY.has(w.bind.id)) return { t, on: undefined, state: 'CYCLE' };
      const on = t.on === undefined ? undefined : w.bind.invert ? !t.on : t.on;
      return { t, on, state: on === undefined ? t.state : w.bind.invert ? (on ? 'ON' : 'OFF') : t.state };
    }

    // Where each switch or lever was last drawn, so a change animates from there once.
    const motion = new Map();
    function moved(id, pos) {
      const m = motion.get(id);
      if (!m) { motion.set(id, { pos, from: '' }); return ''; }
      if (m.pos === pos) return m.from;
      clearTimeout(m.timer);
      const next = { pos, from: `from-${m.pos}` };
      next.timer = setTimeout(() => { next.from = ''; drawAll(); }, 700);
      motion.set(id, next);
      return next.from;
    }

    function lightSwitch(w) {
      const { on, state } = toggleState(w);
      const pos = on === undefined ? 'unknown' : on ? 'on' : 'off';
      const from = moved(w.id, pos);
      const bat = on === undefined ? '' :
        `<g class="bat ${on ? '' : 's-off-bat'} ${from}"><path class="tip" d="M26.5 52 L27.6 31 H32.4 L33.5 52 Z"/><circle class="tip" cx="30" cy="29" r="5.5"/></g>`;
      const body = `<rect class="plate" x="6" y="2" width="48" height="96" rx="5"/>` +
        `<text class="mark ${on === true ? 'lit' : ''}" x="30" y="12">ON</text><text class="mark ${on === false ? 'lit' : ''}" x="30" y="90">OFF</text>` +
        `<circle class="nut" cx="30" cy="52" r="10"/>${bat}`;
      const tone = on === undefined ? 'unknown' : on ? 'info' : 'off';
      return `<div class="w panel drawn sw press s-${pos}">${fit1('lbl', w.label || toggleLabel(w.bind.id))}${svg('0 0 60 100', body)}${fit1(`val t-${tone}`, state)}</div>`;
    }

    // A click moves the lever at once, as a hand would; it goes back if the game does not follow.
    const leverPending = new Map();
    const LEVER_WAIT_MS = 4000;

    /** Where the stream puts the lever: at the end it is moving to, or the middle when not known. */
    function leverSettled(w) {
      const { on, moving } = toggleState(w);
      return moving !== undefined ? (moving ? 'down' : 'up') : on === undefined ? 'mid' : on ? 'down' : 'up';
    }

    function gearLever(w) {
      const { on, moving, state } = toggleState(w);
      const settled = leverSettled(w);
      const pending = leverPending.get(w.id);
      const pos = pending && Date.now() - pending.at < LEVER_WAIT_MS && pending.from === settled ? pending.to : settled;
      const from = moved(w.id, pos);
      const knob = moving !== undefined ? 'moving' : on === undefined && pos === 'mid' ? 's-unknown-knob' : '';
      const body = `<rect class="plate" x="4" y="4" width="92" height="162" rx="6"/><circle class="screw" cx="12" cy="12" r="2.5"/><circle class="screw" cx="88" cy="12" r="2.5"/><circle class="screw" cx="12" cy="158" r="2.5"/><circle class="screw" cx="88" cy="158" r="2.5"/>` +
        `<rect class="stripe" x="40" y="24" width="20" height="122" rx="3"/><rect class="slot" x="46" y="30" width="8" height="110" rx="4"/>` +
        `<text class="mark ${pos === 'up' ? 'lit' : ''}" x="80" y="40">UP</text><text class="mark ${pos === 'down' ? 'lit' : ''}" x="80" y="124">DN</text>` +
        `<g class="handle at-${pos} ${from} ${knob}"><rect class="arm" x="47" y="40" width="6" height="17" rx="2"/><circle class="tire" cx="50" cy="40" r="15"/><circle class="hub" cx="50" cy="40" r="5"/></g>`;
      const tone = moving !== undefined ? 'warn' : on === undefined ? 'unknown' : 'info';
      const text = moving !== undefined ? 'MOVING' : state;
      return `<div class="w panel drawn lever press">${fit1('lbl', w.label || toggleLabel(w.bind.id))}${svg('0 0 100 170', body)}${fit1(`val t-${tone}`, text)}</div>`;
    }

    function pushButton(w, label, state, tone, ring) {
      const body = `<rect class="housing" x="4" y="4" width="92" height="92" rx="12"/><circle class="collar" cx="50" cy="50" r="40"/><circle class="ring" cx="50" cy="50" r="35"/>` +
        `<circle class="cap" cx="50" cy="50" r="28"/><circle class="cap-hi" cx="50" cy="50" r="21"/>`;
      return `<div class="w panel drawn push press ${ring}">${fit1('lbl', label)}${svg('0 0 100 100', body)}${fit1(`val t-${tone === 'ok' ? 'info' : tone}`, state)}</div>`;
    }

    const toneOf = (f) => (f === undefined ? 'unknown' : f >= 0.5 ? 'ok' : f >= 0.25 ? 'warn' : 'bad');
    const polar = (r, deg) => [r * Math.cos((deg * Math.PI) / 180), r * Math.sin((deg * Math.PI) / 180)];
    function arc(r, a0, a1) {
      const [x0, y0] = polar(r, a0);
      const [x1, y1] = polar(r, a1);
      return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    }

    /**
     * A bar inside (x, y, w, h), filled to `f` from the bottom (vertical) or the left: the theme's
     * segments, or one solid fill. `cls` carries the tone.
     */
    function barSvg(x, y, w, h, f, vertical, segments, cls) {
      if (theme().bars !== 'segmented') {
        const fw = vertical ? w : w * f, fh = vertical ? h * f : h;
        return `<g class="${cls}"><rect class="seg-off" x="${x}" y="${y}" width="${w}" height="${h}"/><rect class="seg-on" x="${x}" y="${(vertical ? y + h - fh : y).toFixed(1)}" width="${fw.toFixed(1)}" height="${fh.toFixed(1)}"/></g>`;
      }
      const lit = Math.round(f * segments);
      const step = (vertical ? h : w) / segments;
      let out = '';
      for (let i = 0; i < segments; i++) {
        const c = i < lit ? 'seg-on' : 'seg-off';
        out += vertical
          ? `<rect class="${c}" x="${x}" y="${(y + h - (i + 1) * step + 1).toFixed(1)}" width="${w}" height="${(step - 2).toFixed(1)}"/>`
          : `<rect class="${c}" x="${(x + i * step + 1).toFixed(1)}" y="${y}" width="${(step - 2).toFixed(1)}" height="${h}"/>`;
      }
      return `<g class="${cls}">${out}</g>`;
    }

    // Our own outline of a generic ship from above, nose up.
    const HULL = 'M0 -52 L9 -24 L13 -6 L42 22 L42 32 L14 28 L10 40 L-10 40 L-14 28 L-42 32 L-42 22 L-13 -6 L-9 -24 Z';
    // Drake draws the four faces as straight bars beside the hull: [bar x, y, w, h, vertical], text x, y, anchor, number x, y.
    const FACE_BARS = [
      [[-50, -84, 100, 12, false], 0, -102, 'middle', -62, -78],
      [[64, -50, 12, 100, true], 86, 0, 'start', 70, -62],
      [[-50, 72, 100, 12, false], 0, 104, 'middle', 62, 78],
      [[-76, -50, 12, 100, true], -86, 0, 'end', -70, 62],
    ];

    // With four faces the game sends front, back, left, right (Corsair, PTU, 22 Nov; left by
    // elimination). Each value is that face's own fraction, not its share of the total.
    const FACE_NAMES = ['F', 'B', 'L', 'R'];
    const FACE_TITLES = ['Front', 'Back', 'Left', 'Right'];
    // Drawing slots run clockwise from the top: front 0, right 1, back 2, left 3.
    const FACE_SLOT = [0, 2, 3, 1];

    function shieldFaces(w) {
      const level = vals && vals.values['ship.shields'];
      const faces = vals ? vals.shieldFaces : [];
      const n = faces.length || 4;
      const span = 360 / n;
      let body = `<path class="hull" d="${HULL}"/>`;
      const asBars = skin().shields === 'bars' && n === 4;
      const named = n === 4;
      for (let i = 0; i < n; i++) {
        const f = faces[i];
        const slot = named ? FACE_SLOT[i] : i;
        const mark = named ? FACE_NAMES[i] : String(i + 1);
        const pct = `<tspan>${f ? numHtml(f.text, 'tspan') : DASH}</tspan>`;
        if (asBars) {
          const [[x, y, w, h, vertical], tx, ty, anchor, nx, ny] = FACE_BARS[slot];
          body += f && f.fraction !== undefined ? barSvg(x, y, w, h, f.fraction, vertical, 10, `t-${toneOf(f.fraction)}`) : `<rect class="track none" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
          body += `<text class="face-pct ${f ? '' : 't-unknown'}" x="${tx}" y="${ty}" text-anchor="${anchor}">${pct}</text>`;
          body += `<text class="face-num" x="${nx}" y="${ny}">${mark}</text>`;
          continue;
        }
        const mid = -90 + slot * span;
        const a0 = mid - span / 2 + 8;
        const a1 = mid + span / 2 - 8;
        body += `<path class="track ${f ? '' : 'none'}" d="${arc(78, a0, a1)}"/>`;
        if (f && f.fraction !== undefined && f.fraction > 0) body += `<path class="face-arc t-${toneOf(f.fraction)}" d="${arc(78, a0, a0 + (a1 - a0) * f.fraction)}"/>`;
        const c = Math.cos((mid * Math.PI) / 180);
        const anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
        const [tx, ty] = polar(anchor === 'middle' ? 101 : 91, mid);
        body += `<text class="face-pct ${f ? '' : 't-unknown'}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}">${pct}</text>`;
        const [bx, by] = polar(62, mid);
        body += `<circle class="face-badge" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="7"/><text class="face-num" x="${bx.toFixed(1)}" y="${by.toFixed(1)}">${mark}</text>`;
      }
      const text = level ? level.text : DASH;
      body += `<text class="tot-lbl" x="-136" y="-110">SHIELDS</text><text class="tot-val ${text === DASH ? 't-unknown' : ''}" x="-136" y="-88">${numHtml(text, 'tspan')}</text>`;
      const title = !faces.length ? 'The game is not reporting shield faces' : named ? 'Front, back, left and right; each value is that face\'s own strength' : 'Faces are numbered in the order the game sends them';
      return `<div class="w panel shields" title="${esc(title)}">${svg('-140 -125 280 250', body)}</div>`;
    }

    const FUEL_SEGMENTS = 20;
    function fuelBars() {
      const bar = (id, name, x, scaleLeft) => {
        const r = vals && vals.values[id];
        const f = r ? r.fraction : undefined;
        const text = r ? r.text : DASH;
        const top = 50, h = 140, w = 30;
        let g = `<text class="f-val ${text === DASH ? 't-unknown' : ''}" x="${x + w / 2}" y="24">${numHtml(text, 'tspan')}</text><text class="f-lbl" x="${x + w / 2}" y="40">${esc(name)}</text>`;
        g += `<rect class="frame ${f === undefined ? 'none' : ''}" x="${x}" y="${top}" width="${w}" height="${h}"/>`;
        if (f !== undefined) g += barSvg(x + 3, top + 2, w - 6, h - 4, f, true, FUEL_SEGMENTS, `t-${toneOf(f)}`);
        for (const p of [0, 25, 50, 75, 100]) {
          const y = top + h - (h * p) / 100;
          const tx = scaleLeft ? x - 4 : x + w + 4;
          g += `<line class="tick" x1="${scaleLeft ? x - 3 : x + w}" x2="${scaleLeft ? x : x + w + 3}" y1="${y}" y2="${y}"/><text class="tick-lbl" x="${tx + (scaleLeft ? -1 : 1)}" y="${y}" text-anchor="${scaleLeft ? 'end' : 'start'}">${p}</text>`;
        }
        return g;
      };
      return `<div class="w panel fuel">${svg('0 0 160 200', bar('ship.hydrogen_fuel', 'H2 FUEL', 24, true) + bar('ship.quantum_fuel', 'QT FUEL', 106, false))}</div>`;
    }

    const LOCK = '<svg class="lock" viewBox="0 0 16 16" aria-label="read-only"><rect x="2.5" y="7" width="11" height="7.5" rx="1"/><path d="M5 7 V5 a3 3 0 0 1 6 0 V7"/></svg>';
    const powerIcon = (state) => `<svg class="pwr-icon ${state}" viewBox="0 0 16 16"><path d="M5 4.2 A5.5 5.5 0 1 0 11 4.2"/><path d="M8 1.5 V8"/></svg>`;
    const onState = (on) => (on === undefined ? 'unknown' : on ? 'on' : 'off');

    // One column per system the stream reports; the game has set actions for the first three only.
    const POWER = [['WPN', 'power.weapons', 'power.weapons'], ['THR', 'power.engines', 'power.thrusters'], ['SHLD', 'power.shield_generators', 'power.shields'],
      ['PLANT', 'power.powerplants'], ['LIFE', 'power.life_support'], ['RADAR', 'power.sensors'], ['COOL', 'power.coolers'], ['GRAV', 'power.gravity_generators'], ['EMIT', 'power.shield_emitters']];

    function powerColumns(w) {
      const cols = POWER.map(([name, valueId, toggleId]) => {
        const r = vals && vals.values[valueId];
        const t = toggleId && vals && vals.toggles[toggleId];
        const on = t ? t.on : r ? r.on : undefined;
        const state = on === undefined ? DASH : on ? 'ON' : 'OFF';
        const tip = `${valueLabel(valueId)}: ${state}${toggleId ? '' : ' (no game action, read-only)'}`;
        return `<div class="col s-${onState(on)} ${toggleId ? 'press' : ''}" ${toggleId ? `data-click="toggle:${esc(toggleId)}"` : ''} title="${esc(tip)}">` +
          `<div class="cbar"></div><span class="cl fit">${esc(name)}</span><span class="cv"><span>${esc(state)}</span>${toggleId ? '' : LOCK}</span></div>`;
      }).join('');
      return `<div class="w panel list power"><div class="cols same" style="--cols:${POWER.length}">${cols}</div><span class="note fit">pips are not in the game's API</span></div>`;
    }

    const WEAPON_ROWS = 10;
    function weaponList() {
      const wp = vals && vals.weapons;
      const rows = wp ? wp.rows : [];
      const shown = rows.length > WEAPON_ROWS ? rows.slice(0, WEAPON_ROWS - 1) : rows;
      let list = shown.map((r, i) => `<div class="wrow"><span class="edge"></span><span class="wname fit">${esc(r.name || `Weapon ${i + 1}`)}</span>` +
        `<span class="cell" title="${r.powered === undefined ? 'Power not reported' : r.powered ? 'Powered' : 'Not powered'}">${powerIcon(onState(r.powered))}</span>` +
        `<span class="cell" title="${r.ready === undefined ? 'Readiness not reported' : r.ready ? 'Ready to fire' : 'Not ready'}"><span class="rdy ${onState(r.ready)}"></span></span></div>`).join('');
      if (rows.length > shown.length) list += `<div class="more">and ${rows.length - shown.length} more not shown</div>`;
      if (!wp) list = `<div class="none">${DASH} no weapon data</div>`;
      else if (!rows.length) list = '<div class="none">No weapons reported</div>';
      const cm = wp && wp.countermeasures.length ? wp.countermeasures.map((c) => `<span>${esc(c.type)}<b>${numHtml(c.amount)}</b></span>`).join('') : `<span>COUNTERMEASURES<b>${DASH}</b></span>`;
      return `<div class="w panel list weapons" style="--rows:${Math.max(4, Math.min(rows.length, WEAPON_ROWS))}">` +
        `<div class="whead"><span class="lbl">Preset</span><span class="preset fit grow">${esc(wp && wp.preset ? wp.preset : DASH)}</span></div>` +
        `<div class="cols-h"><span></span><span>WEAPON</span><span>PWR</span><span>RDY</span></div><div class="wrows same">${list}</div><div class="wcm">${cm}</div></div>`;
    }

    function configList() {
      const rows = vals ? vals.config : [];
      if (!rows.length) return `<div class="w panel">${fit1('t-unknown', DASH)}</div>`;
      const groups = ['Flight', 'HUD', 'Gunnery'].map((g) => [g, rows.filter((r) => r.group === g)]);
      const lines = (gs) => gs.map(([g, rs]) => `<div class="cgrp">${esc(g)}</div>` + rs.map((r) => {
        const s = onState(r.on);
        const sup = vals.support && vals.support[r.id];
        const tip = `${r.label}: ${r.text}${sup ? `, ${sup.reason}` : ''}${r.click ? '' : ' (no game action, read-only)'}`;
        return `<div class="crow s-${s} ${r.click ? 'press' : ''} ${sup ? `greyed g-${esc(sup.state)}` : ''}" ${r.click ? `data-click="config:${esc(r.id)}"` : ''} title="${esc(tip)}"><span class="box"></span><span class="cl fit grow">${esc(r.label)}</span>${r.click ? '' : LOCK}</div>`;
      }).join('')).join('');
      const count = (gs) => gs.reduce((n, [, rs]) => n + rs.length + 1, 0);
      const a = groups.slice(0, 2), b = groups.slice(2);
      return `<div class="w panel list config"><div class="clist same" style="--rn:${count(groups)};--rw:${Math.max(count(a), count(b))}">` +
        `<div class="ccol" style="--k:${count(a)}">${lines(a)}</div><div class="ccol" style="--k:${count(b)}">${lines(b)}</div></div></div>`;
    }

    function drawAll() {
      const tab = shown();
      if (!grid || !tab) return;
      for (const item of grid.getGridItems()) {
        const w = tab.widgets.find((x) => x.id === item.gridstackNode.id);
        const content = item.querySelector('.grid-stack-item-content');
        if (!w || !content) continue;
        const html = renderWidget(w);
        if (content._html !== html) { content._html = html; content.innerHTML = html; shrink(content); }
        item.classList.toggle('sel', editing && selected === w.id);
      }
    }

    /** The CSS sizes text from its length; a wide font can still overrun, so shrink what does. */
    function shrink(root) {
      for (const el of root.querySelectorAll('.fit')) {
        el.style.fontSize = '';
        if (el.scrollWidth > el.clientWidth) el.style.fontSize = `${(parseFloat(getComputedStyle(el).fontSize) * el.clientWidth) / el.scrollWidth * 0.96}px`;
      }
      // Rows of one list read as one size: the smallest any of them needed.
      for (const g of root.querySelectorAll('.same')) {
        const fits = [...g.querySelectorAll('.fit')];
        const min = Math.min(...fits.map((el) => parseFloat(getComputedStyle(el).fontSize)));
        if (Number.isFinite(min)) for (const el of fits) el.style.fontSize = `${min}px`;
      }
      // A short label in a narrow box must not outgrow the value it names.
      for (const w of root.querySelectorAll('.w')) {
        const lbl = w.querySelector('.fit.lbl');
        const val = w.querySelector('.fit.val');
        if (!lbl || !val) continue;
        const max = parseFloat(getComputedStyle(val).fontSize) * 0.6;
        if (parseFloat(getComputedStyle(lbl).fontSize) > max) lbl.style.fontSize = `${max}px`;
      }
    }

    const widgetAt = (target) => {
      const item = target.closest('.grid-stack-item');
      const tab = shown();
      return item && tab ? { item, w: tab.widgets.find((x) => x.id === item.gridstackNode.id) } : {};
    };

    $('stage').addEventListener('click', (e) => {
      const { w } = widgetAt(e.target);
      if (editing) { selected = w ? w.id : null; drawAll(); renderPane(); return; }
      if (!w) return;
      const part = e.target.closest('[data-click]');
      if (part) {
        // Power columns and configuration rows: the service says what each click sends.
        const [src, id] = part.dataset.click.split(':');
        const c = !vals ? null : src === 'toggle' ? (vals.toggles[id] || {}).click : (vals.config.find((r) => r.id === id) || {}).click;
        if (c) send(c);
        return;
      }
      if (w.kind === 'toggle') {
        const t = vals && vals.toggles[w.bind.id];
        if (!t) return;
        // Set the opposite of the known state; when it is not known, the game's own toggle, as a key would.
        if (w.look === 'lever' && t.click.type === 'set') {
          leverPending.set(w.id, { from: leverSettled(w), to: t.click.to === 'on' ? 'down' : 'up', at: Date.now() });
          setTimeout(drawAll, LEVER_WAIT_MS + 50);
          drawAll();
        }
        send(t.click);
      } else if (w.kind === 'action' && !isConfirm(w.bind.id)) send({ type: 'press', action: w.bind.id });
      else if (w.kind === 'sequence') runSequence(w.bind.id);
      else if (w.kind === 'mode') {
        const seg = e.target.closest('[data-mode]');
        // A ship that reports no master mode cannot confirm a set: send the game's own cycle.
        if (seg && supportOf(w)) send({ type: 'press', action: 'v_master_mode_cycle' });
        else if (seg) send({ type: 'mode', to: seg.dataset.mode });
      }
    });

    function runSequence(id) {
      seqResults.delete(id);
      send({ type: 'run', sequence: id }, (p) => {
        if (!p || !p.status) return;
        seqResults.set(id, p);
        if (p.status === 'failed') notice(`${p.name} failed at step ${p.step}: ${p.message || ''}`, 'bad');
        drawAll();
        setTimeout(() => { if (seqResults.get(id) === p) { seqResults.delete(id); drawAll(); } }, 6000);
      });
    }

    // Confirm-group actions: hold the button down for 1.5 s; letting go early cancels.
    // A finger rolls a little while it holds, so only a move past this many CSS px cancels.
    const HOLD_SLOP_PX = 24;
    let hold = null;
    const endHold = () => {
      if (!hold) return;
      clearInterval(hold.timer);
      if (hold.el.hasPointerCapture(hold.pointerId)) hold.el.releasePointerCapture(hold.pointerId);
      hold.el.classList.remove('holding');
      hold.el.style.removeProperty('--hold');
      if (!hold.sent) send({ type: 'hold.end', action: hold.action });
      hold = null;
    };
    $('stage').addEventListener('pointerdown', (e) => {
      if (editing || hold) return;
      const { item, w } = widgetAt(e.target);
      if (!w || w.kind !== 'action' || !isConfirm(w.bind.id)) return;
      const el = item.querySelector('.grid-stack-item-content');
      const action = w.bind.id;
      const started = Date.now();
      // Captured, so a slide just off the widget keeps the hold and the release still reaches it.
      el.setPointerCapture(e.pointerId);
      send({ type: 'hold.start', action });
      el.classList.add('holding');
      hold = { el, action, pointerId: e.pointerId, x: e.clientX, y: e.clientY, timer: setInterval(() => {
        const f = (Date.now() - started) / HOLD_MS;
        el.style.setProperty('--hold', String(Math.min(1, f)));
        if (f >= 1) { hold.sent = true; endHold(); send({ type: 'press', action, confirmed: true }); }
      }, 50) };
    });
    const holdPointer = (e) => hold && e.pointerId === hold.pointerId;
    window.addEventListener('pointermove', (e) => {
      if (holdPointer(e) && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > HOLD_SLOP_PX) endHold();
    });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) window.addEventListener(ev, (e) => { if (holdPointer(e)) endHold(); });
    // A long touch opens the context menu on Windows.
    $('stage').addEventListener('contextmenu', (e) => { if (hold || (!editing && e.target.closest('.button.confirm'))) e.preventDefault(); });

    // ------------------------------------------------------------ side pane

    const opt = (v, l, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(l)}</option>`;

    const FIXED = { mode: 'Master mode', status: 'Ship and link', shields: 'Shield level and faces', power: 'Power per system', weapons: 'Preset, weapons, countermeasures', fuel: 'Hydrogen and quantum fuel', config: 'Configuration settings' };
    /** Looks this widget may take: some are drawn for one toggle only (the gear lever). */
    const looksFor = (w) => meta.kinds[w.kind].looks.filter((l) => !meta.lookOnlyFor[l] || (w.bind.kind === 'toggle' && w.bind.id === meta.lookOnlyFor[l]));

    function bindOptions(w) {
      const kinds = meta.kinds[w.kind].binds;
      const cur = `${w.bind.kind}:${w.bind.id || w.bind.fn || ''}`;
      const groups = [];
      for (const k of kinds) {
        let list = [];
        if (k === 'value') list = (w.kind === 'lamp' ? meta.lampValues : cat.values.map((v) => v.id)).map((id) => [id, valueLabel(id)]);
        if (k === 'toggle') list = cat.toggles.map((t) => [t.id, t.label]);
        if (k === 'action') { list = cat.gameActions.map((a) => [a.name, `${a.name}${a.confirm ? ' (hold)' : ''}`]); if (w.bind.kind === 'action' && !list.some(([id]) => id === w.bind.id)) list.unshift([w.bind.id, w.bind.id]); }
        if (k === 'sequence') list = cat.sequences.map((s) => [s.id, s.name]);
        if (FIXED[k]) list = [['', FIXED[k]]];
        groups.push(`<optgroup label="${esc(k)}">${list.map(([id, l]) => opt(`${k}:${id}`, l, `${k}:${id}` === cur)).join('')}</optgroup>`);
      }
      return groups.join('');
    }

    function describe(st) {
      if (st.kind === 'action') return `Game action: ${st.action}`;
      if (st.kind === 'pause') return `Pause ${st.seconds} s`;
      if (st.kind === 'mode') return `Master mode to ${st.to}, wait up to ${st.timeoutS || 5} s`;
      return `${toggleLabel(st.toggle)} ${st.to.toUpperCase()}, wait up to ${st.timeoutS || 5} s`;
    }

    const KIND_NOTES = {
      shields: 'Four faces show as front, back, left and right, each with its own strength.',
      power: "Pips are not in the game's API. Weapons, thrusters and shields have game actions; the other systems are read-only.",
      config: 'Only coupled, G-safe and the advanced HUD (SCM and NAV) have game actions; the rest are read-only. Which advanced HUD the game toggles is not checked yet.',
      lever: 'Sets the gear up or down from its reported state; when the state is not reported, a click sends the game\'s toggle.',
      switch: 'Sets the opposite of the reported state; when the state is not reported, a click sends the game\'s toggle.',
    };

    function renderPane() {
      if (!editing || !work || !meta || !cat) return;
      const w = selected && work.widgets.find((x) => x.id === selected);
      const d = dirty();
      if (w) {
        const k = meta.kinds[w.kind];
        const seq = w.kind === 'sequence' && cat.sequences.find((s) => s.id === w.bind.id);
        const canInvert = w.bind.kind === 'value' || w.bind.kind === 'toggle';
        $('props').innerHTML = `<h2>${esc(k.name)}</h2>
          <label>Shows <select id="p-bind">${bindOptions(w)}</select></label>
          <label>Look <select id="p-look">${looksFor(w).map((l) => opt(l, l, l === w.look)).join('')}</select></label>
          <label>Label <input id="p-label" maxlength="${meta.limits.label}" value="${esc(w.label || '')}" placeholder="default" /></label>
          ${canInvert && (w.kind === 'lamp' || w.kind === 'toggle') ? `<label class="check">Invert <input type="checkbox" id="p-invert" ${w.bind.invert ? 'checked' : ''} /></label>` : ''}
          ${canGrey(w) ? `<label class="check">Hide when this ship lacks it <input type="checkbox" id="p-hide" ${w.hideUnsupported ? 'checked' : ''} /></label>
          <p class="note">Greyed by default when the ship does not report it. Hidden in use only; here it stays, marked.</p>` : ''}
          <p class="note">At column ${w.x + 1}, row ${w.y + 1}; ${w.w} x ${w.h} cells${k.min.w > 1 || k.min.h > 1 ? ` (at least ${k.min.w} x ${k.min.h})` : ''}</p>
          ${KIND_NOTES[w.look] || KIND_NOTES[w.kind] ? `<p class="note">${esc(KIND_NOTES[w.look] || KIND_NOTES[w.kind])}</p>` : ''}
          ${seq ? `<p class="note">Steps:</p><ol>${seq.steps.map((st) => `<li>${esc(describe(st))}</li>`).join('')}</ol>` : ''}
          <div class="row" style="margin-top:8px"><button class="btn danger" id="p-remove" type="button">Remove widget</button><button class="btn" id="p-deselect" type="button">Tab settings</button></div>`;
      } else {
        const i = dash.tabs.findIndex((t) => t.id === work.id);
        const lock = d ? 'disabled title="Save or revert first"' : '';
        $('props').innerHTML = `<h2>Tab</h2>
          <label>Name <input id="t-name" maxlength="${meta.limits.label}" value="${esc(work.name)}" /></label>
          <label>Rows <input id="t-rows" type="number" min="${meta.limits.minRows}" max="${meta.limits.maxRows}" value="${work.rows}" /></label>
          ${themes ? `<label>Tab theme <select id="t-theme">${themeOptions(work.theme, true)}</select></label>` : ''}
          <div class="row">
            <button class="btn" data-t="left" type="button" ${i <= 0 || d ? 'disabled' : ''}>Move left</button>
            <button class="btn" data-t="right" type="button" ${i < 0 || i >= dash.tabs.length - 1 || d ? 'disabled' : ''}>Move right</button>
            <button class="btn" data-t="dup" type="button" ${lock}>Duplicate</button>
            <button class="btn danger" data-t="remove" type="button" ${dash.tabs.length <= 1 ? 'disabled title="A dashboard keeps at least one tab"' : 'title="Delete this tab from the dashboard"'}>Delete tab</button>
          </div>
          <div class="row" style="margin-top:6px"><button class="btn" data-t="starter" type="button" ${lock}>Reset starter tab</button></div>
          <p class="note">Click a widget to edit it. Drag to move, drag a corner to resize.</p>
          ${themes ? `<h2 class="sub">Dashboard</h2>
          <label>Theme <select id="d-theme">${themeOptions(dash.theme, false)}</select></label>
          <label>Cell size <select id="d-cell">${meta.limits.cells.map((c) => opt(String(c), `${c} px`, c === cellPx())).join('')}</select></label>
          <div class="row"><button class="btn" data-t="themes" type="button">Edit themes</button></div>
          <p class="note">The dashboard theme and cell size are saved at once; cells stay square at that size, and a smaller window scrolls. A tab's own theme is saved with Save.${themeById(work.theme) && work.theme !== dash.theme ? ` This tab shows its own theme, ${esc(themeById(work.theme).name)}.` : ''}</p>` : ''}
          ${timeSettingsHtml()}
          ${shipNameHtml()}
          ${tabPlacementAndBezel(serverTab(work.id))}`;
      }
      renderCategories();
      renderItems();
    }

    $('props').addEventListener('input', (e) => {
      const w = selected && work.widgets.find((x) => x.id === selected);
      if (e.target.id === 'p-label' && w) { const t = e.target.value.trim(); if (t) w.label = e.target.value; else delete w.label; drawAll(); renderBar(); }
      if (e.target.id === 't-name') { work.name = e.target.value; renderBar(); }
    });
    $('props').addEventListener('change', (e) => {
      const w = selected && work.widgets.find((x) => x.id === selected);
      const id = e.target.id;
      if (id === 't-fs') {
        const p = serverTab(work.id) && serverTab(work.id).placement;
        if (p) send({ type: 'dash.setPlacement', tab: work.id, placement: { ...p, fullscreen: e.target.checked } });
        return;
      }
      if (id === 'd-theme') { send({ type: 'dash.setTheme', theme: e.target.value }); return; }
      if (id === 'd-cell') { send({ type: 'dash.setCell', cell: Number(e.target.value) }); return; }
      if (id === 'd-zone' || id === 'd-clock') {
        const time = { zone: $('d-zone').value, clock: $('d-clock').value };
        // The service pushes the setting to every page once saved; a refusal puts the old one back.
        send({ type: 'time.set', time }, (r) => { if (!r || (r.problems && r.problems.length)) live('props', renderPane); });
        return;
      }
      if (id === 't-theme') {
        if (e.target.value) work.theme = e.target.value; else delete work.theme;
        renderBar(); buildGrid(); return;
      }
      if (id === 'p-bind' && w) {
        const [kind, ...rest] = e.target.value.split(':');
        const bid = rest.join(':');
        const invert = w.bind.invert && (kind === 'value' || kind === 'toggle');
        w.bind = FIXED[kind] ? { kind } : { kind, id: bid, ...(invert ? { invert } : {}) };
        if (!looksFor(w).includes(w.look)) w.look = meta.kinds[w.kind].looks[0];
      } else if (id === 'p-look' && w) w.look = e.target.value;
      else if (id === 'p-invert' && w) { if (e.target.checked) w.bind.invert = true; else delete w.bind.invert; }
      else if (id === 'p-hide' && w) { if (e.target.checked) w.hideUnsupported = true; else delete w.hideUnsupported; }
      else if (id === 't-rows') {
        const rows = Number(e.target.value);
        const need = Math.max(meta.limits.minRows, ...work.widgets.map((x) => x.y + x.h));
        if (!Number.isInteger(rows) || rows < need || rows > meta.limits.maxRows) { notice(`Rows must be ${need} to ${meta.limits.maxRows} for the widgets on this tab`, 'bad'); e.target.value = work.rows; return; }
        work.rows = rows;
        buildGrid();
      } else return;
      renderBar(); renderPane(); drawAll();
    });
    $('props').addEventListener('click', async (e) => {
      if (e.target.id === 'p-remove') {
        const item = grid.getGridItems().find((x) => x.gridstackNode.id === selected);
        work.widgets = work.widgets.filter((x) => x.id !== selected);
        selected = null;
        if (item) grid.removeWidget(item);
        renderBar(); renderPane(); return;
      }
      if (e.target.id === 'p-deselect') { selected = null; drawAll(); renderPane(); return; }
      const t = e.target.closest('[data-t]');
      if (!t) return;
      const i = dash.tabs.findIndex((x) => x.id === work.id);
      const act = t.dataset.t;
      const saved = serverTab(work.id);
      if (act === 'themes') { openThemePanel(); return; }
      if (act === 'shipname-save') { if (vals && vals.ship) setShipName(vals.ship.className, $('d-shipname').value.trim() || null); return; }
      if (act === 'shipname-clear') { setShipName(t.dataset.class, null); return; }
      if (act === 'detach') { if (saved) detach(saved); else notice('Save the new tab before detaching it', 'bad'); }
      else if (act === 'forget') send({ type: 'dash.setPlacement', tab: work.id, placement: null });
      else if (act === 'map') { if (saved) openBezelPanel(work.id); else notice('Save the new tab before mapping bezel buttons', 'bad'); }
      else if (act === 'clear-bezel') {
        const c = await ask('Clear bezel buttons', `<p>Clear all ${saved.bezel.buttons.length} bezel buttons mapped on ${esc(saved.name)}?</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Clear all', value: 'clear', cls: 'danger' }]);
        if (c === 'clear') send({ type: 'dash.setBezel', tab: work.id, bezel: null });
      } else if (act === 'left' || act === 'right') send({ type: 'dash.moveTab', tab: work.id, to: i + (act === 'left' ? -1 : 1) });
      else if (act === 'dup') send({ type: 'dash.duplicateTab', tab: work.id }, (r) => { if (r && r.tab) { currentId = r.tab.id; work = clone(r.tab); renderBar(); renderPane(); buildGrid(); } });
      else if (act === 'starter') {
        const c = await ask('Reset starter tab', '<p>Put the Main tab back as shipped? Your changes to it are lost; other tabs stay as they are.</p>', [{ text: 'Cancel', value: 'cancel' }, { text: 'Reset', value: 'reset', cls: 'danger' }]);
        if (c === 'reset') send({ type: 'dash.resetStarter' }, (r) => { if (r && r.tab) { currentId = r.tab.id; work = clone(r.tab); renderBar(); renderPane(); buildGrid(); } });
      } else if (act === 'remove') {
        if (dash.tabs.length <= 1) return;
        const name = (saved || work).name;
        const n = (saved || work).widgets.length;
        const c = await ask('Delete tab', `<p>Delete the tab ${esc(name)} and its ${n} ${n === 1 ? 'widget' : 'widgets'}?${dirty() ? ' Its unsaved changes go too.' : ''} This cannot be undone, except by importing an exported file.</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Delete tab', value: 'remove', cls: 'danger' }]);
        if (c !== 'remove') return;
        const next = dash.tabs[i + 1] || dash.tabs[i - 1];
        send({ type: 'dash.removeTab', tab: work.id }, (r) => {
          if (!r || (r.problems && r.problems.length)) { if (r && r.problems) notice(r.problems[0], 'bad'); return; }
          notice(`Tab ${name} deleted`, 'ok');
          const to = (next && serverTab(next.id)) || dash.tabs[0];
          if (to && editing) { currentId = to.id; lastBoardTab = to.id; work = clone(to); selected = null; renderBar(); renderPane(); buildGrid(); }
        });
      }
    });

    // ------------------------------------------------------------ palette

    const CATEGORIES = [['', 'All kinds'], ['lamp', 'Lamps'], ['readout', 'Readouts'], ['toggle', 'Toggles'], ['action', 'Action buttons'], ['sequence', 'Sequence buttons'], ['mode', 'Master mode'], ['status', 'Status strip'],
      ['shields', 'Shield faces'], ['power', 'Power'], ['weapons', 'Weapons'], ['fuel', 'Fuel'], ['config', 'Configuration']];
    function renderCategories() {
      const sel = $('cat');
      if (sel.options.length) return;
      sel.innerHTML = CATEGORIES.map(([v, l]) => opt(v, l, false)).join('');
    }

    function paletteItems() {
      const items = [];
      for (const id of meta.lampValues) items.push({ kind: 'lamp', bind: { kind: 'value', id }, text: valueLabel(id) });
      for (const t of cat.toggles) items.push({ kind: 'lamp', bind: { kind: 'toggle', id: t.id }, text: t.label });
      for (const v of cat.values) items.push({ kind: 'readout', bind: { kind: 'value', id: v.id }, text: v.label });
      for (const t of cat.toggles) items.push({ kind: 'toggle', bind: { kind: 'toggle', id: t.id }, text: t.label });
      for (const t of cat.toggles) items.push({ kind: 'toggle', bind: { kind: 'toggle', id: t.id }, text: t.label, look: 'switch', extra: 'light switch' });
      for (const [look, id] of Object.entries(meta.lookOnlyFor)) items.push({ kind: 'toggle', bind: { kind: 'toggle', id }, text: toggleLabel(id), look, extra: 'gear lever', size: meta.leverSize });
      for (const a of cat.gameActions) items.push({ kind: 'action', bind: { kind: 'action', id: a.name }, text: a.name, extra: a.confirm ? 'hold' : a.category });
      for (const s of cat.sequences) items.push({ kind: 'sequence', bind: { kind: 'sequence', id: s.id }, text: s.name });
      items.push({ kind: 'mode', bind: { kind: 'mode' }, text: 'NAV / SCM selector' });
      items.push({ kind: 'status', bind: { kind: 'status' }, text: 'Ship name and link' });
      for (const k of ['shields', 'power', 'weapons', 'fuel', 'config']) items.push({ kind: k, bind: { kind: k }, text: FIXED[k] });
      return items;
    }

    let shownItems = [];
    function renderItems() {
      if (!editing || !meta || !cat) return;
      const q = $('q').value.trim().toLowerCase();
      const c = $('cat').value;
      const all = paletteItems();
      shownItems = all.filter((it) => (!c || it.kind === c) && (!q || `${it.text} ${it.bind.id || it.bind.fn || ''} ${meta.kinds[it.kind].name} ${it.extra || ''}`.toLowerCase().includes(q)));
      $('count').textContent = shownItems.length === all.length ? `${all.length} to choose from` : `${shownItems.length} of ${all.length} shown`;
      $('items').innerHTML = shownItems.map((it, i) => `<button class="item" data-i="${i}" type="button"><span>${esc(it.text)}</span><small>${esc(meta.kinds[it.kind].name)}${it.extra ? `, ${esc(it.extra)}` : ''}</small></button>`).join('');
    }
    $('q').addEventListener('input', renderItems);
    $('cat').addEventListener('change', renderItems);

    function freeSpot(w, h) {
      const taken = (x, y) => work.widgets.some((o) => x < o.x + o.w && o.x < x + w && y < o.y + o.h && o.y < y + h);
      for (let y = 0; y + h <= work.rows; y++) for (let x = 0; x + w <= meta.limits.columns; x++) if (!taken(x, y)) return { x, y };
      return null;
    }

    $('items').addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      const it = shownItems[Number(b.dataset.i)];
      if (work.widgets.length >= meta.limits.widgets) { notice(`A tab holds at most ${meta.limits.widgets} widgets`, 'bad'); return; }
      const k = meta.kinds[it.kind];
      const size = it.size || k.size;
      const at = freeSpot(size.w, size.h);
      if (!at) { notice(`No free ${size.w} x ${size.h} space on this tab. Make room, or add rows in Tab settings.`, 'bad'); return; }
      let n = 1;
      while (work.widgets.some((x) => x.id === `${it.kind}-${n}`)) n++;
      const w = { id: `${it.kind}-${n}`, kind: it.kind, x: at.x, y: at.y, w: size.w, h: size.h, bind: clone(it.bind), look: it.look || k.looks[0] };
      work.widgets.push(w);
      selected = w.id;
      buildGrid();
      renderBar(); renderPane();
    });

    // ------------------------------------------------------------ detach and placement

    // In the Hardpoint app, window.scApp opens tabs in native windows on a display; a plain browser has none.
    const APP = window.scApp || null;
    const hasScreens = () => typeof window.getScreenDetails === 'function';
    const tabUrl = (tab, fs) => `/dash?tab=${encodeURIComponent(tab.id)}&kiosk=1${fs ? '&fs=1' : ''}`;
    const winName = (tab) => `sc-dash-${tab.id}`;
    const screenText = (s) => `${s.width} x ${s.height} at ${s.left}, ${s.top}${s.isPrimary ? ', primary' : ''}${s.isInternal ? ', built in' : ''}`;

    /** Open a tab's kiosk window on a screen, sized to it; `fullscreen` is a hint the browser may ignore. */
    function openOn(tab, s, fs) {
      const f = `popup,left=${s.availLeft},top=${s.availTop},width=${s.availWidth},height=${s.availHeight}${fs ? ',fullscreen' : ''}`;
      return window.open(tabUrl(tab, fs), winName(tab), f);
    }

    async function screenDetails() {
      if (!hasScreens()) return { why: 'This browser cannot place windows on a chosen display (it has no Window Management API).' };
      try { return { details: await window.getScreenDetails() }; } catch { return { why: 'Permission to place windows on your displays was not given. You can allow it in the site settings (Window management).' }; }
    }

    // A display is remembered on a dashboard tab; the Fleet tab is not one, so it is chosen each time.
    const keepHtml = (tab) => (tab.id === FLEET_TAB ? '' : '<label class="check"><input type="checkbox" id="d-keep" checked /> Remember this display for the tab</label>');

    async function detach(tab) {
      if (!tab) return;
      if (APP) return detachInApp(tab);
      const { details, why } = await screenDetails();
      if (!details) return detachByHand(tab, why);
      const screens = details.screens;
      const labels = screens.map((s) => s.label || '');
      const wanted = tab.placement ? labels.indexOf(tab.placement.displayLabel) : -1;
      const pick = wanted >= 0 ? wanted : Math.max(0, screens.findIndex((s) => s !== details.currentScreen));
      const list = screens.map((s, i) => `<label class="screen"><input type="radio" name="scr" value="${i}" ${i === pick ? 'checked' : ''} />` +
        `<b>${esc(s.label || 'Unnamed display')}</b><small>${esc(screenText(s))}${s === details.currentScreen ? ', this window' : ''}</small></label>`).join('');
      const body = `<p>Choose the display for ${esc(tab.name)}. It opens in use mode, with the cursor hidden.</p><div class="screens">${list}</div>` +
        `<label class="check"><input type="checkbox" id="d-fs" ${!tab.placement || tab.placement.fullscreen ? 'checked' : ''} /> Full screen</label>` +
        keepHtml(tab) +
        (tab.placement && wanted < 0 ? `<p class="warn">The remembered display, ${esc(tab.placement.displayLabel)}, is not connected.</p>` : '');
      const c = await ask(`Detach ${tab.name}`, body, [{ text: 'Cancel', value: 'cancel' }, { text: 'Open on display', value: 'open', cls: 'primary' }]);
      if (c !== 'open') return;
      const i = Number(($('dlg-body').querySelector('input[name=scr]:checked') || {}).value || 0);
      const fs = $('d-fs').checked;
      const s = screens[i];
      if (!openOn(tab, s, fs)) { notice('The browser blocked the new window. Allow pop-ups for this page and try again.', 'bad'); return; }
      if (!$('d-keep') || !$('d-keep').checked) return;
      const label = (s.label || '').trim();
      // Identity is the display's name; a display with no name, or a name two share, cannot be told apart.
      if (!label) { notice('This display has no name, so the placement cannot be remembered', 'bad'); return; }
      if (labels.filter((l) => l === s.label).length > 1) notice(`Two displays are named ${label}; restore may pick either`, 'bad');
      send({ type: 'dash.setPlacement', tab: tab.id, placement: { displayLabel: label.slice(0, meta.limits.displayLabel), fullscreen: fs } });
    }

    /** The app's displays come with their names (the monitor's own name), so the picker is the same. */
    async function detachInApp(tab) {
      const { displays, shared } = await APP.request('displays');
      if (!displays.length) { notice('The app sees no displays', 'bad'); return; }
      const labels = displays.map((d) => d.label);
      const wanted = tab.placement ? labels.indexOf(tab.placement.displayLabel) : -1;
      const pick = wanted >= 0 ? wanted : Math.max(0, displays.findIndex((d) => !d.primary));
      const text = (d) => `${d.width} x ${d.height} at ${d.left}, ${d.top}${d.primary ? ', primary' : ''}${d.builtin ? ', built in' : ''}`;
      const list = displays.map((d, i) => `<label class="screen"><input type="radio" name="scr" value="${i}" ${i === pick ? 'checked' : ''} />` +
        `<b>${esc(d.label || 'Unnamed display')}</b><small>${esc(text(d))}</small></label>`).join('');
      const body = `<p>Choose the display for ${esc(tab.name)}. It opens in use mode, with the cursor hidden, and never takes the focus from the game.</p><div class="screens">${list}</div>` +
        `<label class="check"><input type="checkbox" id="d-fs" ${!tab.placement || tab.placement.fullscreen ? 'checked' : ''} /> Full screen</label>` +
        keepHtml(tab) +
        (tab.placement && wanted < 0 ? `<p class="warn">The remembered display, ${esc(tab.placement.displayLabel)}, is not connected.</p>` : '');
      const c = await ask(`Detach ${tab.name}`, body, [{ text: 'Cancel', value: 'cancel' }, { text: 'Open on display', value: 'open', cls: 'primary' }]);
      if (c !== 'open') return;
      const d = displays[Number(($('dlg-body').querySelector('input[name=scr]:checked') || {}).value || 0)];
      const fs = $('d-fs').checked;
      const label = (d.label || '').trim();
      if (!label) { notice('This display has no name, so the app cannot place a window on it by name', 'bad'); return; }
      if (shared.includes(d.label)) { notice(`Two displays are named ${label}, so the app cannot tell them apart`, 'bad'); return; }
      const r = await APP.request('open', { tab: tab.id, displayLabel: d.label, fullscreen: fs });
      if (!r.ok) { notice(r.text, 'bad'); return; }
      if ($('d-keep') && $('d-keep').checked) send({ type: 'dash.setPlacement', tab: tab.id, placement: { displayLabel: label.slice(0, meta.limits.displayLabel), fullscreen: fs } });
    }

    async function detachByHand(tab, why) {
      const body = `<p>${esc(why)}</p><p>${esc(tab.name)} opens in a new window. Drag it to the display you want, then press F11 for full screen.</p>` +
        '<p class="warn">Without the API the display cannot be remembered for this tab.</p>';
      const c = await ask(`Detach ${tab.name}`, body, [{ text: 'Cancel', value: 'cancel' }, { text: 'Open window', value: 'open', cls: 'primary' }]);
      if (c === 'open' && !window.open(tabUrl(tab, false), winName(tab), 'popup,width=1024,height=768')) notice('The browser blocked the new window. Allow pop-ups for this page and try again.', 'bad');
    }

    async function restoreDetached() {
      if (APP) {
        const { tabs } = await APP.request('restore');
        const text = { open: 'opened', missing: 'display not connected', ambiguous: 'two displays have this name', failed: 'could not open' };
        const body = `<ul class="list">${tabs.map((t) => `<li><span>${esc(t.name)}</span><small class="${t.state === 'open' ? '' : 'bad'}">${esc(t.displayLabel)}: ${esc(text[t.state] || t.state)}</small></li>`).join('')}</ul>`;
        await ask('Restore detached tabs', body, [{ text: 'Close', value: 'close', cls: 'primary' }]);
        return;
      }
      const placed = restorable();
      const { details, why } = await screenDetails();
      if (!details) {
        await ask('Restore detached tabs', `<p>${esc(why)}</p><p>Detach each tab by hand instead: it opens in a window you drag to its display.</p>`, [{ text: 'Close', value: 'close' }]);
        return;
      }
      const screenOf = (t) => details.screens.find((s) => s.label === t.placement.displayLabel);
      // A browser may allow one new window per click, so each one left over gets its own button.
      const state = new Map();
      for (const t of placed) {
        const s = screenOf(t);
        state.set(t.id, !s ? 'missing' : openOn(t, s, t.placement.fullscreen) ? 'open' : 'blocked');
      }
      for (;;) {
        const text = { open: 'opened', missing: 'display not connected', blocked: 'blocked, press Open' };
        const body = `<ul class="list">${placed.map((t) => `<li><span>${esc(t.name)}</span><small class="${state.get(t.id) === 'open' ? '' : 'bad'}">${esc(t.placement.displayLabel)}: ${text[state.get(t.id)]}</small></li>`).join('')}</ul>`;
        const blocked = placed.filter((t) => state.get(t.id) === 'blocked');
        const c = await ask('Restore detached tabs', body, [...blocked.map((t) => ({ text: `Open ${t.name}`, value: t.id })), { text: 'Close', value: 'close', cls: blocked.length ? '' : 'primary' }]);
        const t = placed.find((x) => x.id === c);
        if (!t) return;
        state.set(t.id, openOn(t, screenOf(t), t.placement.fullscreen) ? 'open' : 'blocked');
      }
    }

    /** The placed tabs to open: this dashboard's, and the generic ones whose name it lacks. */
    const restorable = () => [...dash.tabs, ...(genericBoard ? genericBoard.tabs.filter((g) => !dash.tabs.some((t) => t.name === g.name)) : [])].filter((t) => t.placement);

    function tabPlacementAndBezel(t) {
      if (!t) return '<h2 class="sub">Display and bezel</h2><p class="note">Save the new tab first to detach it or map bezel buttons.</p>';
      const p = t.placement;
      const b = t.bezel;
      const MAX_SHOWN = 6;
      const maps = b ? b.buttons.slice(0, MAX_SHOWN).map((m) => `<li><b>${m.button}</b><span>${esc(bezelText(m))}</span></li>`).join('') : '';
      return `<h2 class="sub">Display</h2>
        ${p ? `<p class="note">Opens on <b>${esc(p.displayLabel)}</b>${p.fullscreen ? ', full screen' : ', in a window'}.</p>
          <label class="check">Full screen <input type="checkbox" id="t-fs" ${p.fullscreen ? 'checked' : ''} /></label>`
          : '<p class="note">No display yet. Detach the tab and choose one to remember it.</p>'}
        <div class="row"><button class="btn" data-t="detach" type="button">Detach</button>${p ? '<button class="btn" data-t="forget" type="button">Forget display</button>' : ''}</div>
        <h2 class="sub">Bezel buttons</h2>
        ${b && b.buttons.length ? `<p class="note">${b.buttons.length} of ${meta.limits.bezelButtons} on ${esc(b.gamepadId)}</p><ul class="maps">${maps}</ul>${b.buttons.length > MAX_SHOWN ? `<p class="note">and ${b.buttons.length - MAX_SHOWN} more</p>` : ''}`
          : '<p class="note">None mapped. Bezel buttons work on the detached tab.</p>'}
        <div class="row"><button class="btn" data-t="map" type="button">Map bezel buttons</button>${b ? '<button class="btn danger" data-t="clear-bezel" type="button">Clear all</button>' : ''}</div>
        <p class="note">Display and bezel changes are saved at once, not with Save.</p>`;
    }

    // ------------------------------------------------------------ dashboards: generic and per ship (Rust service)

    // What the panel was last drawn from, so a values push that changes nothing here leaves it alone.
    let dashPanelKey = '';
    function openDashPanel() {
      dashPanel = true;
      renamingBoard = null;
      renderDashPanel(true);
      renderBar();
    }
    function closeDashPanel() {
      dashPanel = false;
      renamingBoard = null;
      $('dash-panel').hidden = true;
      renderBar();
    }

    function renderDashPanel(force) {
      const el = $('dash-panel');
      if (!dashPanel || !boards || !board) { el.hidden = true; return; }
      const ship = (vals && vals.ship) || null;
      const key = JSON.stringify([ship, boards, board.id, renamingBoard, themes && themes.user.length]);
      if (!force && key === dashPanelKey && !el.hidden) return;
      dashPanelKey = key;
      const list = boards.list;
      const match = ship && ship.dashboard ? list.find((b) => b.id === ship.dashboard) : null;
      const themeName = (id) => (themeById(id) || { name: id }).name;
      let shipHtml;
      if (!ship) shipHtml = '<p class="note">Not in a ship. The ship you get into shows here, with its dashboard.</p>';
      else {
        shipHtml = `<p class="ship"><b>${esc(ship.name)}</b><small>${esc(ship.className)}</small></p>`;
        if (match && match.id === board.id) shipHtml += `<p class="note">${esc(match.name)} is this ship's dashboard and is on screen.</p>`;
        else if (match) shipHtml += `<div class="row"><button class="btn primary" data-dp="select" data-id="${esc(match.id)}" type="button">Show ${esc(match.name)}</button></div>`;
        else {
          shipHtml += `<div class="make"><label>Copy from <select id="dp-from">${list.map((b) => opt(b.id, b.name, b.id === board.id)).join('')}</select></label>` +
            `<button class="btn primary" data-dp="create" type="button" ${list.length >= meta.limits.dashboards ? 'disabled' : ''}>Create a dashboard for this ship</button></div>` +
            '<p class="note">The copy keeps its tab names, so detached tabs follow it. It starts in the maker\'s theme where there is one (Drake for a Drake ship).</p>';
        }
      }
      const rows = list.map((b) => {
        const on = b.id === board.id;
        const what = b.generic ? 'Generic: for any ship without its own' : b.ship ? b.shipName || b.ship.model : 'No ship';
        const facts = `${what} · ${b.tabs} ${b.tabs === 1 ? 'tab' : 'tabs'}${b.theme ? ` · ${themeName(b.theme)}` : ''}`;
        if (renamingBoard === b.id) {
          return `<div class="drow on"><span class="what"><input id="dp-name" maxlength="${meta.limits.label}" value="${esc(b.name)}" aria-label="Dashboard name" /><small>${esc(facts)}</small></span>` +
            `<span class="acts"><button class="btn primary" data-dp="rename-ok" data-id="${esc(b.id)}" type="button">OK</button><button class="btn" data-dp="rename-cancel" type="button">Cancel</button></span></div>`;
        }
        return `<div class="drow ${on ? 'on' : ''}"><span class="what"><b>${esc(b.name)}</b><small>${esc(facts)}</small></span><span class="acts">` +
          (on ? '<span class="here">On screen</span>' : `<button class="btn" data-dp="select" data-id="${esc(b.id)}" type="button">Show</button>`) +
          `<button class="btn" data-dp="rename" data-id="${esc(b.id)}" type="button">Rename</button>` +
          `<button class="btn" data-dp="dup" data-id="${esc(b.id)}" type="button" ${list.length >= meta.limits.dashboards ? 'disabled' : ''}>Duplicate</button>` +
          (b.generic ? '' : `<button class="btn danger" data-dp="remove" data-id="${esc(b.id)}" type="button">Remove</button>`) + '</span></div>';
      }).join('');
      el.innerHTML = '<h3>Dashboards</h3>' +
        `<section><h4>Ship</h4>${shipHtml}</section>` +
        `<section><h4>Dashboards</h4><div class="dlist">${rows}</div>${boards.pinned ? '<p class="note">Picked by hand: it stays until you change ship.</p>' : ''}</section>` +
        `<section><label class="check"><input type="checkbox" id="dp-switch" ${boards.switchOnShipChange ? 'checked' : ''} /> Switch dashboard when I change ship</label>` +
        '<p class="note">On: a different ship, recognised for 2 s, shows its own dashboard, or the generic one. Getting out keeps the dashboard on screen, and a switch waits for a running sequence to end. Off: the ship\'s dashboard is offered above.</p></section>' +
        '<section><h4>Functions a ship lacks</h4><p class="note">Controls for what the ship does not report are greyed, learned per ship class and game build. Reset to learn again.</p>' +
        `<div class="row">${ship ? `<button class="btn" data-dp="reset-ship" type="button">Reset for ${esc(ship.name)}</button>` : ''}<button class="btn" data-dp="reset-all" type="button">Reset for every ship</button></div></section>` +
        (boards.fileProblem ? `<p class="warn">${esc(boards.fileProblem)}</p>` : '') +
        '<div class="row end"><button class="btn primary" data-dp="done" type="button">Done</button></div>';
      el.hidden = false;
      const name = $('dp-name');
      if (name && !name._focused) { name._focused = true; name.focus(); name.select(); }
    }

    $('dash-panel').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-dp]');
      if (!b) return;
      const act = b.dataset.dp, id = b.dataset.id;
      const ship = vals && vals.ship;
      const target = boards && boards.list.find((x) => x.id === id);
      if (act === 'done') return closeDashPanel();
      if (act === 'select') {
        if (!(await confirmLeave())) return;
        send({ type: 'dash.select', dashboard: id });
      } else if (act === 'create') {
        if (!(await confirmLeave())) return;
        send({ type: 'dash.createForShip', from: $('dp-from').value }, (r) => { if (r && r.dashboard) notice(`Made ${r.dashboard.name}`, 'ok'); });
      } else if (act === 'dup') {
        if (!(await confirmLeave())) return;
        send({ type: 'dash.duplicate', dashboard: id }, (r) => { if (r && r.dashboard) notice(`Made ${r.dashboard.name}`, 'ok'); });
      } else if (act === 'rename') { renamingBoard = id; renderDashPanel(true); }
      else if (act === 'rename-cancel') { renamingBoard = null; renderDashPanel(true); }
      else if (act === 'rename-ok') {
        send({ type: 'dash.rename', dashboard: id, name: $('dp-name').value }, (r) => { if (r && r.problems && !r.problems.length) { renamingBoard = null; renderDashPanel(true); } });
      } else if (act === 'remove' && target) {
        const c = await ask('Remove dashboard', `<p>Remove the dashboard ${esc(target.name)} and its ${target.tabs} ${target.tabs === 1 ? 'tab' : 'tabs'}? This cannot be undone, except by importing an exported file.</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Remove', value: 'remove', cls: 'danger' }]);
        if (c === 'remove') send({ type: 'dash.remove', dashboard: id });
      } else if (act === 'reset-ship' && ship) {
        send({ type: 'support.reset', className: ship.className }, () => notice(`Learning ${ship.name} again`, 'ok'));
      } else if (act === 'reset-all') {
        const c = await ask('Reset for every ship', '<p>Forget which functions every ship lacks? Each ship is learned again the next time you are in it (10 s).</p>', [{ text: 'Cancel', value: 'cancel' }, { text: 'Reset', value: 'reset', cls: 'danger' }]);
        if (c === 'reset') send({ type: 'support.reset' }, () => notice('Learning every ship again', 'ok'));
      }
    });
    $('dash-panel').addEventListener('change', (e) => {
      if (e.target.id === 'dp-switch') send({ type: 'dash.setSwitch', on: e.target.checked });
    });

    // ------------------------------------------------------------ theme editor

    const FONT_NAMES = { condensed: 'Condensed', mono: 'Monospaced', sans: 'Plain sans' };
    const BAR_NAMES = { segmented: 'Segmented', solid: 'Solid' };
    const TOKEN_NAMES = {
      bg: 'Background', panel: 'Panel', 'panel-2': 'Raised panel', line: 'Lines', fg: 'Text', dim: 'Labels', faint: 'Faint text', value: 'Values',
      accent: 'Edge accent', select: 'Selected', 'select-fg': 'Selected text', 'title-bg': 'Title bar', 'title-fg': 'Title text', bar: 'Bars',
      ok: 'Good', warn: 'Caution', bad: 'Warning', off: 'Off',
      'lamp-off-bg': 'Lamp off', 'lamp-off-fg': 'Lamp off text', 'lamp-nominal-bg': 'Lamp normal', 'lamp-nominal-fg': 'Lamp normal text', 'lamp-on-bg': 'Lamp on', 'lamp-on-fg': 'Lamp on text',
      'lamp-minor-bg': 'Lamp caution', 'lamp-minor-fg': 'Lamp caution text', 'lamp-major-bg': 'Lamp warning', 'lamp-major-fg': 'Lamp warning text',
      'input-bg': 'Field', 'input-fg': 'Field text', 'input-border': 'Field edge', 'input-placeholder': 'Field hint', 'input-focus': 'Field focus',
    };

    /** WCAG 2 relative luminance and contrast, to warn of a pair that is hard to read; never a reason to refuse. */
    function luminance(hex) {
      const h = sixDigits(hex).slice(1);
      const c = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    }
    const contrastOf = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
    // Text needs 4.5:1; a field's hint and focus ring 3:1.
    const CONTRAST_PAIRS = [['input-fg', 'input-bg', 4.5], ['fg', 'bg', 4.5], ['fg', 'panel', 4.5], ['value', 'panel', 4.5], ['title-fg', 'title-bg', 4.5], ['select-fg', 'select', 4.5], ['input-placeholder', 'input-bg', 3], ['input-focus', 'input-bg', 3]];
    function contrastWarnings(t) {
      return CONTRAST_PAIRS.filter(([a, b]) => HEX.test(t.colors[a] || '') && HEX.test(t.colors[b] || ''))
        .map(([a, b, min]) => [a, b, min, contrastOf(t.colors[a], t.colors[b])])
        .filter(([, , min, r]) => r < min)
        .map(([a, b, min, r]) => `${TOKEN_NAMES[a] || a} on ${TOKEN_NAMES[b] || b}: ${r.toFixed(1)}:1, ${min}:1 needed`);
    }
    const contrastHtml = (t) => { const w = contrastWarnings(t); return w.length ? `<b>Hard to read</b> (you can still save):<ul>${w.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''; };

    function themeOptions(cur, forTab) {
      const dashName = (themeById(dash.theme) || themeById(themes.defaultTheme)).name;
      // The dashboard's own select is further down; naming this option after it read as one dropdown twice.
      const head = forTab ? opt('', `Same as the dashboard (${dashName})`, !themeById(cur)) : '';
      const sel = forTab ? cur : (themeById(cur) ? cur : themes.defaultTheme);
      const group = (label, list) => (list.length ? `<optgroup label="${esc(label)}">${list.map((t) => opt(t.id, t.name, t.id === sel)).join('')}</optgroup>` : '');
      return head + group('Built in', themes.builtIn) + group('Yours', themes.user);
    }

    /** A colour input takes #rrggbb only: #rgb is spelled out and the alpha of #rrggbbaa dropped. */
    const sixDigits = (v) => (v.length === 4 ? `#${[...v.slice(1)].map((c) => c + c).join('')}` : v.slice(0, 7)).toLowerCase();

    // The theme selected in the editor; its draft (themeDraft) is shown on the page while the editor is open.
    let themeEdit = null;
    const themeDirty = () => themeDraft && !isBuiltInTheme(themeDraft.id) && JSON.stringify(themeDraft) !== JSON.stringify(themeById(themeDraft.id));

    function selectTheme(id) {

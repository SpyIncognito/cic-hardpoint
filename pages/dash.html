<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hardpoint Dashboard</title>
  <link rel="stylesheet" href="/vendor/gridstack/gridstack.min.css" />
  <style>
    /* Colours come from the theme. The service puts every built-in here in place of this block (RSI, for a
       service without themes); a user theme's colours are set on the body. */
    /*__THEMES__*/[data-theme="rsi"] { --bg: #0c1318; --panel: #18232b; --panel-2: #202d36; --line: #364955; --fg: #eef3f5; --dim: #8fa1ab; --faint: #4a5d68; --value: #ffffff; --accent: #f5c518; --select: #ff8a1e; --select-fg: #170b02; --title-bg: #e8edf0; --title-fg: #0b1217; --bar: #e8edf0; --ok: #55d494; --warn: #ffb020; --bad: #ff4d40; --off: #6b7c86; --lamp-off-bg: #0e161b; --lamp-off-fg: #6f818b; --lamp-nominal-bg: #17232b; --lamp-nominal-fg: #b8c8d0; --lamp-on-bg: #17442f; --lamp-on-fg: #8ff2bf; --lamp-minor-bg: #5c3e05; --lamp-minor-fg: #ffc94a; --lamp-major-bg: #621510; --lamp-major-fg: #ff7466; --input-bg: #081014; --input-fg: #eef3f5; --input-border: #4f6573; --input-placeholder: #8fa1ab; --input-focus: #f5c518; }/*__END_THEMES__*/
    @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; font-display: swap; src: url(/vendor/barlow-semi-condensed/barlow-semi-condensed-latin-500-normal.woff2) format("woff2"); }
    @font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; font-display: swap; src: url(/vendor/barlow-semi-condensed/barlow-semi-condensed-latin-600-normal.woff2) format("woff2"); }
    @font-face { font-family: "Barlow Semi Condensed"; font-weight: 700; font-display: swap; src: url(/vendor/barlow-semi-condensed/barlow-semi-condensed-latin-700-normal.woff2) format("woff2"); }
    /* Shapes and type: every widget reads these; a base (the built-in a theme comes from) changes them. */
    body {
      --radius: 2px;
      --lamp-radius: 2px;
      --plate-r: 5px;
      --edge: 2px;
      --lw: 1px;
      --rule: solid;
      --gap: 3px;
      --bar-h: 36px;
      --pane-w: 340px;
      --font-ui: "Segoe UI", system-ui, "DejaVu Sans", sans-serif;
      --weight-label: 600;
      --weight-value: 700;
      --tracking: .06em;
      --title-pre: "";
      --chev-l: "";
      --chev-r: "";
      --lz: .3;
    }
    [data-font="condensed"] { --font: "Barlow Semi Condensed", "Bahnschrift SemiCondensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif; }
    [data-font="mono"] { --font: "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
    [data-font="sans"] { --font: system-ui, "Segoe UI", "DejaVu Sans", sans-serif; }
    [data-base="rsi"] { --lamp-radius: 6px; --tracking: .07em; --chev-l: "\00AB"; --chev-r: "\00BB"; --chamfer: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
    [data-base="drake"] { --radius: 0; --lamp-radius: 0; --plate-r: 0; --edge: 1px; --rule: dashed; --tracking: .16em; --weight-label: 700; --title-pre: "// "; --chev-l: "<"; --chev-r: ">"; --lz: 0; --font-ui: var(--font); }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--fg); font: 13px/1.35 var(--font-ui); }
    [data-base="drake"] #body { background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--accent) 9%, var(--bg)), var(--bg) 75%); }
    /* A faint CRT scanline over the whole Drake screen; it never takes a click. */
    [data-base="drake"]::after { content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, color-mix(in srgb, var(--bg) 22%, transparent) 2px 3px); }
    button, input, select, textarea { font: inherit; color: inherit; }
    /* Every text field and list takes its colours from the theme, never the native white control;
       color-scheme keeps WebView2 and Chromium from drawing light scrollbars, pickers and option lists. */
    :root { color-scheme: dark; }
    input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]), select, textarea {
      background-color: var(--input-bg); color: var(--input-fg); border: 1px solid var(--input-border); border-radius: var(--radius); padding: 3px 6px; }
    input::placeholder, textarea::placeholder { color: var(--input-placeholder); opacity: 1; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--input-focus); outline-offset: 0; border-color: var(--input-focus); }
    select option, select optgroup { background-color: var(--input-bg); color: var(--input-fg); }
    input[type=checkbox], input[type=radio] { accent-color: var(--input-focus); }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* ------------------------------------------------------------ bar */
    #bar { flex: 0 0 var(--bar-h); display: flex; align-items: stretch; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
    #bar[hidden] { display: none; }
    #tabs { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: none; }
    .tab { flex: 0 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 12px; cursor: pointer; color: var(--dim); font-family: var(--font); font-weight: var(--weight-label); letter-spacing: var(--tracking); text-transform: uppercase; white-space: nowrap; }
    .tab.on { color: var(--fg); border-bottom-color: var(--select); }
    /* The selected tab is the page title: filled, between the base's chevrons. */
    .tab.on::before { content: var(--chev-l); margin-right: 10px; }
    .tab.on::after { content: var(--chev-r); margin-left: 10px; }
    [data-base="drake"] #tabs { gap: 6px; align-items: center; }
    [data-base="drake"] .tab { height: 26px; border: 1px solid transparent; letter-spacing: var(--tracking); }
    [data-base="drake"] .tab.on { background: var(--title-bg); color: var(--title-fg); border-color: var(--title-bg); }
    [data-base="rsi"] #tabs { gap: 4px; align-items: center; }
    [data-base="rsi"] .tab { height: 24px; padding: 0 16px; border: 0; background: var(--panel-2); color: var(--dim); clip-path: var(--chamfer); }
    [data-base="rsi"] .tab.on { background: var(--title-bg); color: var(--title-fg); }
    .tab.add { color: var(--accent); }
    .tools { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
    .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.primary { background: var(--select); border-color: var(--select); color: var(--select-fg); font-weight: 600; }
    .btn.danger { border-color: var(--bad); }
    .dirty { color: var(--accent); font-size: 12px; white-space: nowrap; }

    /* ------------------------------------------------------------ stage and pane */
    #body { flex: 1 1 auto; display: flex; min-height: 0; }
    #stage { flex: 1 1 auto; position: relative; overflow: hidden; min-width: 0; }
    .editing #stage { background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: var(--cw, 40px) var(--ch, 40px); background-color: var(--bg); }
    #pane { flex: 0 0 var(--pane-w); border-left: 1px solid var(--line); background: var(--panel); display: none; flex-direction: column; min-height: 0; }
    .editing #pane { display: flex; }
    #pane section { padding: 10px 12px; border-bottom: var(--lw) var(--rule) var(--line); }
    #pane h2 { margin: 0 0 8px; font: var(--weight-label) 12px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
    #pane label { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 6px; color: var(--dim); }
    #pane label.check { grid-template-columns: auto auto; justify-content: start; }
    #pane input:not([type=checkbox]), #pane select { width: 100%; min-width: 0; padding: 4px 6px; }
    #pane .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #pane .note { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
    #pane ol { margin: 4px 0 0; padding-left: 20px; color: var(--dim); }
    #palette { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; border-bottom: 0 !important; }
    #palette .filters { display: flex; gap: 6px; margin-bottom: 6px; }
    #palette .filters input { flex: 3 1 0; } #palette .filters select { flex: 2 1 0; }
    #items { flex: 1 1 auto; overflow-y: auto; display: grid; gap: 2px; align-content: start; }
    .item { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--radius); padding: 3px 6px; cursor: pointer; }
    .item:hover { border-color: var(--line); background: var(--panel-2); }
    .item small { color: var(--dim); white-space: nowrap; }
    #count { color: var(--dim); font-size: 12px; margin: 0 0 4px; }

    /* ------------------------------------------------------------ grid */
    .grid-stack-item-content { overflow: hidden !important; container-type: size; }
    .grid-stack-item.sel > .grid-stack-item-content::before { content: ""; position: absolute; inset: 0; border: 3px solid var(--select); z-index: 2; pointer-events: none; }
    .editing .grid-stack-item-content { cursor: move; }
    .grid-stack-placeholder > .placeholder-content { background: color-mix(in srgb, var(--select) 15%, transparent) !important; border: 1px dashed var(--select); }
    /* The service times the hold; this only draws it. */
    .grid-stack-item-content.holding::after { content: ""; position: absolute; left: 0; bottom: 0; height: 6%; min-height: 3px; width: calc(var(--hold, 0) * 100%); background: var(--bad); pointer-events: none; }

    /* A widget draws inside its own box; text scales with the box, never past it. */
    .w { position: absolute; inset: 0; font-family: var(--font); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; user-select: none; }
    .fit { display: block; flex: 0 0 auto; max-width: 100%; line-height: 1.05; white-space: nowrap; overflow: hidden; font-size: min(calc(var(--fh) * 1cqh), calc(var(--fw, 150) * 1cqw / var(--n))); }
    .lbl { color: var(--dim); font-weight: var(--weight-label); letter-spacing: var(--tracking); text-transform: uppercase; }
    .lbl::before { content: var(--title-pre); }
    .lz { opacity: var(--lz); }
    tspan.lz { opacity: 1; fill-opacity: var(--lz); }
    [data-zeros="none"] .lz { display: none; }
    .val { font-weight: var(--weight-value); }
    .t-ok { color: var(--value); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); } .t-off { color: var(--off); } .t-unknown { color: var(--faint); } .t-info { color: var(--value); }
    .panel { background: var(--panel); border: var(--lw) solid var(--line); border-radius: var(--radius); }
    /* RSI: thin corner brackets on every panel. */
    [data-base="rsi"] .panel { --bk: color-mix(in srgb, var(--fg) 45%, transparent); background:
      linear-gradient(var(--bk), var(--bk)) left top / 12px var(--lw) no-repeat, linear-gradient(var(--bk), var(--bk)) left top / var(--lw) 12px no-repeat,
      linear-gradient(var(--bk), var(--bk)) right top / 12px var(--lw) no-repeat, linear-gradient(var(--bk), var(--bk)) right top / var(--lw) 12px no-repeat,
      linear-gradient(var(--bk), var(--bk)) left bottom / 12px var(--lw) no-repeat, linear-gradient(var(--bk), var(--bk)) left bottom / var(--lw) 12px no-repeat,
      linear-gradient(var(--bk), var(--bk)) right bottom / 12px var(--lw) no-repeat, linear-gradient(var(--bk), var(--bk)) right bottom / var(--lw) 12px no-repeat,
      var(--panel); }
    .press { cursor: pointer; }
    .editing .press { cursor: move; }

    .readout { padding: 6cqh 6cqw; gap: 4cqh; border-left: var(--edge) solid var(--accent); }
    .readout .lbl { --fh: 13; }
    .readout .val { --fh: 42; }
    .readout.bar .val { --fh: 36; }
    .meter { width: 100%; height: max(4px, 9cqh); background: var(--lamp-off-bg); border: var(--lw) solid var(--line); display: flex; --c: var(--bar); }
    .meter.t-warn { --c: var(--warn); } .meter.t-bad { --c: var(--bad); }
    .meter > i { display: block; height: 100%; background: var(--c); }
    /* Segments are sized by the widget, not the fill, so they stay put as the value moves. */
    [data-bars="segmented"] .meter > i { background: repeating-linear-gradient(to right, var(--c) 0 calc(4cqw - 3px), transparent calc(4cqw - 3px) 4cqw); }

    .lamp .face { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 0 8%; border: var(--lw) solid var(--line); border-radius: var(--lamp-radius); }
    .lamp.round .face { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); border-radius: 50%; padding: 0 16%; }
    .lamp .fit { --fh: 52; --fw: 130; font-weight: var(--weight-value); letter-spacing: var(--tracking); }
    .lamp.round .fit { font-size: min(calc(40 * 1cqmin), calc(95cqmin / var(--n))); }
    .s-unknown .face { background: transparent; color: var(--faint); border-style: dashed; }
    .s-off .face { background: var(--lamp-off-bg); color: var(--lamp-off-fg); }
    .s-nominal .face { background: var(--lamp-nominal-bg); color: var(--lamp-nominal-fg); }
    [data-base="rsi"] .s-nominal .face { border-color: color-mix(in srgb, var(--lamp-nominal-fg) 60%, transparent); }
    .s-on .face { background: var(--lamp-on-bg); color: var(--lamp-on-fg); border-color: var(--lamp-on-fg); }
    .s-minor .face, .s-minor-flash .face { background: var(--lamp-minor-bg); color: var(--lamp-minor-fg); border-color: var(--lamp-minor-fg); }
    .s-major .face, .s-major-flash .face { background: var(--lamp-major-bg); color: var(--lamp-major-fg); border-color: var(--lamp-major-fg); }
    .s-minor-flash .face, .s-major-flash .face { animation: flash 1s steps(1, end) infinite; }
    @keyframes flash { 50% { background: var(--lamp-off-bg); color: var(--lamp-off-fg); border-color: var(--line); } }

    .button { gap: 5cqh; padding: 6cqh 6cqw; }
    .button .lbl { --fh: 15; }
    .button .val { --fh: 28; }
    .button .ind { width: 46%; height: max(3px, 5cqh); background: var(--lamp-off-bg); border: var(--lw) solid var(--line); }
    .button.lit .ind { background: var(--select); border-color: var(--select); }
    .button.round { border: 0; background: none; }
    .button.round .disc { width: min(96cqw, 96cqh); height: min(96cqw, 96cqh); border-radius: 50%; background: var(--panel); border: var(--lw) solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqmin; padding: 10cqmin; }
    .button.round .lbl, .button.round .val { font-size: min(calc(16 * 1cqmin), calc(70cqmin / var(--n))); }
    .button.confirm { border-color: var(--bad); }
    .button.round.confirm .disc { border-color: var(--bad); }
    .tag { color: var(--bad); }

    .mode { flex-direction: row; gap: 4cqmin; padding: 4cqmin; }
    @container (aspect-ratio < 1) { .mode { flex-direction: column; } }
    .mode .lbl { position: absolute; top: 2cqh; left: 0; right: 0; --fh: 12; display: none; }
    .seg { flex: 1 1 0; align-self: stretch; display: flex; align-items: center; justify-content: center; border: var(--lw) solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--dim); container-type: size; padding: 0 6cqw; min-width: 0; min-height: 0; }
    .seg .fit { --fh: 46; --fw: 120; font-weight: var(--weight-value); letter-spacing: var(--tracking); }
    .seg.on { background: var(--select); border-color: var(--select); color: var(--select-fg); }

    .strip { flex-direction: row; justify-content: flex-start; gap: 2cqw; padding: 0 1.5cqw; border-bottom: var(--edge) solid var(--accent); }
    /* Drake: the ship name is the page title, in a filled bar between chevrons. */
    [data-base="drake"] .strip { border-bottom-style: dashed; }
    [data-base="drake"] .strip::before { content: var(--chev-l); color: var(--accent); font-size: 46cqh; font-weight: var(--weight-value); }
    [data-base="drake"] .strip .ship { background: var(--title-bg); color: var(--title-fg); padding: 0 .6em; line-height: 1.25; }
    .strip .ship { --fh: 54; --fw: 70; font-weight: var(--weight-value); letter-spacing: var(--tracking); text-transform: uppercase; flex: 0 1 auto; min-width: 0; }
    .strip .spacer { flex: 1 1 auto; }
    .strip .run { --fh: 40; --fw: 40; color: var(--warn); flex: 0 1 auto; min-width: 0; }
    .pill { flex: 0 0 auto; display: flex; align-items: center; height: 64cqh; padding: 0 1.4em; border-radius: 999px; background: var(--off); color: var(--fg); font-weight: var(--weight-value); font-size: min(30cqh, 2.2cqw); letter-spacing: var(--tracking); text-transform: uppercase; white-space: nowrap; }
    .pill.live { background: var(--ok); color: var(--bg); } .pill.waiting { background: var(--warn); color: var(--bg); }
    .pill.rec { background: var(--bad); color: var(--bg); padding: 0 .8em; }
    [data-base="drake"] .pill { border-radius: 0; background: transparent; border: var(--lw) solid currentColor; color: var(--off); }
    [data-base="drake"] .pill.live { color: var(--ok); } [data-base="drake"] .pill.waiting { color: var(--warn); }
    [data-base="drake"] .pill.rec { background: transparent; color: var(--bad); }

    .missing { color: var(--bad); }

    /* Drawn widgets: the SVG keeps its own aspect inside the box and centres. */
    .drawn { gap: 3cqh; padding: 5cqh 5cqw; }
    .drawn .lbl { --fh: 11; }
    .drawn .val { --fh: 13; }
    .lever .val, .sw .val { --fh: 9; }
    .drawn > svg { flex: 1 1 0; min-height: 0; width: 100%; overflow: visible; }
    svg text { font-family: var(--font); font-weight: var(--weight-label); letter-spacing: .04em; }
    .plate { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; rx: var(--plate-r); }
    .screw { fill: var(--bg); stroke: var(--faint); }
    .mark { fill: var(--dim); font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
    .slot { fill: var(--bg); stroke: var(--faint); }
    .mark.lit { fill: var(--fg); }

    /* Light switch: the bat flips about its nut. */
    .sw .bat { transform-box: view-box; transform-origin: 30px 52px; }
    .sw .s-off-bat { transform: scaleY(-1); }
    .sw .bat.from-on, .sw .bat.from-off, .sw .bat.from-unknown { animation: .22s ease-out both bat-flip; }
    .sw .bat.from-on { --from: 1; } .sw .bat.from-off, .sw .bat.from-unknown { --from: -1; }
    @keyframes bat-flip { from { transform: scaleY(var(--from)); } }
    .sw .nut { fill: color-mix(in srgb, var(--dim) 75%, var(--bg)); stroke: var(--faint); stroke-width: 1.5; }
    .sw .tip { fill: color-mix(in srgb, var(--fg) 80%, var(--dim)); stroke: var(--faint); stroke-width: 1.5; }
    .sw.s-unknown .nut { fill: none; stroke: var(--faint); stroke-dasharray: 4 3; }

    /* Gear lever: the wheel knob slides along the slot; it glows while the gear is moving. */
    .lever .handle { transform-box: view-box; }
    .lever .handle.at-down { transform: translateY(84px); }
    .lever .handle.at-mid { transform: translateY(42px); }
    .lever .handle.from-up { animation: .5s cubic-bezier(.3, 0, .2, 1) both lever-from-up; }
    .lever .handle.from-down { animation: .5s cubic-bezier(.3, 0, .2, 1) both lever-from-down; }
    .lever .handle.from-mid { animation: .5s cubic-bezier(.3, 0, .2, 1) both lever-from-mid; }
    @keyframes lever-from-up { from { transform: translateY(0); } }
    @keyframes lever-from-down { from { transform: translateY(84px); } }
    @keyframes lever-from-mid { from { transform: translateY(42px); } }
    .lever .tire { fill: var(--panel-2); stroke: color-mix(in srgb, var(--fg) 75%, var(--dim)); stroke-width: 4; }
    .lever .hub { fill: var(--dim); }
    .lever .arm { fill: var(--dim); stroke: var(--faint); }
    .lever .moving .tire { fill: var(--lamp-minor-bg); stroke: var(--warn); animation: knob-glow 1s steps(1, end) infinite; }
    .lever .moving .hub { fill: var(--warn); }
    @keyframes knob-glow { 50% { stroke: var(--lamp-minor-fg); fill: color-mix(in srgb, var(--lamp-minor-bg) 60%, var(--bg)); } }
    .lever .s-unknown-knob .tire, .lever .s-unknown-knob .hub, .lever .s-unknown-knob .arm { fill: none; stroke: var(--faint); stroke-dasharray: 4 3; }
    .lever .stripe { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 5; opacity: .5; }

    /* Push button: a cap in a housing, with a ring that lights while the sequence runs. */
    .push .housing { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; }
    .push .collar { fill: var(--bg); stroke: var(--faint); stroke-width: 1.5; }
    .push .ring { fill: none; stroke: var(--lamp-off-fg); stroke-width: 4; }
    .push.lit .ring { stroke: var(--warn); }
    .push.done .ring { stroke: var(--ok); }
    .push.failed .ring { stroke: var(--bad); }
    .push .cap { fill: color-mix(in srgb, var(--panel-2) 60%, var(--dim)); stroke: var(--dim); stroke-width: 2; transform-box: fill-box; transform-origin: center; transition: transform .08s; }
    .push .cap-hi { fill: none; stroke: var(--faint); stroke-width: 2; pointer-events: none; }
    .push .housing, .push .cap { rx: var(--plate-r); }
    .push:active .cap { transform: scale(.93); }
    .editing .push:active .cap { transform: none; }

    /* Shields: faces around a plain outline; faces are numbered until the game says which is which. */
    .shields { padding: 3cqmin; }
    .shields > svg { width: 100%; height: 100%; }
    .hull { fill: var(--panel-2); stroke: var(--dim); stroke-width: 1.5; stroke-linejoin: round; }
    .track { fill: none; stroke: var(--lamp-off-bg); stroke-width: 10; }
    .track.none { stroke: var(--faint); stroke-width: 2; stroke-dasharray: 5 4; }
    .face-arc { fill: none; stroke-width: 10; stroke: var(--bar); }
    .face-arc.t-warn { stroke: var(--warn); } .face-arc.t-bad { stroke: var(--bad); }
    .face-pct { fill: var(--value); font-size: 17px; font-weight: var(--weight-value); dominant-baseline: middle; }
    .face-pct.t-unknown { fill: var(--faint); }
    .face-num { fill: var(--dim); font-size: 10px; text-anchor: middle; dominant-baseline: middle; }
    .face-badge { fill: var(--bg); stroke: var(--line); }
    .tot-lbl { fill: var(--dim); font-size: 11px; letter-spacing: .1em; }
    .tot-val { fill: var(--value); font-size: 22px; font-weight: var(--weight-value); }
    .tot-val.t-unknown { fill: var(--faint); }

    /* Fuel: tall segmented bars, as on the Self Status page. */
    .fuel { padding: 4cqmin; }
    .fuel > svg { width: 100%; height: 100%; }
    .fuel .frame { fill: var(--lamp-off-bg); stroke: var(--line); stroke-width: 1.5; }
    .fuel .frame.none { fill: none; stroke: var(--faint); stroke-dasharray: 4 3; }
    svg .seg-on { fill: var(--bar); } svg .t-warn > .seg-on { fill: var(--warn); } svg .t-bad > .seg-on { fill: var(--bad); }
    svg .seg-off { fill: color-mix(in srgb, var(--line) 45%, var(--lamp-off-bg)); }
    .fuel .tick { stroke: var(--faint); stroke-width: 1; }
    .fuel .tick-lbl { fill: var(--dim); font-size: 8px; dominant-baseline: middle; }
    .fuel .f-val { fill: var(--value); font-size: 17px; font-weight: var(--weight-value); text-anchor: middle; }
    .fuel .f-val.t-unknown { fill: var(--faint); }
    .fuel .f-lbl { fill: var(--dim); font-size: 10px; letter-spacing: .1em; text-anchor: middle; }

    /* Lists (power, weapons, configuration) fill their box; their text scales with its height. */
    .list { align-items: stretch; justify-content: flex-start; padding: 3cqh 3cqw; gap: 2cqh; text-align: left; }
    .list .fit { font-size: inherit; }
    .list .grow { flex: 1 1 auto; min-width: 0; }
    .lock { width: .8em; height: .8em; flex: 0 0 auto; fill: none; stroke: var(--faint); stroke-width: 2.5; }
    .pwr-icon { width: 1em; height: 1em; flex: 0 0 auto; fill: none; stroke-width: 2.6; stroke-linecap: round; }

    .power .cols { flex: 1 1 0; min-height: 0; display: flex; gap: 1.2cqw; }
    .power .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2cqh; font-size: min(7cqh, calc(100cqw / var(--cols) / 3.6)); }
    .power .cbar { flex: 1 1 0; width: 64%; min-height: 0; border: var(--lw) solid var(--line); background: var(--lamp-off-bg); }
    .power .s-on .cbar { background: var(--bar); border-color: var(--dim); }
    [data-bars="segmented"] .power .s-on .cbar { background: repeating-linear-gradient(to top, var(--bar) 0 calc(12.5% - 3px), var(--lamp-off-bg) calc(12.5% - 3px) 12.5%); }
    .power .s-off .cbar { border-color: var(--bad); background: repeating-linear-gradient(135deg, var(--lamp-major-bg) 0 6px, var(--lamp-off-bg) 6px 12px); }
    .power .s-unknown .cbar { border-style: dashed; border-color: var(--faint); background: none; }
    .power .cl { font-weight: var(--weight-label); color: var(--dim); letter-spacing: var(--tracking); text-align: center; flex: 0 0 auto; }
    .power .cv { flex: 0 0 2.4em; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; font-weight: var(--weight-value); border: var(--lw) solid transparent; border-radius: var(--radius); }
    .power .cv .lock { width: .7em; height: .7em; margin-top: .15em; }
    .power .press .cv { border-color: var(--line); background: var(--panel-2); }
    .power .press:hover .cv { border-color: var(--accent); }
    .power .s-on .cv { color: var(--value); } .power .s-off .cv { color: var(--bad); } .power .s-unknown .cv { color: var(--faint); }
    .power .note { flex: 0 0 auto; color: var(--dim); font-size: min(6cqh, 2.6cqw); text-align: center; }

    .weapons { font-size: min(calc(70cqh / (var(--rows) + 3)), 5cqw); gap: 0; }
    .weapons .whead { display: flex; align-items: baseline; gap: .6em; padding-bottom: .25em; border-bottom: var(--lw) var(--rule) var(--line); }
    .weapons .preset { font-size: 1.25em; font-weight: var(--weight-value); text-transform: uppercase; letter-spacing: var(--tracking); }
    .weapons .cols-h, .weapons .wrow { display: grid; grid-template-columns: .3em minmax(0, 1fr) 2.2em 2.2em; align-items: center; gap: .5em; }
    .weapons .cols-h { color: var(--dim); letter-spacing: .1em; padding-top: .3em; }
    .weapons .cols-h span { font-size: .7em; }
    .weapons .cols-h span:nth-child(n+3) { text-align: center; }
    .weapons .wrows { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    .weapons .wrow { flex: 1 1 0; min-height: 0; max-height: 2.2em; border-bottom: var(--lw) dashed var(--line); }
    .weapons .wrow > .edge { align-self: stretch; margin: .25em 0; background: var(--fg); }
    [data-base="drake"] .weapons .wrow > .edge { background: none; }
    .weapons .wname { font-weight: var(--weight-value); text-transform: uppercase; letter-spacing: var(--tracking); }
    .weapons .cell { display: flex; justify-content: center; }
    .pwr-icon.on { stroke: var(--value); } .pwr-icon.off { stroke: var(--off); } .pwr-icon.unknown { stroke: var(--faint); stroke-dasharray: 3 3; }
    .rdy { width: .9em; height: .9em; border: 2px solid var(--off); border-radius: var(--radius); }
    .rdy.on { background: var(--accent); border-color: var(--accent); } .rdy.unknown { border-style: dashed; border-color: var(--faint); }
    .weapons .more, .weapons .none { color: var(--dim); font-size: .8em; padding: .3em 0; }
    .weapons .wcm { display: flex; gap: 1.2em; padding-top: .3em; border-top: var(--lw) var(--rule) var(--line); }
    .weapons .wcm b { font-weight: var(--weight-value); margin-left: .3em; color: var(--value); }
    .weapons .wcm span { color: var(--dim); letter-spacing: .08em; }

    .config .clist { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; --r: var(--rn); font-size: calc(58cqh / var(--r)); }
    @container (aspect-ratio > 1.15) { .config .clist { flex-direction: row; gap: 4cqw; --r: var(--rw); } }
    .config .ccol { display: flex; flex-direction: column; flex: var(--k) 1 0; min-height: 0; min-width: 0; }
    @container (aspect-ratio > 1.15) { .config .ccol { flex: 1 1 0; } .config .ccol > .cgrp, .config .ccol > .crow { flex: 0 0 calc(100% / var(--rw)); } }
    .config .cgrp, .config .crow { flex: 1 1 0; min-height: 0; display: flex; align-items: center; gap: .5em; }
    .config .cgrp { color: var(--accent); font-weight: var(--weight-label); letter-spacing: .12em; font-size: .8em; text-transform: uppercase; border-bottom: var(--lw) var(--rule) var(--line); }
    .config .cgrp::before { content: var(--title-pre); }
    .config .crow { padding: 0 .3em; border: var(--lw) solid transparent; border-radius: var(--radius); }
    .config .crow.press:hover { border-color: var(--accent); }
    .config .crow.press .box { box-shadow: 0 0 0 1px var(--dim); }
    .config .box { width: .9em; height: .9em; flex: 0 0 auto; border: 2px solid var(--off); border-radius: var(--radius); }
    .config .s-on .box { background: var(--select); border-color: var(--select); }
    .config .s-unknown .box { border-style: dashed; border-color: var(--faint); }
    .config .s-unknown .cl { color: var(--faint); }

    #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--dim); font-size: 15px; padding: 16px; text-align: center; }

    /* ------------------------------------------------------------ dialog and notice */
    dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-top: var(--edge) solid var(--accent); border-radius: var(--radius); padding: 16px 18px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
    dialog::backdrop { background: color-mix(in srgb, var(--bg) 70%, transparent); }
    dialog h3 { margin: 0 0 10px; font: var(--weight-value) 16px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; }
    dialog .body p { margin: 0 0 8px; }
    dialog ul { margin: 0 0 8px; padding-left: 18px; color: var(--dim); max-height: 40vh; overflow-y: auto; }
    dialog .warn { color: var(--warn); }
    dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    #notice { position: fixed; right: 16px; bottom: 16px; padding: 10px 14px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); display: none; max-width: min(420px, calc(100vw - 32px)); z-index: 10; }
    #notice.bad { border-color: var(--bad); } #notice.ok { border-color: var(--ok); }

    /* ------------------------------------------------------------ detach, kiosk and bezel */
    #pane #props { flex: 0 0 auto; overflow-y: auto; max-height: 62%; }
    #pane h2.sub { margin-top: 14px; }
    #pane ul.maps { margin: 4px 0 6px; padding: 0; list-style: none; color: var(--fg); }
    #pane ul.maps li { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px dashed var(--line); min-width: 0; }
    #pane ul.maps b { flex: 0 0 auto; color: var(--accent); font-weight: 600; min-width: 2.4em; }
    #pane ul.maps span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .screens { display: grid; gap: 6px; margin: 8px 0; }
    .screen { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); cursor: pointer; }
    .screen:has(input:checked) { border-color: var(--select); }
    .screen input { grid-row: span 2; }
    .screen b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .screen small { color: var(--dim); grid-column: 2; }
    dialog label.check { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    dialog .list { list-style: none; padding: 0; color: var(--fg); }
    dialog .list li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
    dialog .list small { color: var(--dim); text-align: right; }
    dialog .list .bad { color: var(--warn); }

    body.kiosk.idle, body.kiosk.idle * { cursor: none !important; }
    .overlay { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-top: var(--edge) solid var(--accent); border-radius: var(--radius); padding: 14px 16px; }
    .overlay[hidden] { display: none; }
    .overlay h3 { margin: 0 0 10px; font: var(--weight-value) 15px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; }
    .overlay .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .overlay .note { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
    #kiosk-menu { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); }
    #kiosk-menu .row { flex-direction: column; }
    #fs-prompt { inset: 0; border: 0; border-radius: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font: 600 22px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; text-align: center; padding: 16px; }
    #fs-prompt[hidden] { display: none; }
    #fs-prompt small { font: 13px var(--font-ui); color: var(--dim); text-transform: none; letter-spacing: 0; }
    #exit-hint { position: fixed; left: 8px; top: 8px; z-index: 21; width: 120px; height: 4px; background: var(--lamp-off-bg); display: none; }
    #exit-hint i { display: block; height: 100%; background: var(--accent); width: 0; }
    #hold-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 21; width: min(360px, calc(100vw - 32px)); padding: 8px 12px; background: var(--panel); border: 1px solid var(--bad); border-radius: var(--radius); font: 600 13px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; }
    #hold-bar[hidden] { display: none; }
    #hold-bar .meter { margin-top: 6px; height: 6px; }
    #hold-bar .meter > i { background: var(--bad); }

    #bezel-panel { right: 16px; top: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); display: flex; flex-direction: column; min-height: 0; }
    #bezel-panel[hidden] { display: none; }
    body:not(.kiosk) #bezel-panel { top: var(--bar-h); right: 0; bottom: 0; border-radius: 0; }
    #bezel-panel .pad { color: var(--dim); margin: 0 0 8px; overflow-wrap: anywhere; }
    #bezel-panel .pad b { color: var(--fg); font-weight: 600; }
    #bezel-panel .learn { border: 1px solid var(--select); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; background: var(--panel-2); }
    #bezel-panel .learn.wait { border-style: dashed; border-color: var(--line); color: var(--dim); text-align: center; padding: 14px 10px; }
    #bezel-panel .learn label { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 6px; color: var(--dim); }
    #bezel-panel .learn select, #bezel-panel .learn input { width: 100%; min-width: 0; padding: 4px 6px; }
    #bezel-panel .learn .big { color: var(--accent); font: 600 15px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; }
    #bezel-panel .maps { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; gap: 2px; align-content: start; }
    #bezel-panel .map { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid transparent; border-radius: var(--radius); }
    #bezel-panel .map.on { border-color: var(--select); background: var(--panel-2); }
    #bezel-panel .map b { color: var(--accent); font-weight: 600; }
    #bezel-panel .map .what { min-width: 0; display: flex; flex-direction: column; }
    #bezel-panel .map .what span { overflow-wrap: anywhere; }
    #bezel-panel .map .what small { color: var(--dim); overflow-wrap: anywhere; }
    #bezel-panel .map .acts { display: flex; gap: 4px; }
    #bezel-panel .map .btn { padding: 2px 8px; }
    #bezel-panel .empty { color: var(--dim); padding: 8px 0; }

    #theme-panel { right: 16px; top: 16px; bottom: 16px; width: min(600px, calc(100vw - 32px)); display: flex; flex-direction: column; min-height: 0; gap: 6px; }
    #theme-panel[hidden] { display: none; }
    body:not(.kiosk) #theme-panel { top: var(--bar-h); right: 0; bottom: 0; border-radius: 0; }
    /* While the editor is open the stage makes room for it, so the whole tab shows the theme. */
    body.theming #pane { display: none; }
    body.theming:not(.kiosk) #stage { margin-right: min(600px, calc(100vw - 32px)); }
    #theme-panel h3 { margin-bottom: 4px; }
    #theme-panel .note { margin: 0; }
    #theme-panel .tlist { flex: 0 1 auto; max-height: 30%; overflow-y: auto; display: grid; gap: 2px; min-height: 0; }
    #theme-panel .trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid transparent; border-radius: var(--radius); cursor: pointer; }
    #theme-panel .trow:hover { border-color: var(--line); }
    #theme-panel .trow.on { border-color: var(--select); background: var(--panel-2); }
    #theme-panel .trow .what { min-width: 0; display: flex; flex-direction: column; }
    #theme-panel .trow b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #theme-panel .trow small { color: var(--dim); overflow-wrap: anywhere; }
    #theme-panel .acts { display: flex; gap: 4px; }
    #theme-panel .acts .btn { padding: 2px 8px; }
    #theme-panel .ted { flex: 1 1 auto; min-height: 0; overflow-y: auto; border-top: var(--lw) var(--rule) var(--line); padding-top: 8px; }
    #theme-panel .ted > label { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 6px; color: var(--dim); }
    #theme-panel .ted > label span { color: var(--fg); display: flex; gap: 8px; align-items: center; }
    #theme-panel input:not([type=checkbox]):not([type=color]), #theme-panel select { width: 100%; min-width: 0; padding: 4px 6px; }
    #theme-panel .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin: 8px 0; }
    #theme-panel .col { display: grid; grid-template-columns: minmax(0, 1fr) 30px 86px; gap: 6px; align-items: center; color: var(--dim); }
    #theme-panel .col span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #theme-panel input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
    #theme-panel input.hex { font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
    #theme-panel input.hex.bad { border-color: var(--bad); outline-color: var(--bad); color: var(--bad); }
    #theme-panel .row { display: flex; gap: 6px; flex-wrap: wrap; }
    #theme-panel .row.end { justify-content: flex-end; }

    /* ------------------------------------------------------------ greyed controls and the dashboard picker */
    /* A control for a function the ship lacks: dimmed and hatched, still there and still clickable. */
    .gwrap { position: absolute; inset: 0; }
    .gwrap > .w { opacity: .38; filter: grayscale(1); }
    .gwrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--faint) 35%, transparent) 7px 9px); }
    .gwrap .gmark { position: absolute; right: 3px; top: 3px; z-index: 2; padding: 1px 5px; max-width: calc(100% - 6px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
      font: 700 min(11px, 24cqh) var(--font); letter-spacing: var(--tracking); color: var(--fg); background: var(--panel); border: 1px dashed var(--dim); border-radius: var(--radius); }
    .gwrap .gtip { display: none; position: absolute; left: 4px; right: 4px; bottom: 4px; z-index: 3; padding: 4px 6px; pointer-events: none; text-align: left;
      font: 12px/1.3 var(--font-ui); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); }
    .gwrap:hover .gtip { display: block; }
    /* A box too small for the mark keeps the hatching and the tooltip. */
    @container (max-height: 34px) { .gwrap .gmark { display: none; } }
    @container (max-width: 150px) { .gwrap.g-absent .gmark { display: none; } }
    .ghide { visibility: hidden; }
    .config .crow.greyed { opacity: .42; }
    .config .crow.greyed .cl { text-decoration: line-through; text-decoration-color: var(--dim); }
    .btn.board { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    #dash-panel { top: calc(var(--bar-h) + 8px); right: 8px; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - var(--bar-h) - 16px); overflow-y: auto; font-family: var(--font-ui); }
    #dash-panel section { border-top: var(--lw) var(--rule) var(--line); padding: 8px 0 6px; }
    #dash-panel h4 { margin: 0 0 6px; font: var(--weight-label) 12px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
    #dash-panel h4::before { content: var(--title-pre); }
    #dash-panel .ship { margin: 0 0 6px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    #dash-panel .ship b { font: var(--weight-value) 15px var(--font); letter-spacing: var(--tracking); }
    #dash-panel .ship small, #dash-panel .drow small { color: var(--dim); }
    #dash-panel .make { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #dash-panel .make label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
    #dash-panel .dlist { display: grid; gap: 4px; }
    #dash-panel .drow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); }
    #dash-panel .drow.on { border-color: var(--select); background: var(--panel-2); }
    #dash-panel .drow .what { display: grid; min-width: 0; flex: 1 1 auto; gap: 2px; }
    #dash-panel .drow .what b, #dash-panel .drow .what small { overflow-wrap: anywhere; }
    #dash-panel .drow input { width: 100%; }
    #dash-panel .acts { display: flex; gap: 4px; flex: 0 0 auto; align-items: center; }
    #dash-panel .acts .btn { padding: 2px 8px; }
    #dash-panel .here { color: var(--select); font-size: 12px; padding: 0 6px; white-space: nowrap; }
    #dash-panel label.check { display: flex; gap: 8px; align-items: center; }
    #dash-panel .warn, .cwarn { color: var(--warn); }
    .cwarn ul { margin: 2px 0 6px; padding-left: 18px; }
    .cwarn:empty { display: none; }
    #dash-panel .row.end { justify-content: flex-end; }

    /* ------------------------------------------------------------ fleet panel (Rust service only, draft) */
    body { --fleet-w: 380px; }
    @media (max-width: 1280px) { body { --fleet-w: 320px; } }
    #fleet { flex: 0 0 var(--fleet-w); width: var(--fleet-w); display: none; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); font-family: var(--font); }
    body.fleet-on:not(.editing):not(.theming) #fleet { display: flex; }
    .demo-flag { flex: 0 0 auto; align-self: center; padding: 3px 8px; border: 1px solid var(--warn); border-radius: var(--radius); background: var(--lamp-minor-bg); color: var(--lamp-minor-fg); font: 700 11px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; white-space: nowrap; }
    .btn.on { border-color: var(--select); color: var(--select); }
    #fleet .fhead { flex: 0 0 auto; padding: 8px 10px; border-bottom: var(--lw) var(--rule) var(--line); display: grid; gap: 6px; }
    #fleet .ftitle { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    #fleet .ftitle h2 { margin: 0; font: var(--weight-value) 15px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; color: var(--fg); white-space: nowrap; }
    #fleet .ftitle h2::before { content: var(--title-pre); }
    #fleet .froll { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
    #fleet .ftitle .x { margin-left: auto; padding: 0 8px; }
    #fleet .demo-flag { align-self: stretch; text-align: center; }
    #fleet .ftools { display: flex; gap: 4px; flex-wrap: wrap; }
    #fleet .ftools .btn { padding: 3px 8px; font-size: 12px; }
    #fleet .fbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    #fleet .fempty { color: var(--dim); padding: 12px 10px; }
    .fgroup { border-bottom: var(--lw) var(--rule) var(--line); }
    .fgroup.drop { outline: 2px dashed var(--select); outline-offset: -2px; }
    .fgroup-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 6px; align-items: center; padding: 6px 8px; background: var(--panel-2); }
    .fgroup-h .chev { background: none; border: 0; padding: 0 4px; cursor: pointer; color: var(--dim); width: 20px; }
    .fgroup-h .name { font-weight: var(--weight-label); letter-spacing: var(--tracking); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fgroup-h .name::before { content: var(--title-pre); color: var(--dim); }
    .fgroup-h .acts { display: flex; gap: 2px; }
    .fgroup-h .acts .btn { padding: 0 6px; font-size: 12px; line-height: 18px; }
    .fgroup-h .roll { grid-column: 2 / 4; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fgroup-h .roll b { color: var(--bad); font-weight: 600; }
    .fcards { display: grid; gap: 6px; padding: 6px 8px 8px; }
    .fcards .hint { color: var(--faint); font-size: 12px; padding: 4px 2px; }
    .fcard { border: 1px solid var(--line); border-left: 4px solid var(--st); border-radius: var(--radius); background: var(--bg); padding: 6px 8px; cursor: pointer; display: grid; gap: 3px; min-width: 0; }
    .fcard:hover { border-color: var(--accent); border-left-color: var(--st); }
    .fcard.dragging { opacity: .4; }
    .fcard.sel, .arow.sel { outline: 2px solid var(--select); outline-offset: -1px; background: var(--panel-2); }
    [data-st] { --st: var(--ok); }
    [data-st="DOWNED"] { --st: var(--bad); } [data-st="DEAD"] { --st: var(--lamp-major-fg); } [data-st="RESPAWNED"] { --st: var(--warn); }
    [data-st="OFFLINE"] { --st: var(--off); } [data-st="UNKNOWN"] { --st: var(--dim); }
    .fcard[data-st="OFFLINE"] { opacity: .55; filter: grayscale(1); }
    .fcard[data-st="DOWNED"], .arow[data-st="DOWNED"] { animation: fdown 1s steps(1) infinite; }
    @keyframes fdown { 50% { background: color-mix(in srgb, var(--bad) 22%, var(--bg)); } }
    .frow { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .frow .who { font-weight: var(--weight-value); letter-spacing: .02em; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .frow .sub { color: var(--dim); font-size: 12px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .frow .tag { color: var(--dim); font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
    .chip { flex: 0 0 auto; padding: 1px 6px; border: 1px solid var(--line); border-radius: var(--lamp-radius); font: 700 11px var(--font); letter-spacing: var(--tracking); text-transform: uppercase; white-space: nowrap; background: var(--lamp-nominal-bg); color: var(--lamp-nominal-fg); }
    .chip[data-st="UP"] { background: var(--lamp-on-bg); color: var(--lamp-on-fg); border-color: var(--lamp-on-fg); }
    .chip[data-st="DOWNED"] { background: var(--lamp-major-bg); color: var(--lamp-major-fg); border-color: var(--lamp-major-fg); }
    .chip[data-st="DEAD"] { background: var(--lamp-off-bg); color: var(--lamp-major-fg); border-color: var(--lamp-major-fg); border-style: dashed; }
    .chip[data-st="RESPAWNED"] { background: var(--lamp-minor-bg); color: var(--lamp-minor-fg); border-color: var(--lamp-minor-fg); }
    .chip[data-st="OFFLINE"] { background: var(--lamp-off-bg); color: var(--lamp-off-fg); }
    .fbars { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 2.9em 3.2em minmax(0, 1fr) 2.9em; gap: 2px 5px; align-items: center; font-size: 12px; }
    .fbars .l { color: var(--dim); text-transform: uppercase; letter-spacing: var(--tracking); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fbars .v { text-align: right; font-weight: var(--weight-value); white-space: nowrap; }
    .fbar { height: 7px; background: var(--lamp-off-bg); border: var(--lw) solid var(--line); display: flex; --c: var(--bar); }
    .fbar.t-warn { --c: var(--warn); } .fbar.t-bad { --c: var(--bad); } .fbar.t-unknown { border-style: dashed; }
    .fbar > i { display: block; height: 100%; background: var(--c); }
    [data-bars="segmented"] .fbar > i { background: repeating-linear-gradient(to right, var(--c) 0 5px, transparent 5px 7px); }
    .ffacts { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; }
    .ffacts span { white-space: nowrap; } .ffacts small { color: var(--dim); text-transform: uppercase; letter-spacing: var(--tracking); font-size: 11px; margin-right: 4px; }
    .fage { color: var(--faint); font-size: 11px; text-align: right; }
    .fcard[data-st="OFFLINE"] .fage { color: var(--off); }
    /* Admiral view: one compact row per member, by state across groups. */
    .alist { display: grid; gap: 4px; padding: 8px; }
    .arow { display: grid; grid-template-columns: 7.6em minmax(0, 1fr) 4.4em 3.4em; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-left: 4px solid var(--st); border-radius: var(--radius); background: var(--bg); cursor: pointer; font-size: 13px; min-width: 0; }
    .arow .chip { font-size: 12px; padding: 2px 6px; }
    .arow .chip { text-align: center; }
    .arow .who { min-width: 0; display: flex; flex-direction: column; }
    .arow .who b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arow .who small { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arow .hp { display: grid; gap: 2px; text-align: right; }
    .arow .age { color: var(--faint); text-align: right; white-space: nowrap; font-size: 12px; }
    .arow[data-st="OFFLINE"] { opacity: .55; }
    .ahead { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 8px 0; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: var(--tracking); }
    .ahead b { color: var(--fg); }
    /* The detail view and the card fields, beside the panel. */
    #fleet-detail, #fleet-fields { top: calc(var(--bar-h) + 8px); right: calc(var(--fleet-w) + 8px); width: min(460px, calc(100vw - var(--fleet-w) - 32px)); max-height: calc(100vh - var(--bar-h) - 16px); overflow-y: auto; font-family: var(--font); }
    #fleet-detail .dhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #fleet-detail .dhead h3 { margin: 0; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #fleet-detail section { border-top: var(--lw) var(--rule) var(--line); padding: 8px 0 4px; }
    #fleet-detail h4, #fleet-fields h4 { margin: 0 0 6px; font: var(--weight-label) 12px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
    #fleet-detail h4::before, #fleet-fields h4::before { content: var(--title-pre); }
    #fleet-detail .fbars { font-size: 13px; grid-template-columns: 7.5em minmax(0, 1fr) 3.4em; gap: 4px 8px; }
    #fleet-detail .fbar { height: 9px; }
    #fleet-detail .kv { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 3px 8px; font-size: 13px; }
    #fleet-detail .kv span:nth-child(odd) { color: var(--dim); text-transform: uppercase; letter-spacing: var(--tracking); font-size: 12px; }
    #fleet-detail .lamps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
    #fleet-detail .lamps span { padding: 3px 4px; text-align: center; border: 1px solid var(--line); border-radius: var(--lamp-radius); font-size: 11px; letter-spacing: var(--tracking); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #fleet-detail .lamps .t-ok { background: var(--lamp-on-bg); color: var(--lamp-on-fg); }
    #fleet-detail .lamps .t-off { background: var(--lamp-off-bg); color: var(--lamp-off-fg); }
    #fleet-detail .note, #fleet-fields .note { color: var(--dim); font-size: 12px; margin: 4px 0; }
    #fleet-detail label, #fleet-fields label { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    #fleet-detail select { padding: 3px 6px; min-width: 0; flex: 1 1 auto; }
    #fleet-fields .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

    @media (max-width: 700px) {
      body { --pane-w: 100%; --bar-h: 40px; }
      .editing #stage { display: none; }
    }
  </style>
</head>
<body data-theme="rsi" data-base="rsi" data-font="condensed" data-bars="segmented" data-zeros="dim">
  <div id="app">
    <header id="bar">
      <nav id="tabs"></nav>
      <div class="tools" id="tools"></div>
    </header>
    <div id="body">
      <main id="stage"><div id="empty"></div></main>
      <aside id="fleet" aria-label="Fleet"></aside>
      <aside id="pane">
        <section id="props" data-accept="[data-do=save]"></section>
        <section id="palette">
          <h2>Add widget</h2>
          <div class="filters">
            <input id="q" type="search" placeholder="search, e.g. speed, gear" data-accept="blur" />
            <select id="cat"></select>
          </div>
          <p id="count"></p>
          <div id="items"></div>
        </section>
      </aside>
    </div>
  </div>
  <dialog id="dlg" data-accept="#dlg-buttons .primary"><h3 id="dlg-title"></h3><div class="body" id="dlg-body"></div><div class="row" id="dlg-buttons"></div></dialog>
  <input type="file" id="file" accept=".json,application/json" hidden />
  <div id="notice"></div>
  <div id="kiosk-menu" class="overlay" hidden></div>
  <div id="fs-prompt" hidden>Tap or click once for full screen<small>F11 also works. Hold Escape for 2 s for the kiosk menu.</small></div>
  <div id="exit-hint"><i></i></div>
  <div id="hold-bar" hidden><span id="hold-text"></span><div class="meter"><i></i></div></div>
  <div id="bezel-panel" class="overlay" hidden data-accept="[data-b=save]"></div>
  <div id="theme-panel" class="overlay" hidden data-accept="[data-th-do=save]"></div>
  <div id="dash-panel" class="overlay" hidden data-accept="[data-dp=rename-ok]"></div>
  <div id="fleet-detail" class="overlay" hidden></div>
  <div id="fleet-fields" class="overlay" hidden></div>

  <script src="/vendor/gridstack/gridstack-all.js"></script>
  <script>
    const TOKEN = '__TOKEN__';
    // A little over the service's 1.5 s, which it times from hold.start, so a hold never lands just short.
    const HOLD_MS = 1550;
    const MAX_IMPORT = 512 * 1024;
    const DASH = '—';
    const PARAMS = new URLSearchParams(location.search);
    const ONLY = PARAMS.get('tab');
    // A detached tab: use mode only, no bar, the cursor hidden when idle, bezel buttons live.
    const KIOSK = Boolean(ONLY) && PARAMS.get('kiosk') === '1';
    const WANT_FS = KIOSK && PARAMS.get('fs') === '1';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const clone = (v) => JSON.parse(JSON.stringify(v));

    let ws, nextId = 1;
    const waiting = new Map();
    let dash = null, meta = null, cat = null, vals = null;
    let currentId = ONLY, editing = false, work = null, selected = null, builtFor = '';
    let grid = null;
    const seqResults = new Map();
    let themes = null, themeDraft = null;
    // Per-ship dashboards (Rust service): the one on screen, the list, and the generic dashboard while a ship's is shown.
    let board = null, boards = null, genericBoard = null, dashPanel = false, renamingBoard = null, shownProblem = false;

    // ------------------------------------------------------------ connection

    function connect() {
      ws = new WebSocket(`ws://${location.host}/portal`);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'hello', token: TOKEN, client: KIOSK ? 'dash-kiosk' : ONLY ? 'dash-tab' : 'dash' }));
        send({ type: 'dash.get' });
      };
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'values') { vals = m; drawAll(); if (dashPanel) live('dash-panel', renderDashPanel); }
        else if (m.type === 'dashboard') onDashboard(m);
        else if (m.type === 'catalog') { cat = m; live('props', renderPane); drawAll(); live('bezel-panel', renderBezelPanel); }
        else if (m.type === 'themes') onThemes(m);
        else if (m.type === 'fleet') onFleet(m);
        else if (m.type === 'notice') notice(m.text, m.tone);
        else if (m.type === 'result' && waiting.has(m.id)) { const cb = waiting.get(m.id); waiting.delete(m.id); cb(m.result, m.error); }
      };
      ws.onclose = () => { vals = null; drawAll(); if (fleet) { closeFleetDetail(); fleet = null; renderFleet(); layoutFleet(); if (dash) renderBar(); } setTimeout(connect, 2000); };
    }
    function send(msg, cb) {
      const id = nextId++;
      if (cb) waiting.set(id, cb);
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ id, ...msg }));
      return id;
    }

    let noticeTimer;
    function notice(text, tone) {
      const n = $('notice');
      n.textContent = text;
      n.className = tone || '';
      n.style.display = 'block';
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { n.style.display = 'none'; }, 5000);
    }

    /** A modal choice; `body` is HTML the caller has already escaped. */
    function ask(title, body, buttons) {
      const dlg = $('dlg');
      $('dlg-title').textContent = title;
      $('dlg-body').innerHTML = body;
      $('dlg-buttons').innerHTML = buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-choice="${i}" type="button">${esc(b.text)}</button>`).join('');
      return new Promise((resolve) => {
        $('dlg-buttons').onclick = (e) => {
          const b = e.target.closest('[data-choice]');
          if (!b) return;
          dlg.close();
          resolve(buttons[Number(b.dataset.choice)].value);
        };
        dlg.oncancel = () => resolve(undefined);
        dlg.showModal();
      });
    }

    // ------------------------------------------------------------ live updates and text fields

    // A live push never replaces a control in use: while a field or list in a panel has the focus, or a
    // pointer is down in it (a click, a drag, an open list), its redraw waits, and catches up after.
    let pointerDown = null;
    const held = new Map();
    function busy(root) {
      if (!root) return false;
      const a = document.activeElement;
      if (a && root.contains(a) && a.matches('input, select, textarea, [contenteditable]')) return true;
      return Boolean(pointerDown && root.contains(pointerDown));
    }
    /** A push's redraw of the panel with this id: now, or once nothing in it is in use. */
    function live(id, render) {
      if (busy($(id))) { held.set(id, render); return; }
      held.delete(id);
      render();
    }
    function catchUp() {
      for (const [id, render] of [...held]) {
        if (busy($(id))) continue;
        held.delete(id);
        render();
      }
    }
    document.addEventListener('pointerdown', (e) => { pointerDown = e.target; }, true);
    const released = () => { pointerDown = null; setTimeout(catchUp, 0); };
    for (const ev of ['pointerup', 'pointercancel', 'dragend']) document.addEventListener(ev, released, true);
    document.addEventListener('focusout', () => setTimeout(catchUp, 0), true);

    // One rule for every one-line field: Enter accepts what it belongs to (the nearest data-accept names
    // its button, or "blur"), Escape puts back the value it had when it got the focus, and Enter while an
    // input method is composing does nothing. A textarea keeps Enter for a new line.
    const ONE_LINE = new Set(['', 'text', 'search', 'number', 'url', 'email', 'tel', 'password']);
    const isOneLine = (el) => el instanceof HTMLInputElement && ONE_LINE.has(el.getAttribute('type') || '');
    function acceptTarget(el) {
      const scope = el.closest('[data-accept]');
      const sel = scope && scope.dataset.accept;
      if (!sel) return null;
      return sel === 'blur' ? 'blur' : scope.querySelector(sel) || document.querySelector(sel);
    }
    document.addEventListener('focusin', (e) => { if (isOneLine(e.target) || e.target instanceof HTMLTextAreaElement) e.target._was = e.target.value; }, true);
    document.addEventListener('keydown', (e) => {
      const el = e.target;
      const area = el instanceof HTMLTextAreaElement;
      if (!isOneLine(el) && !area) return;
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter' && !area) {
        e.preventDefault();
        const t = acceptTarget(el);
        if (!t) return;
        el.dispatchEvent(new Event('change', { bubbles: true }));
        if (t === 'blur') el.blur(); else if (!t.disabled) t.click();
      } else if (e.key === 'Escape') {
        // The first Escape undoes the edit; with nothing to undo it does what Escape does there.
        if (el._was === undefined || el.value === el._was) { if (!el.closest('dialog')) el.blur(); return; }
        e.preventDefault();
        e.stopPropagation();
        el.value = el._was;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }, true);

    // ------------------------------------------------------------ model helpers

    // A single-tab window may show a generic tab while a ship's dashboard is on screen.
    const serverTab = (id) => dash && (dash.tabs.find((t) => t.id === id) || (ONLY && genericBoard ? genericBoard.tabs.find((t) => t.id === id) : undefined));
    const shown = () => (editing && work ? work : serverTab(currentId));
    // Compared with keys sorted: a field set in another order than the service writes it is no change.
    const canon = (v) => JSON.stringify(v, (_k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => (a < b ? -1 : 1))) : x));
    const dirty = () => editing && work && canon(work) !== canon(serverTab(work.id));
    const valueLabel = (id) => (cat && (cat.values.find((v) => v.id === id) || {}).label) || id;
    const toggleLabel = (id) => (cat && (cat.toggles.find((t) => t.id === id) || {}).label) || id;
    const actionText = (name) => name.replace(/^v_/, '').replace(/_/g, ' ');
    const isConfirm = (name) => meta && meta.confirmGroup.includes(name);

    function onDashboard(m) {
      // Mid-drag on the edit grid a redraw would drop the widget being moved: catch up after.
      if (editing && pointerDown && $('stage').contains(pointerDown)) { held.set('stage', () => onDashboard(m)); return; }
      const prev = board;
      const prevTab = serverTab(currentId);
      dash = m.dashboard;
      board = m.board || null;
      genericBoard = m.generic || null;
      boards = m.dashboards ? { list: m.dashboards, switchOnShipChange: m.switchOnShipChange, pinned: m.pinned, fileProblem: m.fileProblem } : null;
      meta = { kinds: m.kinds, lookOnlyFor: m.lookOnlyFor, leverSize: m.leverSize, lampValues: m.lampValues, limits: m.limits, confirmGroup: m.confirmGroup, greyable: new Set(m.greyable || []) };
      const keepWork = editing && work && dirty();
      if (prev && board && prev.id !== board.id && prevTab && !keepWork) {
        // Another dashboard (a ship change or a pick): the tab of the same name, and a single-tab
        // window keeps its generic tab when the ship's dashboard has none of that name.
        const named = (list) => list && list.find((t) => t.name === prevTab.name);
        const next = named(dash.tabs) || (ONLY ? named(genericBoard && genericBoard.tabs) || serverTab(prevTab.id) : null);
        currentId = next ? next.id : currentId;
        if (ONLY && next) { const u = new URL(location.href); u.searchParams.set('tab', next.id); history.replaceState(null, '', u); }
        if (editing) work = clone(serverTab(currentId) || dash.tabs[0]);
      }
      if (!serverTab(currentId) && !keepWork) {
        if (ONLY) { currentId = null; showEmpty(`There is no tab "${ONLY}" on this dashboard.`); return; }
        currentId = dash.tabs[0].id;
        work = editing ? clone(serverTab(currentId)) : null;
      } else if (editing && !dirty()) work = clone(serverTab(currentId));
      if (m.fileProblem && !shownProblem) { shownProblem = true; notice(m.fileProblem, 'bad'); }
      live('bar', renderBar);
      live('props', renderPane);
      buildGrid();
      live('bezel-panel', renderBezelPanel);
      live('theme-panel', renderThemePanel);
      if (dashPanel) live('dash-panel', () => renderDashPanel(true));
    }

    function showEmpty(text) {
      $('empty').textContent = text;
      $('empty').style.display = 'flex';
      if (grid) grid.destroy(true);
      grid = null;
      builtFor = '';
    }

    // ------------------------------------------------------------ bar

    function renderBar() {
      if (ONLY) { $('bar').hidden = true; return; }
      const d = dirty();
      $('tabs').innerHTML = dash.tabs.map((t) => `<button class="tab ${t.id === currentId ? 'on' : ''}" data-tab="${esc(t.id)}" type="button">${esc(editing && work && t.id === work.id ? work.name : t.name)}</button>`).join('') +
        (editing && dash.tabs.length < meta.limits.tabs ? '<button class="tab add" data-add-tab type="button" title="Add a tab">+ Tab</button>' : '');
      const picker = boards && board ? `<button class="btn board ${dashPanel ? 'on' : ''}" data-do="boards" type="button" title="Dashboards: the generic one and one per ship">${esc(board.name)} &#x25BE;</button>` : '';
      $('tools').innerHTML = picker + (editing ? '' : fleetTools()) + (editing
        ? `${d ? '<span class="dirty">unsaved</span>' : ''}<button class="btn" data-do="export" type="button">Export</button><button class="btn" data-do="import" type="button">Import</button>` +
          `<button class="btn" data-do="revert" type="button" ${d ? '' : 'disabled'}>Revert</button><button class="btn primary" data-do="save" type="button" ${d ? '' : 'disabled'}>Save</button><button class="btn" data-do="done" type="button">Done</button>`
        : `${restorable().length ? '<button class="btn" data-do="restore" type="button" title="Open each tab that has a display on that display">Restore detached tabs</button>' : ''}` +
          '<button class="btn" data-do="detach" type="button" title="Open this tab in its own window on a display">Detach</button><button class="btn" data-do="edit" type="button">Edit</button>');
    }

    async function confirmLeave() {
      if (!dirty()) return true;
      const c = await ask('Unsaved changes', `<p>${esc(work.name)} has changes that are not saved.</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Discard', value: 'discard', cls: 'danger' }, { text: 'Save', value: 'save', cls: 'primary' }]);
      if (c === 'save') return save();
      return c === 'discard';
    }

    function save() {
      return new Promise((resolve) => {
        send({ type: 'dash.saveTab', tab: work }, (problems) => {
          const ok = Array.isArray(problems) && problems.length === 0;
          if (ok) notice('Tab saved', 'ok');
          resolve(ok);
        });
      });
    }

    $('tabs').addEventListener('click', async (e) => {
      const t = e.target.closest('[data-tab]');
      if (t && t.dataset.tab !== currentId) {
        if (!(await confirmLeave())) return;
        currentId = t.dataset.tab;
        selected = null;
        work = editing ? clone(serverTab(currentId)) : null;
        renderBar(); renderPane(); buildGrid();
      }
      if (e.target.closest('[data-add-tab]')) {
        if (!(await confirmLeave())) return;
        send({ type: 'dash.addTab' }, (r) => { if (r && r.tab) { currentId = r.tab.id; work = clone(r.tab); selected = null; renderBar(); renderPane(); buildGrid(); } });
      }
    });

    $('tools').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-do]');
      if (!b) return;
      const act = b.dataset.do;
      if (act === 'edit') { editing = true; work = clone(serverTab(currentId)); selected = null; }
      else if (act === 'done') { if (!(await confirmLeave())) return; editing = false; work = null; selected = null; }
      else if (act === 'revert') { work = clone(serverTab(currentId)); selected = null; }
      else if (act === 'save') { await save(); }
      else if (act === 'export') { exportFile(); return; }
      else if (act === 'import') { $('file').value = ''; $('file').click(); return; }
      else if (act === 'detach') { detach(serverTab(currentId)); return; }
      else if (act === 'restore') { restoreDetached(); return; }
      else if (act === 'boards') { if (dashPanel) closeDashPanel(); else openDashPanel(); return; }
      else if (act === 'fleet') { fleetOpen = !fleetOpen; try { localStorage.setItem(FLEET_OPEN_KEY, fleetOpen ? '1' : '0'); } catch { /* per-viewer only */ } layoutFleet(); renderBar(); return; }
      document.body.classList.toggle('editing', editing);
      renderBar(); renderPane(); buildGrid();
    });

    // ------------------------------------------------------------ export and import

    function exportFile() {
      send({ type: 'dash.export' }, (r) => {
        if (!r) return;
        const url = URL.createObjectURL(new Blob([r.text], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = r.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    }

    $('file').addEventListener('change', async () => {
      const f = $('file').files[0];
      if (!f) return;
      if (f.size > MAX_IMPORT) { notice(`That file is over ${MAX_IMPORT / 1024} KiB, too big for a dashboard`, 'bad'); return; }
      const text = await f.text();
      send({ type: 'dash.import', text }, (r) => r && showImport(text, r.summary));
    });

    const SHOW_SKIPPED = 12;
    async function showImport(text, s) {
      if (!s.ok) { await ask('Cannot import', `<p>${esc(s.problem)}</p>`, [{ text: 'Close', value: 'close' }]); return; }
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      let body = `<p>${plural(s.tabs, 'tab', 'tabs')} with ${plural(s.widgets, 'widget', 'widgets')}.</p>`;
      if (s.newerVersion) body += `<p class="warn">The file is from a newer version (schema ${esc(s.newerVersion)}). Only what this version knows is imported.</p>`;
      if (s.confirmButtons) body += `<p class="warn">${plural(s.confirmButtons, 'button sends an action', 'buttons send actions')} in the confirm group (power off, eject and the like). Each press still needs a 1.5 s hold.</p>`;
      if (s.unknownKinds.length) body += `<p>Unknown widget kinds skipped: ${s.unknownKinds.map(esc).join(', ')}</p>`;
      if (s.skipped.length) {
        body += `<p>${plural(s.skipped.length, 'item was', 'items were')} left out:</p><ul>${s.skipped.slice(0, SHOW_SKIPPED).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
        if (s.skipped.length > SHOW_SKIPPED) body += `<p>and ${s.skipped.length - SHOW_SKIPPED} more not listed here.</p>`;
      } else body += '<p>Nothing was left out.</p>';
      body += '<p>Importing replaces your whole dashboard. Export first to keep a copy of the current one.</p>';
      const c = await ask('Import dashboard', body, [{ text: 'Cancel', value: 'cancel' }, { text: 'Replace dashboard', value: 'apply', cls: 'primary' }]);
      if (c !== 'apply') return;
      send({ type: 'dash.import', text, confirm: true }, (r) => {
        if (r && r.applied) { work = null; editing = false; document.body.classList.remove('editing'); currentId = null; selected = null; notice('Dashboard imported', 'ok'); }
      });
    }

    // ------------------------------------------------------------ grid

    function cellHeight(rows) {
      return $('stage').clientHeight / rows;
    }

    function buildGrid() {
      const tab = shown();
      if (!tab) return;
      syncTheme();
      $('empty').style.display = 'none';
      const key = JSON.stringify([tab.rows, tab.widgets.map((w) => [w.id, w.x, w.y, w.w, w.h]), editing]);
      if (grid && key === builtFor) { drawAll(); return; }
      builtFor = key;
      if (grid) grid.destroy(true);
      const el = document.createElement('div');
      el.className = 'grid-stack';
      el.id = 'grid';
      $('stage').prepend(el);
      const margin = parseFloat(getComputedStyle(document.body).getPropertyValue('--gap')) || 3;
      grid = GridStack.init({ column: meta.limits.columns, row: tab.rows, cellHeight: cellHeight(tab.rows), margin, mode: 'float', staticGrid: !editing, animate: false }, el);
      grid.load(tab.widgets.map((w) => ({ id: w.id, x: w.x, y: w.y, w: w.w, h: w.h, minW: meta.kinds[w.kind].min.w, minH: meta.kinds[w.kind].min.h })));
      grid.on('change', (_e, nodes) => {
        if (!editing) return;
        for (const n of nodes) {
          const w = work.widgets.find((x) => x.id === n.id);
          if (w) Object.assign(w, { x: n.x, y: n.y, w: n.w, h: n.h });
        }
        builtFor = JSON.stringify([work.rows, work.widgets.map((w) => [w.id, w.x, w.y, w.w, w.h]), editing]);
        renderBar();
        if (selected) renderPane();
      });
      fit();
      drawAll();
    }

    function fit() {
      const tab = shown();
      if (!grid || !tab) return;
      const ch = cellHeight(tab.rows);
      grid.cellHeight(ch);
      $('stage').style.setProperty('--ch', `${ch}px`);
      $('stage').style.setProperty('--cw', `${$('stage').clientWidth / meta.limits.columns}px`);
      shrink($('stage'));
    }
    let fitFrame = 0;
    window.addEventListener('resize', () => { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fit); });

    // ------------------------------------------------------------ themes

    const HEX = /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
    const allThemes = () => (themes ? [...themes.builtIn, ...themes.user] : []);
    const themeById = (id) => allThemes().find((t) => t.id === id);
    const isBuiltInTheme = (id) => Boolean(themes && themes.builtIn.some((t) => t.id === id));
    /** The tab's own theme, else the dashboard's, else the default; a removed theme is passed over. */
    const themeFor = (tab) => themeById(tab && tab.theme) || themeById(boardThemeOf(tab)) || themeById(themes && themes.defaultTheme);
    /** The theme of the dashboard a tab is on: a generic tab kept in a window draws in the generic theme. */
    const boardThemeOf = (tab) => (tab && genericBoard && dash && !dash.tabs.some((t) => t.id === tab.id) && genericBoard.tabs.some((t) => t.id === tab.id) ? genericBoard.theme : dash && dash.theme);
    // What the widgets were last drawn for: a change of base, bars, zeros or font draws them again.
    let drawnFor = '';

    /** Put a theme on the page: built-in colours come from the served CSS, a user theme's are set here, hex only. */
    function applyTheme(t) {
      if (!t) return;
      const b = document.body;
      Object.assign(b.dataset, { theme: t.id, base: t.base, font: t.font, bars: t.bars, zeros: t.leadingZeros ? 'dim' : 'none' });
      // Native parts of a control (scrollbars, pickers, option lists) follow the field background.
      const field = t.colors['input-bg'] || t.colors.bg;
      document.documentElement.style.colorScheme = HEX.test(field || '') && luminance(field) > 0.4 ? 'light' : 'dark';
      for (const k of themes.colorTokens) {
        const v = t.colors[k];
        if (!isBuiltInTheme(t.id) && typeof v === 'string' && HEX.test(v)) b.style.setProperty(`--${k}`, v);
        else b.style.removeProperty(`--${k}`);
      }
      const key = JSON.stringify([t.base, t.font, t.bars, t.leadingZeros]);
      if (key !== drawnFor) {
        drawnFor = key;
        if (grid) for (const el of grid.getGridItems()) { const c = el.querySelector('.grid-stack-item-content'); if (c) c._html = ''; }
      }
    }
    /** The theme of what is on screen, or the theme being edited while the theme editor is open. */
    function syncTheme() {
      if (!themes) return;
      applyTheme(themeDraft || themeFor(shown()));
    }
    const theme = () => ({ base: document.body.dataset.base, bars: document.body.dataset.bars, zeros: document.body.dataset.zeros === 'dim' });
    // Each base's own widget skins and title mark; its shapes, rules and chevrons are the CSS under [data-base].
    const SKINS = {
      rsi: { shields: 'ring', titlePre: 0 },
      drake: { shields: 'bars', titlePre: 3 },
    };
    const skin = () => SKINS[document.body.dataset.base] || SKINS.rsi;

    function onThemes(m) {
      themes = m;
      if (themeDraft && !themeById(themeDraft.id)) themeDraft = null;
      syncTheme();
      live('props', renderPane);
      live('theme-panel', renderThemePanel);
      drawAll();
    }

    // Web fonts arrive after the first draw; text sized for the fallback font is sized again.
    if (document.fonts) document.fonts.addEventListener('loadingdone', () => shrink($('stage')));

    // ------------------------------------------------------------ widgets

    /** Text that shrinks to fit its box: by the box height (`fh` percent) or its width, whichever is smaller. */
    const fit1 = (cls, text, fh) => {
      // A title mark (Drake's "// ") is drawn before every label, so it takes its share of the width.
      const n = String(text).length + (/\blbl\b/.test(cls) ? skin().titlePre : 0);
      return `<span class="fit ${cls}" style="--n:${Math.max(3, n)};${fh ? `--fh:${fh}` : ''}">${esc(text)}</span>`;
    };

    /** A reading's leading whole number padded with zeros the theme dims (RSI), or left as is (Drake). */
    function zeros(text) {
      const m = theme().zeros && /^(\d+)(.*)$/.exec(String(text));
      if (!m) return { pad: '', text: String(text) };
      const width = m[2].trim().startsWith('%') ? 3 : 4;
      return { pad: '0'.repeat(Math.max(0, width - m[1].length)), text: String(text) };
    }
    const numHtml = (text, tag = 'span') => { const z = zeros(text); return `${z.pad ? `<${tag} class="lz">${z.pad}</${tag}>` : ''}${esc(z.text)}`; };
    const fitNum = (cls, text) => { const z = zeros(text); return `<span class="fit ${cls}" style="--n:${Math.max(3, z.pad.length + z.text.length)}">${numHtml(text)}</span>`; };

    function lampOf(w) {
      const src = w.bind.kind === 'value' ? vals && vals.values[w.bind.id] : vals && vals.toggles[w.bind.id];
      let s = (src && src.lamp) || 'unknown';
      if (w.bind.invert && (s === 'on' || s === 'off')) s = s === 'on' ? 'off' : 'on';
      return { s, title: src ? (src.text ?? src.state) : DASH };
    }

    const SUPPORT_MARK = { absent: 'NOT ON SHIP', unavailable: 'N/A' };
    /** What this ship lacks of a widget's function: the service's support entry for its bind, or null. */
    function supportOf(w) {
      const s = vals && vals.support;
      if (!s) return null;
      const id = w.kind === 'mode' ? 'mode' : w.bind.kind === 'value' || w.bind.kind === 'toggle' ? w.bind.id : null;
      return (id && s[id]) || null;
    }

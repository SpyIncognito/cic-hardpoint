      });
    }

    async function fbLeave() {
      if (!FB.editing) return true;
      if (!FB.changed) { fbSetEditing(false); fbLoad(FB.saved); return true; }
      const c = await ask('Unsaved changes', '<p>The Fleet tab layout has changes that are not saved.</p>', [{ text: 'Cancel', value: 'cancel' }, { text: 'Discard', value: 'discard', cls: 'danger' }, { text: 'Save', value: 'save', cls: 'primary' }]);
      if (c === 'save') { await fbDone(); return !FB.editing; }
      if (c !== 'discard') return false;
      fbSetEditing(false);
      fbLoad(FB.saved);
      return true;
    }

    $('fleet-full').addEventListener('click', (e) => {
      if (!FB.editing || !e.target.closest('.fboard')) return;
      const b = e.target.closest('[data-fb]');
      const item = e.target.closest('#fb-board .grid-stack-item');
      if (!b && !item) return;
      e.stopPropagation();
      e.preventDefault();
      const v = fbView();
      if (b) {
        if (b.disabled) return;
        const act = b.dataset.fb;
        if (act === 'add') fbAddObject(b.dataset.kind, UG.targetOf(FB.layout.objects, FB.selected));
        else if (act === 'place') fbAddObject('unit', null, b.dataset.unit);
        else if (act === 'remove') { const id = FB.selected; FB.selected = null; fbRebuild(() => { FB.layout = UG.removeFrom(FB.layout, id); }); }
        else if (act === 'resetinside') fbRebuild(() => { FB.layout = UG.resetInside(FB.layout, FB.selected) || FB.layout; });
        else if (act === 'moveout' || act === 'putback') {
          fbSync();
          const next = act === 'moveout' ? UG.moveOut(FB.layout, FB.selected) : UG.putBack(FB.layout, FB.selected, v);
          if (!next) { FB.note = 'That would nest too deep.'; fbRedraw(); return; }
          fbRebuild(() => { FB.layout = next; });
        } else if (act === 'wider' || act === 'narrower') {
          const n = fbPositions().get(FB.selected);
          const at = UG.find(FB.layout.objects, FB.selected);
          const cols = at && at.parent ? at.parent.w : UG.COLUMNS;
          if (n) fbMoveSelected({ w: Math.max(1, Math.min(cols - n.x, n.w + (act === 'wider' ? 1 : -1))) });
        } else if (act === 'unselect') { FB.selected = null; fbRedraw(); }
        else if (act === 'starter') { FB.selected = null; fbLoad(null); FB.note = 'The starter: Done saves it as your layout.'; fbRedraw(); }
        else if (act === 'revert') { FB.selected = null; fbLoad(FB.saved); FB.source = FB.saved ? 'own' : 'starter'; fbRedraw(); }
        return;
      }
      // The click that ends a drag or resize selects nothing.
      if (performance.now() - FB.movedAt < 300) return;
      if (item.gridstackNode) { FB.selected = item.gridstackNode.id; fbRedraw(); }
    }, true);

    $('fleet-full').addEventListener('change', (e) => {
      const f = e.target.closest('[data-fbpos]');
      if (!f || !FB.editing || !FB.selected) return;
      const n = Number(f.value);
      if (Number.isFinite(n)) fbMoveSelected({ [f.dataset.fbpos]: Math.round(n) });
    });

    $('fleet-full').addEventListener('input', (e) => {
      const f = e.target.closest('[data-fbset]');
      if (!f || !FB.editing) return;
      const val = f.value;
      if (f.dataset.fbset === 'cell') { fbRebuild(() => { FB.layout.cell = Number(val); }); return; }
      const at = FB.selected && UG.find(FB.layout.objects, FB.selected);
      if (!at) return;
      const o = at.object;
      FB.changed = true;
      UG.touchParent(FB.layout.objects, o.id);
      if (f.dataset.fbset === 'label') o.label = val.slice(0, UG.LABEL_MAX);
      else o[f.dataset.fbset] = val || undefined;
      // A unit shown anew gets the default grid of the unit it now shows.
      if (f.dataset.fbset === 'bind' && o.kind === 'unit' && UG.untouched(o)) { fbRebuild(() => { FB.layout = UG.resetInside(FB.layout, o.id) || FB.layout; }); return; }
      const v = fbView();
      fbDraw(o, at.depth, at.parent, v);
      fbFit();
    });

    // The palette's objects drag onto the board or a unit's grid: the grid under the drop is the target.
    $('fleet-full').addEventListener('dragstart', (e) => {
      const p = FB.editing && e.target.closest('.pitem');
      if (!p) return;
      e.dataTransfer.setData('text/x-fb-kind', p.dataset.kind);
      e.dataTransfer.effectAllowed = 'copy';
    });
    const fbDropTarget = (e) => {
      const g = FB.editing && e.target.closest && e.target.closest('#fb-board, #fb-board .grid-stack.sub');
      if (!g) return null;
      if (!g.dataset.owner) return { object: null, depth: -1 };
      const at = UG.find(FB.layout.objects, g.dataset.owner);
      return at ? { object: at.object, depth: at.depth } : null;
    };
    $('fleet-full').addEventListener('dragover', (e) => {
      if (!FB.editing || ![...e.dataTransfer.types].includes('text/x-fb-kind')) return;
      if (fbDropTarget(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
    });
    $('fleet-full').addEventListener('drop', (e) => {
      const kind = FB.editing && e.dataTransfer.getData('text/x-fb-kind');
      const target = kind && fbDropTarget(e);
      if (!target) return;
      e.preventDefault();
      e.stopPropagation();
      if (!UG.holds(target, fbView()).includes(kind)) { FB.note = `${UG.KINDS[kind].label} cannot go in ${fbTitle(target.object, fbView())}.`; fbRedraw(); return; }
      fbAddObject(kind, target);
    }, true);

    // Esc selects the unit around the selection, then nothing.
    document.addEventListener('keydown', (e) => {
      if (!FB.editing || e.key !== 'Escape' || !FB.selected || $('dlg').open) return;
      const at = UG.find(FB.layout.objects, FB.selected);
      FB.selected = at && at.parent ? at.parent.id : null;
      fbRedraw();
    });
    window.addEventListener('resize', () => { if (FB.editing && !fbEditable()) fbLeave(); });


    // ------------------------------------------------------------ relay

    // This machine's relay status (PROTOCOL.md section 5); `via` names the game PC while this
    // companion's pages are bridged to it.
    let relay = null, relayAt = 0, relayTimer = null, relayAsked = location.hash === '#relay', relayLine = '', relayPairing = false;
    const RELAY_MODES = [
      ['off', 'Off', 'Hardpoint runs on this PC only.'],
      ['relay', 'Relay to a companion', 'This is the game PC: Hardpoint shrinks to a small bar (Stop relay, Settings, Exit relay mode) and a paired laptop or tablet shows the dashboard and sends the actions.'],
      ['companion', 'Be a companion', 'This laptop or tablet shows the game PC\'s Hardpoint: status, dashboards and the fleet panel come from the game PC, and actions run there.'],
    ];
    function relayTools() {
      if (!relay) return '';
      const via = relay.via ? `<span class="via" title="Everything on this page comes from ${esc(relay.via)}">via ${esc(relay.via)}</span>` : '';
      const st = relay.mode === 'off' ? '' : `<span class="fdot" data-link="${relay.state === 'up' ? 'online' : ['connecting', 'listening'].includes(relay.state) ? 'connecting' : 'offline'}" aria-hidden="true"></span>`;
      return `${via}<button class="btn ${$('relay-panel').hidden ? '' : 'on'}" data-do="relay" type="button" title="Relay this PC to a companion, or be one">${st}Relay</button>`;
    }
    function onRelay(m) {
      relay = m; relayAt = Date.now();
      const down = relay.mode === 'companion' && !relay.via;
      document.body.classList.toggle('relay-down', down);
      const banner = $('relay-banner');
      banner.hidden = !down;
      if (down) {
        const who = relay.peer ? esc(relay.peer.name) : 'the game PC';
        banner.innerHTML = `<b>${relay.peer ? `Lost ${who}` : 'Not paired with a game PC'}</b><span>${relay.peer ? `Waiting for ${who} to connect; actions are off until it does.` : 'Pair this companion from the game PC to see its Hardpoint here.'}</span><button class="btn" data-rl="open" type="button">Relay settings</button>`;
        if (!dash) showEmpty('This PC is a companion: the dashboard comes from the game PC once it connects.');
      }
      if (dash) live('bar', renderBar);
      if (relayAsked) { relayAsked = false; openRelay(); }
      else if (!$('relay-panel').hidden) live('relay-panel', renderRelay);
    }
    function openRelay() {
      for (const id of ['fleet-fields', 'fleet-join', 'fleet-consent', 'fleet-host']) $(id).hidden = true;
      $('relay-panel').hidden = false;
      renderRelay(true);
      if (dash) renderBar();
      clearInterval(relayTimer);
      relayTimer = setInterval(() => { if ($('relay-panel').hidden) { clearInterval(relayTimer); return; } tickRelayCode(); }, 1000);
    }
    function relayLeft() {
      const p = relay && relay.pairing;
      return p ? Math.max(0, p.leftMs - (Date.now() - relayAt)) : 0;
    }
    function tickRelayCode() {
      const el = $('rl-left');
      if (!el) return;
      const s = Math.ceil(relayLeft() / 1000);
      el.textContent = s > 0 ? `Good for ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : 'The code ran out: show a new one';
    }
    const when = (ms) => { try { return new Date(ms).toLocaleString(); } catch { return ''; } };
    function relayPeer(label) {
      const p = relay.peer;
      if (!p) return '';
      return `<h4>${label}</h4><div class="peer"><b>${esc(p.name)}</b><small>Key ${esc(p.fingerprint)}${p.lastAddress ? ` · at ${esc(p.lastAddress)}` : ''}${p.pairedAt ? ` · paired ${esc(when(p.pairedAt))}` : ''}</small></div>` +
        '<div class="row"><button class="btn" data-rl="rename" type="button">Rename</button><button class="btn danger" data-rl="unpair" type="button">Unpair</button></div>';
    }
    function renderRelay(fresh) {
      const el = $('relay-panel');
      if (!relay) { el.innerHTML = '<h3>Relay</h3><p class="note">Connecting to Hardpoint...</p>'; return; }
      const keep = !fresh && $('rl-address') ? { address: $('rl-address').value, code: $('rl-code').value } : { address: (relay.peer && relay.peer.lastAddress) || '', code: '' };
      const chosen = relay.relayAfterPairing ? 'relay' : relay.mode;
      const modes = RELAY_MODES.map(([id, label, text]) => `<label class="${chosen === id ? 'on' : ''}"><input type="radio" name="rl-mode" value="${id}" ${chosen === id ? 'checked' : ''} /><span><b>${esc(label)}</b><small>${esc(text)}</small></span></label>`).join('');
      let body = '';
      if (relay.mode === 'companion') {
        const p = relay.pairing;
        let pairing;
        if (p && p.pending) {
          pairing = `<div class="peer"><b>${esc(p.pending.name)}</b> wants to pair<small>Key ${esc(p.pending.fingerprint)} · from ${esc(p.pending.lastAddress || '')}</small></div>` +
            `<p class="note">It typed the right code. Pair to let it show its Hardpoint here${relay.peer ? `, in place of ${esc(relay.peer.name)}` : ''}.</p>` +
            '<div class="row"><button class="btn primary" data-rl="accept" type="button">Pair</button><button class="btn" data-rl="refuse" type="button">Cancel</button></div>';
        } else if (p && p.burned) {
          pairing = '<p class="bad">Pairing stopped after 3 wrong codes.</p><div class="row"><button class="btn primary" data-rl="code" type="button">New code</button><button class="btn" data-rl="cancel" type="button">Stop pairing</button></div>';
        } else if (p && p.code && relayLeft() > 0) {
          pairing = `<p class="note">On the game PC, open Relay, choose Relay to a companion and type this address and code.</p><div class="code">${esc(p.code)}</div><p class="note" id="rl-left"></p>` +
            (p.failures ? `<p class="bad">${p.failures} of 3 wrong codes</p>` : '') +
            '<div class="row"><button class="btn" data-rl="code" type="button">New code</button><button class="btn" data-rl="cancel" type="button">Stop pairing</button></div>';
        } else {
          pairing = `<p class="note">Show a code, then type it on the game PC. The code is good for 2 minutes and only while it is shown here.</p><div class="row"><button class="btn primary" data-rl="code" type="button">${p ? 'New code' : 'Show pairing code'}</button></div>`;
        }
        const addrs = relay.addresses.length ? relay.addresses.map((a) => `<b class="mono">${esc(a)}:${relay.port}</b>`).join(', ') : `this PC's address, port <b class="mono">${relay.port}</b>`;
        body = `<h4>State</h4><p class="state">${esc(relay.text)}</p>` +
          `<h4>Pair with the game PC</h4><p class="note">The game PC dials ${addrs}.</p>${pairing}` +
          '<p class="note">Windows asks once to let Hardpoint accept connections: allow it on private networks.</p>' +
          relayPeer('Paired game PC');
      } else {
        const paired = relay.peer;
        const linked = relay.state === 'up' || relay.state === 'connecting';
        body = `<h4>State</h4><p class="state">${relay.relayAfterPairing ? 'Relaying starts once a companion is paired below.' : esc(relay.text)}</p>` +
          (relay.mode === 'relay' && paired ? `<div class="row"><button class="btn" data-rl="${linked ? 'disconnect' : 'connect'}" type="button">${linked ? 'Disconnect' : 'Connect'}</button></div>` : '') +
          relayPeer('Paired companion') +
          (paired && !relayPairing
            ? `<div class="row"><button class="btn" data-rl="pair-form" type="button">Pair another companion</button></div><p class="note">${esc(relayLine)}</p>`
            : `<h4>${paired ? 'Pair another companion' : 'Pair a companion'}</h4>` +
              '<p class="note">On the laptop or tablet choose Be a companion and Show pairing code, then type the address and code it shows.</p>' +
              '<div class="pair-row"><label class="stack">Companion address <input id="rl-address" autocomplete="off" spellcheck="false" placeholder="its name or IP; :port if not 47521" /></label>' +
              '<label class="stack">Pairing code <input id="rl-code" autocomplete="off" inputmode="numeric" maxlength="11" placeholder="8 digits" /></label></div>' +
              '<div class="row"><button class="btn primary" data-rl="pair" type="button">Pair</button>' +
              (paired ? '<button class="btn" data-rl="address" type="button">Only change the address</button>' : '') + '</div>' +
              `<p class="note" id="rl-pairing">${esc(relayLine)}</p>`);
      }
      el.innerHTML = `<h3>Relay</h3><div class="modes">${modes}</div>${body}` +
        `<h4>This PC</h4><p class="note"><b>${esc(relay.name)}</b> · relay key ${esc(relay.fingerprint)} · Hardpoint ${esc(relay.version)}. Both machines need the same version.</p>` +
        '<div class="row"><button class="btn" data-rl="close" type="button">Close</button></div>';

      const power = f['detail.power'] && f['detail.power'].items;
      const detailKv = kv([['detail.speed', 'Speed'], ['detail.altitude', 'Altitude']]);
      const detail = !m.sharing.detail ? `<p class="note">${esc(m.handle)} does not share detail.</p>`
        : `${faces ? `<div class="fbars">${faces.map((r) => fleetBar(r, r.label)).join('')}</div>` : ''}` +
          `${power ? `<h4 style="margin-top:8px">Power</h4><div class="lamps">${power.map((r) => `<span class="t-${esc(r.tone)}" title="${esc(r.label)}: ${esc(r.text)}">${esc(r.label)}</span>`).join('')}</div>` : ''}` +
          `${detailKv ? `<div class="kv" style="margin-top:8px">${detailKv}</div>` : ''}` +
          (faces || power || detailKv ? '' : '<p class="note">Waiting for the detail fields.</p>');
      const groups = [{ id: '', name: 'Ungrouped' }, ...fleet.view.groups];
      el.innerHTML = `<div class="dhead"><h3>${esc(m.handle)}</h3>${chip(m.status)}<button class="btn" data-fd="close" type="button">Close</button></div>` +
        `<p class="note">Shares ${esc(shares)} · ${esc(updatedAgo(m.ageMs))}${m.me ? ' · your own card' : ''}</p>` +
        (m.ship ? `<p class="note">Ship card ${esc(m.sourceLabel || '')}</p>` : fleetEvent() ? `<p class="note">Unit: ${esc(fleetGroupName(m.group))}${m.roles.length ? ` · ${esc(m.roles.map((r) => (ROLE[r] || [, r])[1]).join(', '))}` : ''}</p>`
          : `<label>Group <select id="fd-group">${groups.map((g) => opt(g.id, g.name, (m.group || '') === g.id)).join('')}</select></label>`) +
        `<section><h4>Ship</h4>${m.sharing.ship ? `<div class="fbars">${shipBars}</div><div class="kv" style="margin-top:6px">${shipKv}</div>` : `<p class="note">${esc(m.handle)} does not share ship status.</p>`}</section>` +
        `<section><h4>Character</h4>${m.sharing.character ? `<div class="fbars">${charBars}</div><div class="kv" style="margin-top:6px">${charKv}</div>` : `<p class="note">${esc(m.handle)} does not share character status.</p>`}</section>` +
        `<section><h4>Shield faces, power, flight</h4>${detail}</section>`;
    }
    $('fleet-detail').addEventListener('click', (e) => { if (e.target.closest('[data-fd="close"]')) closeFleetDetail(); });
    $('fleet-detail').addEventListener('change', (e) => {
      if (e.target.id === 'fd-group' && fleetDetail) send({ type: 'fleet.assign', member: fleetDetail, group: e.target.value || null });
    });

    function openFleetFields() {
      closeFleetOverlays('fleet-fields');
      const el = $('fleet-fields');
      const on = new Set(fleet.view.fields);
      const box = (consent) => fleet.fields.filter((f) => f.consent === consent)
        .map((f) => `<label><input type="checkbox" data-ff="${esc(f.id)}" ${on.has(f.id) ? 'checked' : ''} /> ${esc(f.label)}</label>`).join('');
      el.innerHTML = '<h3>Card fields</h3><p class="note">What the member cards you see show. Only these are asked of each member, and each member still decides what they share.</p>' +
        `<div class="cols"><div><h4>Ship status</h4>${box('ship')}</div><div><h4>Character status</h4>${box('character')}</div></div>` +
        '<p class="note">Shield faces, power, speed and altitude come with the detail view only, while it is open.</p>' +
        '<div class="row"><button class="btn primary" data-ff-do="close" type="button">Done</button></div>';
      el.hidden = false;
    }
    $('fleet-fields').addEventListener('change', () => {
      const fields = [...$('fleet-fields').querySelectorAll('[data-ff]')].filter((x) => x.checked).map((x) => x.dataset.ff);
      send({ type: 'fleet.fields', fields });
    });
    $('fleet-fields').addEventListener('click', (e) => { if (e.target.closest('[data-ff-do="close"]')) $('fleet-fields').hidden = true; });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('dlg').open) { closeFleetOverlays(); if (dashPanel) closeDashPanel(); } });

    // ------------------------------------------------------------ kiosk

    if (KIOSK) {
      document.body.classList.add('kiosk');
      let idle;
      const wake = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if ($('kiosk-menu').hidden && $('bezel-panel').hidden) document.body.classList.add('idle'); }, 2000); };
      for (const ev of ['pointermove', 'pointerdown', 'keydown']) window.addEventListener(ev, wake, true);
      wake();

      // The hidden way out: hold Escape, or the top left corner, for 2 s.
      const EXIT_MS = 2000;
      let exit = null, swallowClick = false;
      const startExit = (via) => {
        if (exit || !$('kiosk-menu').hidden) return;
        const started = Date.now();
        exit = { via, timer: setInterval(() => {
          const f = (Date.now() - started) / EXIT_MS;
          $('exit-hint').style.display = f > 0.25 ? 'block' : 'none';
          $('exit-hint').firstElementChild.style.width = `${Math.min(1, f) * 100}%`;
          if (f >= 1) { swallowClick = via === 'corner'; stopExit(); openKioskMenu(); }
        }, 50) };
      };
      const stopExit = () => { if (!exit) return; clearInterval(exit.timer); exit = null; $('exit-hint').style.display = 'none'; };
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !e.repeat) startExit('key'); });
      window.addEventListener('keyup', (e) => { if (e.key === 'Escape') stopExit(); });
      window.addEventListener('pointerdown', (e) => { if (e.clientX < 48 && e.clientY < 48) startExit('corner'); }, true);
      window.addEventListener('pointerup', stopExit, true);
      window.addEventListener('pointercancel', stopExit, true);
      window.addEventListener('click', (e) => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

      if (WANT_FS) setTimeout(() => { if (!isFull()) $('fs-prompt').hidden = false; }, 600);
      $('fs-prompt').addEventListener('click', () => { $('fs-prompt').hidden = true; goFull(); });
    }

    const isFull = () => Boolean(document.fullscreenElement) || (innerWidth === screen.width && innerHeight === screen.height);

    /** Full screen on the display this window is on; needs a click or tap in this window. */
    async function goFull() {
      let opts = {};
      try {
        const granted = navigator.permissions && (await navigator.permissions.query({ name: 'window-management' })).state === 'granted';
        if (granted && hasScreens()) opts = { screen: (await window.getScreenDetails()).currentScreen };
      } catch { /* the permission name is not known everywhere */ }
      try { await document.documentElement.requestFullscreen(opts); } catch { notice('Full screen was refused; press F11', 'bad'); }
    }

    function openKioskMenu() {
      const m = $('kiosk-menu');
      const t = serverTab(currentId);
      m.innerHTML = `<h3>Kiosk menu</h3><p class="note">${esc(t ? t.name : onFleetTab() ? FLEET_TAB_DEF.name : ONLY)}. Hold Escape or the top left corner for 2 s to come back here.</p><div class="row">` +
        '<button class="btn primary" data-k="back" type="button">Back to the tab</button>' +
        `<button class="btn" data-k="map" type="button" ${t ? '' : 'disabled'}>Map bezel buttons</button>` +
        `<button class="btn" data-k="full" type="button">${document.fullscreenElement ? 'Leave full screen' : 'Full screen'}</button>` +
        '<button class="btn" data-k="dash" type="button">Open the full dashboard here</button>' +
        '<button class="btn" data-k="close" type="button">Close this window</button></div>';
      m.hidden = false;
      document.body.classList.remove('idle');
    }
    $('kiosk-menu').addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (!b) return;
      const k = b.dataset.k;
      $('kiosk-menu').hidden = true;
      if (k === 'map') openBezelPanel(currentId);
      else if (k === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else goFull(); }
      else if (k === 'dash') { if (APP) APP.request('dashboard'); else location.href = '/dash'; }
      else if (k === 'close') { if (APP) APP.request('close'); else window.close(); }
    });

    // ------------------------------------------------------------ bezel buttons

    function bindText(b) {
      if (b.kind === 'toggle') return `${toggleLabel(b.id)}: ${b.to ? b.to.toUpperCase() : 'toggle'}`;
      if (b.kind === 'mode') return `Master mode ${b.to}`;
      if (b.kind === 'sequence') return `Run ${(cat && (cat.sequences.find((s) => s.id === b.id) || {}).name) || b.id}`;
      return `${b.id}${isConfirm(b.id) ? ' (hold 1.5 s)' : ''}`;
    }
    const bezelText = (m) => (m.label ? `${m.label} (${bindText(m.bind)})` : bindText(m.bind));

    const bindKey = (b) => `${b.kind}|${b.id || ''}|${b.to || ''}`;
    function keyBind(k) {
      const [kind, id, to] = k.split('|');
      if (kind === 'mode') return { kind, to };
      if (kind === 'toggle') return to ? { kind, id, to } : { kind, id };
      return { kind, id };
    }
    function bezelOptions(cur) {
      const groups = [
        ['Toggles', cat.toggles.flatMap((t) => [[`toggle|${t.id}|`, `${t.label}: toggle`], [`toggle|${t.id}|on`, `${t.label}: ON`], [`toggle|${t.id}|off`, `${t.label}: OFF`]])],
        ['Master mode', [['mode||NAV', 'Master mode NAV'], ['mode||SCM', 'Master mode SCM']]],
        ['Sequences', cat.sequences.map((s) => [`sequence|${s.id}|`, s.name])],
        ['Game actions', cat.gameActions.map((a) => [`action|${a.name}|`, `${a.name}${a.confirm ? ' (hold 1.5 s)' : ''}`])],
      ];
      if (cur && !groups.some(([, l]) => l.some(([k]) => k === cur))) groups[3][1].unshift([cur, cur.split('|')[1]]);
      return groups.map(([g, l]) => `<optgroup label="${esc(g)}">${l.map(([k, t]) => opt(k, t, k === cur)).join('')}</optgroup>`).join('');
    }

    // The mapping being edited: the tab's id, the button just pressed, and the controller it came from.
    let mapping = null;

    function openBezelPanel(tabId) {
      mapping = { tab: tabId, button: null, padId: null };
      if (APP && KIOSK) APP.request('mapping', { active: true });
      $('bezel-panel').hidden = false;
      renderBezelPanel();
      if (!polling) poll();
    }
    function closeBezelPanel() {
      if (APP && KIOSK && mapping) APP.request('mapping', { active: false });
      mapping = null; $('bezel-panel').hidden = true;
    }

    function renderBezelPanel() {
      if (!mapping) return;
      const t = serverTab(mapping.tab);
      if (!t) { closeBezelPanel(); return; }
      if (!cat) return;
      const b = t.bezel || { gamepadId: '', buttons: [] };
      const pad = b.gamepadId || mapping.padId;
      const cur = mapping.button !== null ? b.buttons.find((m) => m.button === mapping.button) : null;
      const full = !cur && b.buttons.length >= meta.limits.bezelButtons;
      const learn = mapping.button === null
        ? `<div class="learn wait">Press a bezel button to map it, or to change what it does.</div>`
        : `<div class="learn"><div class="big">Button ${mapping.button}${cur ? ', mapped' : ', new'}</div>
            ${full ? `<p class="note">All ${meta.limits.bezelButtons} buttons are mapped; clear one first.</p>` : `
            <label>Does <select id="bz-bind">${bezelOptions(cur ? bindKey(cur.bind) : '')}</select></label>
            <label>Label <input id="bz-label" maxlength="${meta.limits.label}" value="${esc((cur && cur.label) || '')}" placeholder="optional" /></label>
            <p class="note">Game actions marked hold are sent after the button is held for 1.5 s.</p>
            <div class="row"><button class="btn primary" data-b="save" type="button">${cur ? 'Save button' : 'Map button'}</button><button class="btn" data-b="cancel" type="button">Cancel</button></div>`}</div>`;
      const rows = b.buttons.length
        ? b.buttons.map((m) => `<div class="map ${m.button === mapping.button ? 'on' : ''}"><b>${m.button}</b><span class="what"><span>${esc(m.label || bindText(m.bind))}</span>${m.label ? `<small>${esc(bindText(m.bind))}</small>` : ''}</span>` +
            `<span class="acts"><button class="btn" data-b="edit" data-n="${m.button}" type="button">Edit</button><button class="btn" data-b="clear" data-n="${m.button}" type="button">Clear</button></span></div>`).join('')
        : '<div class="empty">No buttons mapped yet.</div>';
      $('bezel-panel').innerHTML = `<h3>Bezel buttons: ${esc(t.name)}</h3>
        <p class="pad">${pad ? `Controller <b>${esc(pad)}</b>` : 'No controller yet: the first button pressed picks it.'}</p>
        ${learn}
        <div class="maps">${rows}</div>
        <p class="note">${b.buttons.length} of ${meta.limits.bezelButtons} mapped. Changes are saved at once.</p>
        <div class="row"><button class="btn danger" data-b="clear-all" type="button" ${b.buttons.length ? '' : 'disabled'}>Clear all</button>
          <button class="btn" data-b="relearn" type="button">Relearn on another controller</button>
          <button class="btn primary" data-b="done" type="button">Done</button></div>`;
    }

    function saveBezel(t, buttons, padId) {
      send({ type: 'dash.setBezel', tab: t.id, bezel: buttons.length || padId ? { gamepadId: padId, buttons } : null });
    }

    $('bezel-panel').addEventListener('click', async (e) => {
      const el = e.target.closest('[data-b]');
      if (!el || !mapping) return;
      const t = serverTab(mapping.tab);
      const b = (t && t.bezel) || { gamepadId: mapping.padId, buttons: [] };
      const act = el.dataset.b;
      if (act === 'done') return closeBezelPanel();
      if (act === 'cancel') { mapping.button = null; return renderBezelPanel(); }
      if (act === 'edit') { mapping.button = Number(el.dataset.n); return renderBezelPanel(); }
      if (act === 'clear') {
        const n = Number(el.dataset.n);
        if (mapping.button === n) mapping.button = null;
        return saveBezel(t, b.buttons.filter((m) => m.button !== n), b.gamepadId);
      }
      if (act === 'clear-all' || act === 'relearn') {
        const relearn = act === 'relearn';
        if (b.buttons.length) {
          const c = await ask(relearn ? 'Relearn bezel buttons' : 'Clear bezel buttons', `<p>${relearn ? 'Clear every mapped button, then map them again on the next controller you press.' : `Clear all ${b.buttons.length} mapped buttons?`}</p>`, [{ text: 'Cancel', value: 'cancel' }, { text: 'Clear all', value: 'clear', cls: 'danger' }]);
          if (c !== 'clear') return;
        }
        mapping.button = null;
        mapping.padId = null;
        send({ type: 'dash.setBezel', tab: t.id, bezel: null });
        renderBezelPanel();
        return;
      }
      if (act === 'save') {
        const bind = keyBind($('bz-bind').value);
        const label = $('bz-label').value.trim();
        const entry = { button: mapping.button, bind, ...(label ? { label } : {}) };
        const others = b.buttons.filter((m) => m.button !== mapping.button);
        const buttons = [...others, entry].sort((x, y) => x.button - y.button);
        mapping.button = null;
        saveBezel(t, buttons, b.gamepadId || mapping.padId);
      }
    });

    // Bezel buttons arrive as game-controller buttons, as on the MFD pages; only press and release edges count.
    let polling = false;
    const padPrev = new Map();
    function poll() {
      polling = true;
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const pad of pads) {
        if (!pad) continue;
        const before = padPrev.get(pad.index) || [];
        pad.buttons.forEach((b, i) => {
          if (b.pressed && !before[i]) onPadButton(pad, i);
          if (!b.pressed && before[i]) onPadRelease(pad, i);
        });
        padPrev.set(pad.index, pad.buttons.map((b) => b.pressed));
      }
      if (KIOSK || mapping) requestAnimationFrame(poll);
      else polling = false;
    }

    function onPadButton(pad, index) {
      if (mapping) {
        const t = serverTab(mapping.tab);
        const known = (t && t.bezel && t.bezel.gamepadId) || mapping.padId;
        if (known && pad.id !== known) { notice(`That button is on another controller (${pad.id}). Relearn to switch.`, 'bad'); return; }
        if (index > meta.limits.buttonIndex) { notice(`Button ${index} is past the last index the dashboard keeps (${meta.limits.buttonIndex})`, 'bad'); return; }
        mapping.padId = pad.id;
        mapping.button = index;
        renderBezelPanel();
        return;
      }
      if (!KIOSK || !$('kiosk-menu').hidden) return;
      if (APP && APP.nativeBezel) return;
      const t = serverTab(currentId);
      const m = t && t.bezel && t.bezel.gamepadId === pad.id && t.bezel.buttons.find((x) => x.button === index);
      if (m) bezelPress(m);
    }
    function onPadRelease(pad, index) {
      if (bezelHold && bezelHold.button === index) endBezelHold();
    }

    /** The same message a widget click sends; a confirm-group action is held 1.5 s like the widget. */
    function bezelPress(m) {
      const b = m.bind;
      if (b.kind === 'toggle') {
        if (b.to) send({ type: 'set', toggle: b.id, to: b.to });
        else { const t = vals && vals.toggles[b.id]; if (t) send(t.click); else notice(`${toggleLabel(b.id)}: no data from the game`, 'bad'); }
      } else if (b.kind === 'mode') send({ type: 'mode', to: b.to });
      else if (b.kind === 'sequence') runSequence(b.id);
      else if (!isConfirm(b.id)) send({ type: 'press', action: b.id });
      else startBezelHold(m);
    }

    let bezelHold = null;
    function startBezelHold(m) {
      if (bezelHold) endBezelHold();
      const action = m.bind.id;
      const started = Date.now();
      send({ type: 'hold.start', action });
      $('hold-text').textContent = `Hold: ${m.label || action}`;
      $('hold-bar').hidden = false;
      bezelHold = { button: m.button, action, timer: setInterval(() => {
        const f = (Date.now() - started) / HOLD_MS;
        $('hold-bar').querySelector('i').style.width = `${Math.min(1, f) * 100}%`;
        if (f >= 1) { bezelHold.sent = true; endBezelHold(); send({ type: 'press', action, confirmed: true }); }
      }, 50) };
    }
    function endBezelHold() {
      if (!bezelHold) return;
      clearInterval(bezelHold.timer);
      if (!bezelHold.sent) send({ type: 'hold.end', action: bezelHold.action });
      bezelHold = null;
      $('hold-bar').hidden = true;
      $('hold-bar').querySelector('i').style.width = '0';
    }

    if (APP) {
      let appHold = null;
      APP.on((e) => {
        if (e.type === 'notice') notice(e.text, e.tone);
        else if (e.type === 'hold') {
          const started = Date.now();
          clearInterval(appHold);
          $('hold-text').textContent = `Hold: ${e.label}`;
          $('hold-bar').hidden = false;
          appHold = setInterval(() => { $('hold-bar').querySelector('i').style.width = `${Math.min(1, (Date.now() - started) / HOLD_MS) * 100}%`; }, 50);
        } else if (e.type === 'holdEnd') {
          clearInterval(appHold);
          appHold = null;
          $('hold-bar').hidden = true;
          $('hold-bar').querySelector('i').style.width = '0';
        }
      });
    }

    if (KIOSK) poll();

    document.body.classList.toggle('editing', editing);
    connect();
  </script>
</body>
</html>

[package]
name = "sc-game"
description = "The Star Citizen local telemetry API: gRPC client, link with reconnect, replay and scrub. Frames are JSON in the same shape as the TypeScript client."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
tonic = { version = "0.14", default-features = false, features = ["channel"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"

[build-dependencies]
protox = "0.10"
prost = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "sc-app"
description = "Hardpoint, the desktop app for Windows: the control service in-process, the dashboard in a native window, detached tabs on their displays, bezel buttons and a tray icon."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "hardpoint"
path = "src/main.rs"

[build-dependencies]
# The exe's icon and version information on Windows (no unsafe code of ours).
embed-resource = "3"

[dependencies]
sc-service = { path = "../sc-service" }
sc-game = { path = "../sc-game" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# Decodes the pre-rendered icon PNGs in assets/.
png = "0.18"

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tray-icon = { version = "0.26", default-features = false }
gilrs = { version = "0.11", default-features = false, features = ["wgi"] }
display-info = "0.5"
# Message boxes for a failed start, since the release build has no console.
rfd = { version = "0.18", default-features = false }

[dev-dependencies]
# Exact float parsing, so numbers read back match what node parsed bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>{{NAME}}</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1426; color: #E6ECF5; cursor: default; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-family: "Segoe UI", "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 38%, #16264A 0%, #0B1426 68%); border: 1px solid #1E2C48; box-sizing: border-box; }
  .icon { width: 148px; height: 148px; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .name { font-size: 34px; font-weight: 700; letter-spacing: 8px; padding-left: 8px; }
  .bar { width: 160px; height: 2px; background: #1E2C48; overflow: hidden; border-radius: 1px; }
  .bar span { display: block; width: 40%; height: 100%; background: #3FD0FF; animation: sweep 1.2s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
  <div class="icon" aria-hidden="true">{{ICON}}</div>
  <div class="name">{{NAME}}</div>
  <div class="bar" role="progressbar" aria-label="Starting"><span></span></div>
</body>
</html>

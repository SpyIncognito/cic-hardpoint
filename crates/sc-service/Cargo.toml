[package]
name = "sc-service"
description = "The Hardpoint service: the local bus for other processes, and the portal and dashboard pages over HTTP and WebSocket. Ported from packages/sc-control-service."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "hardpoint-service"
path = "src/main.rs"

[dependencies]
sc-core = { path = "../sc-core" }
sc-game = { path = "../sc-game" }
fleet-proto = { path = "../fleet-proto" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
include_dir = "0.7"
percent-encoding = "2"
getrandom = "0.3"
subtle = "2"
# The version axum uses, to tell a message over the cap from other read errors.
tungstenite = { version = "0.29", default-features = false }

[dev-dependencies]
# Exact float parsing, so recording numbers match what node parsed bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
tempfile = "3"

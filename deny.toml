# cargo-deny for the workspace: `cargo deny check` at the repository root.
# Checked for the targets the app ships on (Windows) and is tested on (Linux).

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# The RustSec advisory database (the default source), fetched on each check.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only; anything else fails the check until it is reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Path dependencies between our crates count as wildcards unless a crate says `publish = false`.
# sc-app does; once sc-game, sc-core and sc-service do too, this can be "deny".
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

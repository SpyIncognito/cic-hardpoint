[package]
name = "fleet-sim"
description = "Demo fleet members for testing a CIC relay: real fleet clients with made-up handles and cards from replayed recordings. A test tool, not part of Hardpoint."
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "fleet-sim"
path = "src/main.rs"

[dependencies]
sc-service = { path = "../../crates/sc-service" }
sc-core = { path = "../../crates/sc-core" }
sc-game = { path = "../../crates/sc-game" }
fleet-proto = { path = "../../crates/fleet-proto" }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "io-util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
# The test relay from sc-service's tests: TLS with a self-signed certificate.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
